name = "review-assist-viewer"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Custom domain. The zone is on Cloudflare, so wrangler creates and manages the DNS
# record on deploy — there is no separate DNS step. This host is also the schema $id
# origin, so /schema/0.1/intent-doc.schema.json must stay resolvable here.
routes = [
  { pattern = "reviewassist.dev", custom_domain = true },
  # www exists only to 301 to the apex (see the redirect at the top of the fetch
  # handler). It has to reach the Worker to be redirected, hence a route and not a
  # bare DNS record.
  { pattern = "www.reviewassist.dev", custom_domain = true }
]

# Pinned, not left to the default. Every PR comment the App has ever posted links to
# the workers.dev host (see webhook.ts), so that hostname must keep serving — and the
# docs do not state what adding a custom domain does to it. Stating it removes the
# question. Flip to false only once no live link points at workers.dev.
workers_dev = true

# The static viewer SPA still comes out of the asset store; the Worker only handles
# /api/*. Private-repo content flows browser <-> GitHub through /api/document and is
# never cached.
#
# run_worker_first, because otherwise the asset layer answers before any Worker code
# runs and the www redirect silently cannot fire for paths that match an asset — "/"
# above all, which is the case that matters. Measured: without it, www/ returned 200
# and served the site as a second origin while www/some/path correctly 301'd. The cost
# is a Worker invocation on every asset request, which at this traffic is noise.
[assets]
run_worker_first = true
directory = "../viewer"
binding = "ASSETS"

# Required secrets (set via `wrangler secret put <NAME>`), never committed:
#   GITHUB_CLIENT_ID      — OAuth client id of your GitHub App
#   GITHUB_CLIENT_SECRET  — OAuth client secret
#   SESSION_SECRET        — random 32+ byte string; derives the AES-GCM session key
#
# No KV, no D1, no R2, no Durable Objects: the Worker is stateless by construction.
[vars]
APP_NAME = "Intent Document Viewer"
