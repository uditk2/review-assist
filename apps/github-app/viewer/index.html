<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Why is this needed?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "AI agents now write code faster than any team can read it by hand. The context that makes review fast (what was asked, what was tried and abandoned, what was actually verified) disappears the moment the pull request opens. Review Assist captures it at the source: the agent's session becomes an Intent Document, a validator proves it actually covers the diff, and a GitHub App renders it as a guided review on the pull request."
      }
    },
    {
      "@type": "Question",
      "name": "How does it work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Your agent distills its session into an Intent Document as it commits. Every push, the GitHub App validates that document against the diff and names anything unexplained. Reviewers get a guided walkthrough: assumptions first, then the diff anchored stop by stop. See the architecture and internals doc at https://github.com/uditk2/review-assist/blob/main/docs/ARCHITECTURE.md for how the pieces fit together."
      }
    },
    {
      "@type": "Question",
      "name": "Is Review Assist free?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The MCP server and the GitHub App are both free and open source under Apache-2.0. There is no paid tier."
      }
    },
    {
      "@type": "Question",
      "name": "Is my code stored anywhere?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Your session transcript never leaves your machine. The GitHub App has no database: it reads the Intent Document and diff from GitHub per request, holds them in memory for that request, and serves them private, no-store to your browser. Nothing is written down, but your code does pass through the hosted service in transit. Self-host the App if that matters to you."
      }
    },
    {
      "@type": "Question",
      "name": "Can I self-host it?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Review Assist is fully open source. Run the GitHub App on your own infrastructure if you'd rather your diffs never pass through the hosted service, even in transit."
      }
    },
    {
      "@type": "Question",
      "name": "Which coding agents does it work with?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It ships tested with Claude Code, the Claude desktop app, and Codex. It's a standard MCP server, so any MCP-compatible agent client can register it."
      }
    }
  ]
}

<!-- Route facts the rest of <head> depends on, so this runs first.
     The build prerenders the landing page into #app (build/prerender.mjs), so crawlers and
     no-JS clients get real content. A PR link lands on that same "/" document, and the
     viewer only replaces #app once the document has loaded, so without the data-route flag
     the marketing page would show under every guided-review link until then. Set before
     <body> parses, so the prerendered nodes are hidden from the first paint, not after it.
     GitHub's Setup URL appends installation_id, which names an installation; it is dropped
     from the address before analytics can read it, since nothing on the page uses it.

     SITE_ANALYTICS is the one decision about analytics, and both tags below obey it:
     - Never on a PR route. A guided review's address names the repository and pull
       request, and both tools record addresses unmasked, so the only way to keep private
       repo names out is not to load them there. Site pages carry no repository data.
     - Only on reviewassist.dev. This repo is public and this file is the served asset, so
       without the gate anyone self-hosting the viewer would report their sessions into
       these projects. Neither tool has an allowed-domains setting; refusing to send is the
       only point of control. The ids are not secrets; the gate is about whose data goes.
     A PR address can also arrive without a page load: pasting a review link into a tab
     already on the site only changes the hash. The listener below is registered before
     either tag loads, on the capture phase, so it runs first: it switches both tags off,
     stops them hearing the event, and reloads, and the reload lands with SITE_ANALYTICS
     false. parseHash in the page script uses the same anchored pattern, on purpose. -->
<script>
(function () {
  var PR_ROUTE = /^#[^/]+\/[^/]+\/pull\/\d+/;
  var onPr = PR_ROUTE.test(location.hash);
  try {
    var theme = localStorage.getItem("theme");
    if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
  } catch (e) { /* storage blocked: follow the OS setting, as before */ }
  if (onPr) document.documentElement.setAttribute("data-route", "pr");
  if (/^\/installed\/?$/.test(location.pathname) && location.search.indexOf("installation_id") >= 0) {
    var q = new URLSearchParams(location.search); q.delete("installation_id");
    history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash);
  }
  window.GA_ID = "G-JMHGW95G13";
  window.SITE_ANALYTICS = location.hostname === "reviewassist.dev" && !onPr;
  if (!window.SITE_ANALYTICS) return;
  function leaveForPr(e) {
    if (!PR_ROUTE.test(location.hash)) return;
    window["ga-disable-" + window.GA_ID] = true;
    if (typeof window.clarity === "function") window.clarity("stop");
    e.stopImmediatePropagation();
    location.reload();
  }
  addEventListener("popstate", leaveForPr, true);
  addEventListener("hashchange", leaveForPr, true);
})();
</script>
<!-- Microsoft Clarity: session replays and the funnel events from track(). Worker metrics
     count invocations, which lump GitHub's webhook POSTs and every asset fetch in with real
     visitors; this separates people from machines. Masking stays Strict in the Clarity
     dashboard as a second line, in case a PR view ever renders without the gate seeing it. -->
<script type="text/javascript">
    if (window.SITE_ANALYTICS) {
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y2w90h1hhq");
    }
</script>
<!-- Google Analytics: the same funnel events, in the property the Worker also reports the
     server-side steps to (install, repositories, review posted; see worker/src/analytics.ts),
     so the whole funnel can be read in one place. Google's snippet, loaded by script rather
     than a static <script src> so the gate above can keep it off. -->
<script>
  if (window.SITE_ANALYTICS) {
    var gt = document.createElement("script");
    gt.async = true;
    gt.src = "https://www.googletagmanager.com/gtag/js?id=" + window.GA_ID;
    document.head.appendChild(gt);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    gtag("js", new Date());
    gtag("config", window.GA_ID);
  }
</script>

<script>
"use strict";
// ---------- diff parser + coverage (ported from @intentdoc/validator) ----------
function parseUnifiedDiff(diff) {
  const lines = diff.split("\n");
  const files = []; let cur = null, hunk = null, renameFrom = null;
  const FILE = /^diff --git a\/(.+?) b\/(.+)$/;
  const HUNK = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@(.*)$/;
  const flush = () => { if (cur && hunk) cur.hunks.push(hunk); hunk = null; };
  const strip = p => { p = p.trim(); if (p === "/dev/null") return p; return (p.startsWith("a/")||p.startsWith("b/")) ? p.slice(2) : p; };
  for (const line of lines) {
    const fm = FILE.exec(line);
    if (fm) { flush(); cur = { path: fm[2], hunks: [] }; files.push(cur); renameFrom = null; continue; }
    if (!cur) continue;
    if (line.startsWith("--- ")) { renameFrom = strip(line.slice(4)); continue; }
    if (line.startsWith("+++ ")) { const to = strip(line.slice(4));
      if (to === "/dev/null" && renameFrom && renameFrom !== "/dev/null") cur.path = renameFrom;
      else if (to !== "/dev/null") cur.path = to; continue; }
    const hm = HUNK.exec(line);
    if (hm) { flush(); hunk = { old_start:+hm[1], old_lines:hm[2]===undefined?1:+hm[2],
      new_start:+hm[3], new_lines:hm[4]===undefined?1:+hm[4], header: hm[5]||"", lines: [], substantive:false }; continue; }
    if (hunk && (line.startsWith("+")||line.startsWith("-")||line.startsWith(" "))) {
      hunk.lines.push(line);
      if ((line[0]==="+"||line[0]==="-") && line.slice(1).trim().length) hunk.substantive = true;
    }
  }
  flush(); return files;
}
const newRange = h => h.new_lines===0 ? [h.new_start,h.new_start] : [h.new_start, h.new_start+h.new_lines-1];
const overlap = (a,b) => a[0]<=b[1] && b[0]<=a[1];

function orderTour(tour) {
  const byParent = new Map();
  for (const s of tour) { const k = s.parent ?? null; if (!byParent.has(k)) byParent.set(k, []); byParent.get(k).push(s); }
  const out = []; const visit = p => { for (const s of (byParent.get(p)||[])) { out.push(s); visit(s.id); } };
  visit(null);
  for (const s of tour) if (!out.includes(s)) out.push(s);
  return out;
}
function computeCoverage(tour, diffFiles) {
  const anchors = [];
  tour.forEach(s => (s.anchors||[]).forEach(a => anchors.push({ path:a.path, range:newRange(a.hunk) })));
  const unexplained = []; let total = 0;
  for (const f of diffFiles) {
    if (f.path === ".intent" || f.path.startsWith(".intent/")) continue; // a doc needn't explain itself
    for (const h of f.hunks) {
    total++; const hr = newRange(h);
    const cov = anchors.some(an => an.path===f.path && overlap(an.range,hr));
    if (!cov && h.substantive) unexplained.push({ path:f.path, hunk:h });
  } }
  return { total, unexplained, explained: total - unexplained.length };
}
function hunksForStop(stop, diffFiles) {
  const res = [];
  for (const a of (stop.anchors||[])) {
    const file = diffFiles.find(f => f.path === a.path);
    const ar = newRange(a.hunk);
    if (!file || !file.hunks.some(h => overlap(newRange(h), ar))) { res.push({ path:a.path, missing:true }); continue; }
    for (const h of file.hunks) if (overlap(newRange(h), ar)) res.push({ path:a.path, hunk:h });
  }
  return res;
}

// ---------- dom helper ----------
const el = (t, props={}, ...kids) => {
  const n = document.createElement(t);
  for (const [k,v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === "class") n.className = v; else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
};

// Render any <pre class="mermaid"> nodes. securityLevel 'strict' neutralizes scripts/HTML
// in the (repo-authored) diagram source. If the CDN hasn't loaded yet, onload re-runs this.
function runMermaid(){
  if(!window.mermaid) return;
  try{
    const dark = currentTheme() === "dark";
    if(window.__mmTheme !== (dark ? "dark" : "light")){
      window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict",
        theme: dark ? "dark" : "neutral",
        flowchart:{ useMaxWidth:true }, sequence:{ useMaxWidth:true } });
      window.__mmTheme = dark ? "dark" : "light";
    }
    const nodes = [...document.querySelectorAll(".mermaid:not([data-processed])")];
    if(nodes.length) window.mermaid.run({ nodes });
  }catch(e){ /* leave the <pre> source visible as a fallback */ }
}
window.__onMermaid = runMermaid;

const CONF = {
  confirmed_by_user: { cls: "tag tag-ok", label: "confirmed by user" },
  grounded_in_code:  { cls: "tag",        label: "grounded in code" },
  unverified:        { cls: "tag tag-warn", label: "unverified" },
};
const titleCase = s => String(s||"").replace(/_/g," ");

let STATE = { data:null, files:[], coverage:null, ordered:[], view:"overview", stopIndex:0, acks:{}, me:null, comments:[], composer:null, composerSeed:"", posted:{}, reviewSubmitted:null, selAnchor:null };

/** Editorial articles and release notes have separate, crawlable route families. */
function parseBlogRoute() {
  const m = /^\/blog(?:\/([A-Za-z0-9._-]+))?\/?$/.exec(location.pathname);
  return m ? { slug: m[1] || null } : null;
}
const blogHref = v => v ? `/blog/${v}/` : "/blog/";
function parseReleaseRoute() {
  const m = /^\/releases(?:\/([A-Za-z0-9._-]+))?\/?$/.exec(location.pathname);
  return m ? { slug: m[1] || null } : null;
}
const releaseHref = v => v ? `/releases/${v}/` : "/releases/";

/** Where GitHub sends someone after installing the App (the App's Setup URL). */
const isInstalledRoute = () => /^\/installed\/?$/.test(location.pathname);

/** Anchored exactly like PR_ROUTE in <head>: that test decides whether analytics loads and
 *  when a hash change forces a reload, so the two must never disagree about a PR route. */
function parseHash() {
  const m = /^#([^/]+)\/([^/]+)\/pull\/(\d+)/.exec(location.hash);
  return m ? { owner:m[1], repo:m[2], pull:m[3] } : null;
}

/** The pages that need no data, or null on a PR route. One function, so boot and the theme
 *  toggle's re-render cannot disagree about what is on screen. */
function sitePage(){
  if (parseHash()) return null;
  const blog = parseBlogRoute();
  if (blog) return blog.slug ? renderArticlePost(blog.slug) : renderBlogIndex();
  const release = parseReleaseRoute();
  if (release) return release.slug ? renderReleasePost(release.slug) : renderReleaseIndex();
  if (isInstalledRoute()) return renderInstalled();
  return renderLanding();
}

/** Funnel events, sent to Clarity and GA. Both load only when SITE_ANALYTICS says so (see
 *  <head>): reviewassist.dev, never a PR route. So this is a no-op on PR pages, on
 *  self-hosted copies and in the prerender build. Clarity carries properties as session
 *  tags; GA takes them as event parameters. */
function track(event, tags){
  if (!window.SITE_ANALYTICS) return;
  if (typeof window.clarity === "function") {
    for (const [k, v] of Object.entries(tags || {})) window.clarity("set", k, String(v));
    window.clarity("event", event);
  }
  if (typeof window.gtag === "function") window.gtag("event", event, tags || {});
}

let PAGE_TRACKED = false;

async function boot() {
  const app = document.getElementById("app");
  stopDemo();
  // Release notes used to live at "#/blog/<v>", and those links are out in the world.
  const legacy = /^#\/blog(?:\/([A-Za-z0-9._-]+))?\/?$/.exec(location.hash);
  if (legacy) return location.replace(blogHref(legacy[1]));
  const oldRelease = parseBlogRoute();
  if (oldRelease?.slug && RELEASES.some(r => r.v === oldRelease.slug))
    return location.replace(releaseHref(oldRelease.slug));

  const page = sitePage();
  if (page) {
    app.replaceChildren(page);
    // "/#permissions" from another page has to land on the section, not the top.
    let target = null;
    try { target = location.hash.length > 1 && document.getElementById(decodeURIComponent(location.hash.slice(1))); }
    catch { /* a malformed fragment is just not a section id */ }
    target ? target.scrollIntoView() : window.scrollTo(0, 0);
    // Once per page. boot also runs on every hash change (back, forward, a plain #anchor),
    // and counting each of those would inflate the first step of the funnel.
    if (!PAGE_TRACKED) {
      PAGE_TRACKED = true;
      if (parseBlogRoute()) track("blog_view");
      else if (parseReleaseRoute()) track("release_notes_view");
      else if (isInstalledRoute()) track("app_install_return", { setup_action: installSetupAction() || "none" });
      else track("landing_view");
    }
    return;
  }

  const ref = parseHash();
  app.replaceChildren(centered(el("p",{class:"text-ink-500"},"Loading…")));
  try { STATE.me = (await (await fetch("/api/me")).json()).login; } catch {}
  const res = await fetch(`/api/document?owner=${encodeURIComponent(ref.owner)}&repo=${encodeURIComponent(ref.repo)}&pull=${ref.pull}`);
  if (res.status === 401) return renderLogin(ref);
  const data = await res.json();
  if (data.error) return app.replaceChildren(centered(el("h1",{},"Couldn’t load this PR"), el("p",{class:"text-ink-500"}, data.error)));
  if (data.document_missing || !data.document) return app.replaceChildren(centered(
    el("h1",{},"No Intent Document"),
    el("p",{class:"max-w-prose text-ink-500"},"This pull request has no .intent document on its head commit. The authoring agent should generate one before review.")));

  STATE.data = data;
  STATE.files = parseUnifiedDiff(data.diff || "");
  STATE.ordered = orderTour(data.document.tour || []);
  // hunk id -> index of the stop covering it. Buildable only because anchor expansion now
  // keeps the id it was written as; before, a stored stop held a path and line ranges, so
  // every other field's hunk ids had nothing to match and rendered as dead labels.
  STATE.stopOfHunk = {};
  STATE.ordered.forEach((stop, i) => {
    for (const a of stop.anchors || []) if (a && a.id && !(a.id in STATE.stopOfHunk)) STATE.stopOfHunk[a.id] = i;
  });
  STATE.coverage = computeCoverage(data.document.tour || [], STATE.files);
  STATE.view = "overview"; STATE.stopIndex = 0;
  STATE.comments = []; STATE.composer = null; STATE.reviewSubmitted = null;
  render();
  loadComments().then(render); // overlay PR review comments once fetched
}

function centered(...kids){ return el("div",{class:"mx-auto flex min-h-screen max-w-prose flex-col items-start justify-center gap-3 px-6"}, ...kids); }

const REPO_URL = "https://github.com/uditk2/review-assist";
const APP_INSTALL = "https://github.com/apps/review-assist-guided-review";
const MCPB_DOWNLOAD = REPO_URL + "/releases/latest/download/review-assist-mcp.mcpb";

/** Every "Install the GitHub App" button. The placement tag is what tells the hero's CTA
 *  apart from the install step's when reading the funnel. GitHub's own install pages are
 *  out of reach, so this click is the last step the site can see before the Setup URL. */
function installAppLink(placement, label = "Install the GitHub App →"){
  return el("a",{class:"btn-primary", href:APP_INSTALL,
    onclick:()=>track("install_app_click", { install_cta: placement })}, label);
}

/** An in-page link that scrolls instead of changing the hash: a hash change re-runs boot,
 *  which would rebuild the page and restart the demo. Without JS it is a plain anchor. */
function jumpLink(id, cls, ...kids){
  return el("a",{class:cls, href:"#"+id, onclick:(e)=>{
    e.preventDefault();
    document.getElementById(id)?.scrollIntoView({behavior:"smooth"});
  }}, ...kids);
}

function copyIcon(){
  return `<svg width="14" height="14" viewBox="0 0 16 16" class="fill-none stroke-ink-500" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="5.5" y="5.5" width="8" height="8" rx="1.2"></rect>
    <path d="M3 10.5V3.7C3 3.3 3.3 3 3.7 3H10"></path>
  </svg>`;
}

function chevronIcon(){
  return `<svg width="16" height="16" viewBox="0 0 16 16" class="fill-none stroke-ink-400" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 6l4 4 4-4"></path>
  </svg>`;
}

function codeBlock(text, onCopy){
  const body = el("div",{class:"diff-body"});
  for (const line of String(text).split("\n")) body.append(el("code",{class:"diff-line is-ctx"}, line));
  const copyBtn = el("button",{
    class:"flex items-center gap-1.5 font-mono text-micro text-ink-500 hover:text-accent-600",
    title:"Copy to clipboard",
    onclick: async (e) => {
      onCopy?.();
      try { await navigator.clipboard.writeText(text); } catch {}
      const label = e.currentTarget.querySelector(".copy-label");
      if (!label) return;
      const prevHtml = label.innerHTML;
      label.textContent = "Copied";
      setTimeout(() => { label.innerHTML = prevHtml; }, 1200);
    }},
    el("span",{class:"copy-label", html: copyIcon()}));
  return el("div",{class:"diff"}, el("div",{class:"diff-file"}, el("span",{}, "Terminal"), copyBtn), body);

/** Which surface registers the server — three different answers, so three tabs instead of
 *  stacking every command and caveat into one block regardless of which agent a reader uses.
 *  Self-contained: repaints its own DOM on click, the same pattern as the hero demo. */
function installTabs(){
  const copied = agent => () => track("mcp_command_copy", { agent });
  const tabs = [
    { key:"claude-code", label:"Claude Code", render: () => el("div",{},
        codeBlock("claude mcp add -s user review-assist -- npx -y review-assist-mcp", copied("claude-code")),
        el("p",{class:"mt-2 text-sm text-ink-500", html:richHtml(
          "Editor launched from the Dock? `npx` is not on a GUI app’s PATH — [use the form in the README](" + REPO_URL + "#claude-code).")})) },
    { key:"codex", label:"Codex", render: () => el("div",{},
        codeBlock("codex mcp add review-assist -- npx -y review-assist-mcp", copied("codex"))) },
    { key:"claude-desktop", label:"Claude Desktop", render: () => el("div",{},
        el("p",{class:"text-sm text-ink-600"}, "No terminal needed: download the bundle and open it — Claude Desktop installs the server automatically."),
        el("a",{class:"btn-primary mt-3", href:MCPB_DOWNLOAD, onclick:()=>track("mcpb_download")}, "Download the .mcpb →")) },
  ];
  let active = tabs[0].key;
  const bar = el("div",{class:"mb-3 flex gap-1 border-b border-ink-200"});
  const content = el("div",{});
  function paint(){
    bar.replaceChildren(...tabs.map(t => el("button",{
      class:"-mb-px border-b-2 px-3 py-2 text-sm font-medium "
        + (t.key===active ? "border-accent-600 text-ink-900" : "border-transparent text-ink-500 hover:text-ink-900"),
      onclick: () => { active = t.key; paint(); }
    }, t.label)));
    content.replaceChildren(tabs.find(t => t.key===active).render());
  }
  paint();
  return el("div",{}, bar, content);
}

/** The parts of a guided review, each named and shown with an excerpt from the example

 *  anatomy of the real panel it comes from, so no two rows look alike (see DESIGN.md).
 *  Claims stop at what the product does: coverage is "every hunk tied to a reason", not a
 *  judgement of whether the code is right. */
function renderReviewerGets(){
  const S = SAMPLE;
  const part = (title, body, excerpt) => el("div",{class:"grid grid-cols-1 gap-4 border-t border-ink-200 py-6 lg:grid-cols-[minmax(0,24rem)_minmax(0,1fr)] lg:gap-10"},
    el("div",{}, el("h3",{class:"font-medium text-ink-900"}, title), el("p",{class:"mt-1 text-ink-600"}, body)),
    el("div",{class:"min-w-0"}, excerpt));
  const conf = CONF[S.assumption.confidence];

  return el("section",{class:"mb-16", id:"what-you-get"},
    el("h2",{class:"section-h mb-2"}, "What a reviewer gets"),
    el("p",{class:"mb-4 max-w-prose text-ink-600"}, "Six parts, the same on every pull request. The excerpts come from the example pull request in the panel above."),

    part("Overview",
      "What was asked, what is out of scope, the approach taken and why, and the alternatives that were tried and dropped.",

        el("div",{class:"mt-4 border-l-2 border-ink-200 pl-3 text-sm"},
          el("p",{class:"text-ink-500"}, "Considered and rejected"),
          el("p",{class:"text-ink-800"}, el("span",{class:"font-medium"},"Tried. "), S.trial.what),
          el("p",{class:"text-ink-600"}, "Abandoned: " + S.trial.why_abandoned)))),

    part("Assumptions to check first",
      "What the change takes for granted, how sure the agent is, what breaks if it is wrong, and how to check. Accepting or flagging one starts a comment on the pull request.",
      el("div",{class:"card"},
        el("div",{class:"flex items-start justify-between gap-3"},
          el("div",{}, el("span",{class:"id-chip mr-2"}, S.assumption.id), el("span",{class:"font-medium"}, S.assumption.assumption)),
          el("span",{class:conf.cls}, conf.label)),
        el("dl",{class:"mt-2 space-y-1 text-sm text-ink-600"},
          row("If wrong", S.assumption.impact_if_wrong),

const DWELL = 6000;
let DEMO_STATE = { i: 0, timer: null, auto: true, files: null,
                   panel: null, visible: true, hover: false, maxH: 0, width: 0 };

function reducedMotion(){
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/** Any route change leaves the interval running otherwise, painting into a dead node. */
function stopDemo(){
  if (DEMO_STATE.timer) { clearInterval(DEMO_STATE.timer); DEMO_STATE.timer = null; }
}

function demoGoto(i, byHand){
  DEMO_STATE.i = (i + DEMO.stops.length) % DEMO.stops.length;
  // A click is a statement of intent: stop moving the thing the reader is reading.
  if (byHand) { DEMO_STATE.auto = false; stopDemo(); }
  paintDemo();
}

function startDemo(){
  stopDemo();
  if (!DEMO_STATE.auto || reducedMotion()) return;
  DEMO_STATE.timer = setInterval(() => {
    if (!document.getElementById("demo-body")) return stopDemo();
    DEMO_STATE.i = (DEMO_STATE.i + 1) % DEMO.stops.length;
    paintDemo();
  }, DWELL);
}

/** The demo runs only while it is on screen and unhovered. Each input sets its own flag and
 *  calls this, so a stale mouseleave (fired because the panel scrolled out from under a
 *  parked pointer) cannot restart a demo that visibility has already put to sleep. */
function syncDemo(){
  if (!(DEMO_STATE.auto && DEMO_STATE.visible && !DEMO_STATE.hover)) return stopDemo();
  if (DEMO_STATE.timer) return; // already running: leave the dwell where the reader found it
  paintDemo();                  // paintDemo owns the progress bar, so restart the two together
  startDemo();
}

/** Only ever scrolls the rail's own horizontal overflow. scrollIntoView walked up to the
 *  document and yanked the whole page back to the demo every dwell, which is what a reader
 *  further down the page saw as the page scrolling by itself. */
function keepActiveStopInRail(rail){
  const active = rail.querySelector(".is-active");
  if (!active || rail.scrollWidth <= rail.clientWidth) return; // column layout: nothing to scroll
  const a = active.getBoundingClientRect(), r = rail.getBoundingClientRect();
  rail.scrollLeft += (a.left - r.left) - (r.width - a.width) / 2;
}

function watchDemoVisibility(panel){
  if (!window.IntersectionObserver) return;
  const io = new IntersectionObserver(entries => {
    // A route change leaves this observer bound to a detached panel. Its stop must not reach
    // through the shared state and cancel the live one.
    if (DEMO_STATE.panel !== panel || !panel.isConnected) return io.disconnect();
    DEMO_STATE.visible = entries[entries.length - 1].isIntersecting;
    syncDemo();
  }, { threshold: 0 }); // any sliver counts: a panel taller than the viewport never hits a ratio
  io.observe(panel);
}

/** Stops differ in height once the rail stacks above the pane, so every advance would reflow
 *  the whole page under a reader below the hero. Hold the panel at the tallest stop seen at
 *  this width; reading the natural height back before the frame paints keeps it flicker-free. */
function lockDemoHeight(panel){
  if (!panel) return;
  if (DEMO_STATE.width !== panel.clientWidth) { DEMO_STATE.width = panel.clientWidth; DEMO_STATE.maxH = 0; }
  panel.style.minHeight = "";
  DEMO_STATE.maxH = Math.max(DEMO_STATE.maxH, panel.offsetHeight);
  panel.style.minHeight = DEMO_STATE.maxH + "px";
}

function renderDemo(){
  DEMO_STATE.files = parseUnifiedDiff(DEMO.diff);
  DEMO_STATE.i = 0; DEMO_STATE.auto = true;
  DEMO_STATE.visible = true; DEMO_STATE.hover = false; DEMO_STATE.maxH = 0; DEMO_STATE.width = 0;

  const panel = el("div",{class:"demo demo-tilt"},
    el("div",{class:"demo-bar"},
      el("span",{class:"font-mono"}, DEMO.repo),
      el("span",{class:"id-chip"}, "#"+DEMO.pull),
      el("span",{class:"hidden truncate text-ink-500 sm:inline"}, DEMO.title),
      el("span",{class:"flex-1"}),
      el("span",{class:"tag tag-ok"}, "4 of 4 changes explained")),
    el("div",{class:"demo-track"}, el("div",{class:"demo-progress", id:"demo-progress"})),
    el("div",{class:"demo-grid", id:"demo-body"}));

  DEMO_STATE.panel = panel;

  // Pausing on hover keeps a reader from losing the stop they are mid-way through.
  panel.addEventListener("mouseenter", () => { DEMO_STATE.hover = true;  syncDemo(); });
  panel.addEventListener("mouseleave", () => { DEMO_STATE.hover = false; syncDemo(); });

  // Hover has no touch equivalent, and a panel nobody can see has no reader to keep: pause
  // whenever the demo scrolls off screen, so the rest of the page sits still. Observing is
  // deferred with the first paint, because isConnected only answers once the panel is in.
  setTimeout(() => { syncDemo(); watchDemoVisibility(panel); }, 0);
  return panel;
}

function paintDemo(){
  const body = document.getElementById("demo-body");
  if (!body) return stopDemo();
  const s = DEMO.stops[DEMO_STATE.i];

  const rail = el("div",{class:"demo-rail"},
    ...DEMO.stops.map((t, i) => el("button",{
      class:"demo-stop"+(i===DEMO_STATE.i ? " is-active" : ""),
      onclick:()=>demoGoto(i, true)},
      el("span",{class:"id-chip"}, t.id),
      el("span",{class:"truncate"}, t.title))));

  const pane = el("div",{class:"demo-pane"},
    el("div",{class:"mb-2 flex items-center gap-2"},
      el("span",{class:"eyebrow"}, `stop ${String(DEMO_STATE.i+1).padStart(2,"0")} / ${String(DEMO.stops.length).padStart(2,"0")}`),
      el("span",{class:"tag"}, s.role)),
    el("p",{class:"mb-2 font-medium text-ink-900"}, s.title),
    el("p",{class:"text-sm text-ink-700"}, el("span",{class:"font-medium text-ink-900"},"What. "), s.what),
    el("p",{class:"mt-1 text-sm text-ink-700"}, el("span",{class:"font-medium text-ink-900"},"Why. "), s.why),
    s.attention ? el("div",{class:"note mt-3 text-sm"},
      el("p",{class:"mb-0.5 font-mono text-micro text-warn-fg"},"reviewer note"),
      el("p",{class:"text-ink-800"}, s.attention)) : null,
    el("div",{class:"mt-3 space-y-2"},
      ...hunksForStop(s, DEMO_STATE.files).map(hp => hp.missing ? null : renderHunk(hp.path, hp.hunk))));

  body.replaceChildren(rail, pane);
  lockDemoHeight(body.closest(".demo"));
  keepActiveStopInRail(rail);

  // Restart the dwell bar from zero, in the direction of travel.
  const bar = document.getElementById("demo-progress");
  if (bar) {
    const run = DEMO_STATE.auto && !reducedMotion();
    bar.style.transition = "none";
    bar.style.width = "0%";
    void bar.offsetWidth; // commit the zero state, or the two writes coalesce into no-op
    if (run) {
      bar.style.transition = `width ${DWELL}ms linear`;
      bar.style.width = "100%";
    }
  }
}

/** Minimal inline markup for authored prose: `code`, **bold**, and [text](href). */
function richHtml(text){
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // Code spans are set aside before emphasis runs, and put back last. Otherwise an asterisk
  // inside one (a glob like `intent-*.md`) paired with one in the next span and italicised
  // everything between them, eating both asterisks.
  const code = [];
  return esc(text)
    .replace(/`([^`]+)`/g, (m, c) => `\u0000${code.push(c) - 1}\u0000`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong class=\"font-medium text-ink-900\">$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
      (m, text, href) => /^(https?:|#|\/)/i.test(href) ? `<a href="${href}">${text}</a>` : text)
    .replace(/\u0000(\d+)\u0000/g, (m, i) => `<code class="code-inline">${code[i]}</code>`);
}

  const r = RELEASES[i];
  const body = el("div",{});
  for (const b of r.body){
    if (typeof b === "string"){ body.append(el("p",{class:"mt-4 text-ink-700", html:richHtml(b)})); continue; }
    if (b.h){ body.append(el("h2",{class:"section-h mb-1 mt-8"}, b.h)); continue; }
    if (b.ul){ body.append(el("ul",{class:"mt-4 space-y-2"}, ...b.ul.map(t =>
      el("li",{class:"flex gap-2.5 text-ink-700"},
        el("span",{class:"select-none pt-0.5 text-ink-400"},"•"),
        el("span",{html:richHtml(t)}))))); continue; }
    if (b.code){ body.append(el("div",{class:"mt-4"}, codeBlock(b.code))); continue; }
    if (b.note){ body.append(el("p",{class:"note mt-4", html:richHtml(b.note)})); continue; }
  }

  const newer = RELEASES[i-1], older = RELEASES[i+1];
  return el("div",{class:"page min-h-screen"},
    siteHeader("releases"),
    el("main",{class:"mx-auto max-w-3xl px-6 py-16"},
      el("p",{class:"mb-4 text-sm"}, el("a",{class:"text-ink-500", href:releaseHref()}, "← Release notes")),
      el("article",{},
        el("div",{class:"grid-field"},
          el("div",{class:"mb-2 flex items-baseline gap-2.5"},
            el("span",{class:"tag"}, "v"+r.v),
            el("span",{class:"text-sm text-ink-500"}, r.date)),
          el("h1",{class:"mb-3 text-[1.75rem] leading-tight"}, r.title),
          el("p",{class:"text-[1.05rem] text-ink-700", html:richHtml(r.summary)})),
        body,
        el("p",{class:"mt-8 border-t border-ink-200 pt-4 text-sm text-ink-500"},
          "Commits for this release: ",
          el("a",{href: REPO_URL + (older ? "/compare/v"+older.v+"...v"+r.v : "/commits/v"+r.v)}, older ? "v"+older.v+"…v"+r.v : "history to v"+r.v))),
      el("nav",{class:"mt-10 flex justify-between gap-4 border-t border-ink-200 pt-5 text-sm"},
        older ? el("a",{href:releaseHref(older.v)}, "← v"+older.v) : el("span",{}),
        newer ? el("a",{href:releaseHref(newer.v)}, "v"+newer.v+" →") : el("span",{})),
      el("div",{class:"mt-10"}, siteFooter())));
}

  document.getElementById("app").replaceChildren(centered(
    el("h1",{},"Sign in to review"),
    el("p",{class:"text-ink-600"}, `${ref.owner}/${ref.repo} #${ref.pull} — sign in with GitHub to load this walkthrough.`),
    el("a",{class:"btn-primary mt-2", href:`/api/login?return=${back}`}, "Sign in with GitHub")));
}

function render(){
  const doc = STATE.data.document, m = STATE.data.meta, cov = STATE.coverage;
  const covOk = cov.unexplained.length === 0;
  const covTag = el("span",{class: (covOk ? "tag tag-ok" : "tag tag-warn") + " hidden sm:inline-flex"},
    covOk ? `${cov.explained} of ${cov.total} changes explained`
          : `${cov.unexplained.length} change${cov.unexplained.length>1?"s":""} uncovered`);

  const header = el("header",{class:"sticky top-0 z-20 border-b border-ink-200 bg-canvas"},
    el("div",{class:"flex w-full max-w-[120rem] items-center gap-3 px-4 py-3 md:px-6"},
      el("span",{class:"min-w-0 truncate font-mono text-sm text-ink-700"}, `${m.owner}/${m.repo}`),
      el("span",{class:"id-chip shrink-0"}, `#${m.pull}`),
      el("span",{class:"hidden truncate text-ink-500 sm:inline"}, m.title || ""),
      el("span",{class:"flex-1"}),
      covTag,
      STATE.me ? el("span",{class:"tag hidden md:inline-flex"}, "@"+STATE.me) : null,
      themeToggle()));

  const link = (view, label, badge) => el("button",
    {class:"nav-link"+(STATE.view===view?" is-active":""), onclick:()=>{STATE.view=view;render();}},
    el("span",{}, label), badge);

  const goStop = i => { STATE.view="tour"; STATE.stopIndex=i; render(); };

  const nav = el("nav",{class:"rail"},
    el("p",{class:"eyebrow px-2.5 pb-2"},"Review"),
    link("overview","Overview"),
    link("verify","Verification"),
    cov.unexplained.length ? link("coverage","Uncovered changes", el("span",{class:"ml-auto tag tag-warn"}, cov.unexplained.length)) : null,
    STATE.me ? link("submit","Submit review", STATE.reviewSubmitted ? el("span",{class:"ml-auto tag tag-ok"}, "sent") : null) : null,
    el("p",{class:"eyebrow px-2.5 pb-2 pt-5"},"Walkthrough"),
    // A supporting or incidental stop is dimmed rather than hidden. Every coverage-required
    // hunk must land in some stop, so hiding one would make a reviewer unable to reach the
    // code it explains — but a list where churn looks as important as a behaviour change is
    // how fourteen stops become undifferentiated.
    //
    // A core stop with something still uncertain carries a count, because that is where the
    // walk is worth slowing down.
    ...STATE.ordered.map((s,i)=>{
      const core = s.role === "core";
      const live = liveForStop(doc, stopHunkIds(s));
      const n = live.assumptions.length + live.unresolved.length + live.questions.length + live.unverified.length;
      return el("button",
        {class:"nav-link"+(STATE.view==="tour"&&STATE.stopIndex===i?" is-active":"")+(core?"":" opacity-60"),
         title: core ? s.title : s.title+" ("+s.role+")", onclick:()=>goStop(i)},
        el("span",{class:"id-chip"}, s.id),
        el("span",{class:"truncate"+(core?"":" text-ink-500")}, s.title),
        n ? el("span",{class:"ml-auto tag tag-warn"}, String(n)) : null);
    }));

  // The same navigation, as a scrolling strip, for the widths where the rail is hidden.
  const chip = (view, label, on) => el("button",
    {class:"chip-link"+(on?" is-active":""), onclick:()=>{STATE.view=view;render();}}, label);
  const railbar = el("div",{class:"railbar"},
    el("span",{class:(covOk ? "tag tag-ok" : "tag tag-warn") + " shrink-0 sm:hidden"},
      covOk ? `${cov.explained}/${cov.total} explained` : `${cov.unexplained.length} uncovered`),
    chip("overview","Overview", STATE.view==="overview"),
    chip("verify","Verification", STATE.view==="verify"),
    cov.unexplained.length ? chip("coverage","Uncovered", STATE.view==="coverage") : null,
    STATE.me ? chip("submit","Submit", STATE.view==="submit") : null,
    ...STATE.ordered.map((s,i)=>el("button",
      {class:"chip-link"+(STATE.view==="tour"&&STATE.stopIndex===i?" is-active":""), onclick:()=>goStop(i)},
      el("span",{class:"id-chip"}, s.id))));

  // Prose views keep a reading measure; the code-bearing views get the whole canvas.
  const wide = STATE.view !== "submit";
  const main = el("main",{class:"view"},
    el("div",{class: wide ? "view-wide" : "view-prose"},
      STATE.view==="overview" ? renderOverview(doc)
      : STATE.view==="verify" ? renderVerify(doc)
      : STATE.view==="coverage" ? renderCoverage()
      : STATE.view==="submit" ? renderSubmitReview()
      : renderStop()));

  document.getElementById("app").replaceChildren(header, railbar, el("div",{class:"shell"}, nav, main));
  runMermaid();
}

function currentTheme() {
  const attr = document.documentElement.getAttribute("data-theme");
  if (attr) return attr;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function themeToggle() {
  const dark = currentTheme() === "dark";
  return el("button",{
    class:"btn-ghost !px-2.5 !py-1", title:"Toggle light / dark",
    onclick:()=>{
      const next = dark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      // The release notes are separate pages now, not views of this one, so a choice that
      // lived only on <html> reset on every link. Read back in <head>, before first paint.
      try { localStorage.setItem("theme", next); } catch {}
      rerenderCurrent();
    }
  }, dark ? "Light" : "Dark");
}

/** Re-render whichever view is on screen, keeping the scroll position. The header is
 *  shared by three routes, so the toggle cannot assume the PR view is the live one. */
function rerenderCurrent() {
  stopDemo();
  const y = window.scrollY;
  const page = sitePage();
  if (page) document.getElementById("app").replaceChildren(page);
  else render();
  window.scrollTo(0, y);
}

// Document fields are point lists: "- one\n- two". As a text node the newlines collapse
// and the dashes show up mid-sentence, so split them back into a real list. A field with
// no bullets stays inline, which is what the single-point fields want.
/**
 * A hunk id as a chip, navigating to the stop covering it when there is one.
 *
 * Falls back to a plain label rather than a dead button: a chip that looks clickable and
 * does nothing is worse than one that does not pretend. That happens for a document
 * written before anchors kept their ids, and for an id no stop covers.
 */
function hunkChip(id){
  const i = STATE.stopOfHunk ? STATE.stopOfHunk[id] : undefined;
  if (i === undefined) return el("span",{class:"id-chip ml-1"}, id);
  return el("button",{class:"id-chip ml-1 cursor-pointer", title:"Go to the stop covering "+id,
    onclick:()=>{ STATE.view="tour"; STATE.stopIndex=i; render(); }}, id);
}

/** Hunk-id chips for a list of ids, or null when there are none. */
function hunkChips(ids){
  const list = (ids || []).filter(Boolean);
  return list.length ? el("span",{class:"shrink-0"}, ...list.map(hunkChip)) : null;
}

function points(text, cls){
  const lines = String(text ?? "").split("\n").filter(l => l.trim());
  const isBullet = l => /^[-*+]\s+/.test(l.trim());
  if (lines.length <= 1 || !lines.some(isBullet)) return el("span",{class:cls}, String(text ?? ""));
  const list = el("ul",{class:"list-disc space-y-1 pl-5 "+(cls||"")});
  let li = null;
  for (const l of lines){
    const t = l.trim();
    if (isBullet(t)) { li = el("li",{}, t.replace(/^[-*+]\s+/, "")); list.append(li); }
    else if (li) li.append(" " + t);            // continuation of the bullet above
    else list.append(el("li",{}, t));
  }
  return list;
}

function labeled(label, ...body){
  if (body.length === 1 && body[0] && body[0].tagName === "UL")
    return el("div",{class:"mt-3"}, el("p",{class:"font-medium text-ink-900"}, label), body[0]);
  return el("p",{class:"mt-3"}, el("span",{class:"font-medium text-ink-900"}, label+" "), ...body);
}

/**
 * How many anchored items moved to the walkthrough, so the Overview can say so.
 *
 * Without this the Overview looks thinner than the document is, and a reader cannot tell
 * whether something was dropped or relocated. Showing the item in both places instead
 * would be the duplication this redesign exists to remove.
 */
function movedToStops(doc){
  const anchored = xs => (xs || []).filter(x => (x.anchors || []).length).length;
  const nv = (doc.verification?.not_verified || []).filter(n => typeof n !== "string" && (n.anchors || []).length).length;
  return anchored((doc.assumptions || []).filter(a => (a.confidence || "unverified") === "unverified"))
    + anchored(doc.unresolved) + anchored(doc.open_questions) + nv;
}

function renderOverview(doc){
  const p = doc.problem;
  const f = document.createDocumentFragment();
  const left = el("div",{class:"ov-main"});
  const right = el("div",{class:"min-w-0"});
  left.append(el("section",{class:"grid-field mb-8"},
    el("p",{class:"eyebrow mb-1"}, p.origin==="emerged_during_session" ? "The problem was defined over the course of the session" : "Problem stated up front"),
    el("h1",{class:"mb-3"},"Overview"),
    el("blockquote",{class:"border-l-2 border-ink-300 pl-4 text-[1.05rem] leading-relaxed text-ink-800"}, p.statement)));

  if (p.out_of_scope?.length) left.append(section("Out of scope",
    el("ul",{class:"list-disc space-y-1 pl-5 text-ink-700"}, ...p.out_of_scope.map(x=>el("li",{},x)))));

  // Only the UNVERIFIED assumptions are reading. `grounded_in_code` and `confirmed_by_user`
  // are settled — 40 of the 68 in this repo's own documents, and mostly the agent scoping
  // the document rather than describing the code. A settled assumption is not a thing to
  // review, so it does not take a reviewer's minute. Mirrors the validator's renderer.
  //
  // And only the ones belonging to the WHOLE change stay here. An assumption anchored to a
  // hunk is shown at that stop instead, where a reviewer is looking at the code it bears
  // on; repeating it here would say it twice. `movedToStops` reports the count so the page
  // never looks as though something went missing.
  const liveAssumptions = (doc.assumptions || []).filter(a =>
    (a.confidence || "unverified") === "unverified" && !(a.anchors || []).length);
  const moved = movedToStops(doc);
  if (moved) left.append(el("p",{class:"mb-6 text-sm text-ink-500"},
    moved + " more " + (moved===1?"item is":"items are") + " attached to walkthrough stops, shown where the code is."));
  if (liveAssumptions.length){
    const sec = section("Assumptions");
    sec.append(el("p",{class:"-mt-2 mb-3 text-sm text-ink-500"},"About the change as a whole, and unverified. If any is wrong, the change likely needs rework."));
    for (const a of liveAssumptions){
      const conf = CONF[a.confidence] || CONF.unverified;
      const state = STATE.acks[a.id];
      sec.append(el("div",{class:"card mb-3"},
        el("div",{class:"flex items-start justify-between gap-3"},
          el("div",{}, el("span",{class:"id-chip mr-2"},a.id), el("span",{class:"font-medium"}, a.assumption)),
          el("span",{class:"shrink-0"}, el("span",{class:conf.cls}, conf.label), hunkChips(a.anchors))),
        el("dl",{class:"mt-2 space-y-1 text-sm text-ink-600"},
          row("If wrong", a.impact_if_wrong),
          a.how_to_verify ? row("How to verify", a.how_to_verify) : null),
        el("div",{class:"mt-3 flex gap-2"},
          el("button",{class:"btn-ghost"+(state==="accept"?" is-on":""), onclick:()=>assumeAction(a,"accept")}, "Accept"),
          el("button",{class:"btn-ghost"+(state==="flag"?" is-on":""), onclick:()=>assumeAction(a,"flag")}, "Flag for discussion")),
        STATE.composer==="assume:"+a.id ? renderGlobalComposer("assume:"+a.id, STATE.composerSeed) : null,
        STATE.posted["assume:"+a.id] ? el("p",{class:"mt-2 text-sm text-ink-500"}, "\u2713 Posted to the PR discussion.") : null));
    }
    right.append(sec);
  }

  const globalQuestions = (doc.open_questions || []).filter(q => !(q.anchors || []).length);
  if (globalQuestions.length){
    const sec = section("Open questions");
    for (const q of globalQuestions) sec.append(el("div",{class:"card mb-3"},
      el("div",{class:"flex items-start justify-between gap-3"},
        el("div",{}, el("span",{class:"id-chip mr-2"},q.id), el("span",{class:"font-medium"}, q.question)),
        hunkChips(q.anchors)),
      q.context ? el("p",{class:"mt-1.5 text-sm text-ink-600"}, q.context) : null));
    right.append(sec);
  }

  // Raised and not settled, open by default and ahead of the lookup.
  //
  // `unanswered` leads deliberately. Measured across 32 runs, 67 of 279 diff-provoked
  // questions got no reply at all, and they include a secret blast radius and an unpinned
  // image. An unanswered question about a code risk means the risk was never considered,
  // which makes it the strongest finding here rather than the weakest.
  const globalUnresolved = (doc.unresolved || []).filter(u => !(u.anchors || []).length);
  if (globalUnresolved.length){
    const DISPOSITION = {
      unanswered: ["Never answered", "tag tag-warn", "Nobody considered this."],
      escalated: ["Asked for your eyes", "tag tag-warn", "The developer wants a human to look here."],
      accepted_partial: ["Known and shipped", "tag", "A risk the developer took knowingly."],
    };
    const order = { unanswered: 0, escalated: 1, accepted_partial: 2 };
    const sorted = [...globalUnresolved].sort((a,b) => (order[a.disposition] ?? 9) - (order[b.disposition] ?? 9));
    const sec = section("Raised and not settled");
    for (const u of sorted){
      const [label, cls, gloss] = DISPOSITION[u.disposition] || ["Unsettled", "tag", ""];
      const anchors = (u.anchors || []).filter(Boolean);
      sec.append(el("div",{class:"card mb-3"},
        el("div",{class:"flex items-start justify-between gap-3"},
          el("span",{class:"font-medium"}, u.question),
          el("span",{class:"shrink-0"},
            el("span",{class:cls}, label),
            hunkChips(anchors))),
        gloss ? el("p",{class:"mt-1.5 text-sm text-ink-500"}, gloss) : null,
        u.note ? points(u.note, "mt-2 text-sm text-ink-700") : null));
    }
    right.append(sec);
  }

  // Already evaluated: a lookup, closed by default.
  //
  // An answered, grounded question is no longer a question, so it is not in the reading
  // path. But a reviewer who arrives holding the same question should find it settled
  // instead of spending minutes re-deriving the answer — and the anchors take them to the
  // hunk that settles it rather than to a paragraph about it.
  if (doc.evaluated?.length){
    const sec = section("Already evaluated");
    const body = el("div",{});
    for (const e of doc.evaluated){
      const anchors = (e.anchors || []).filter(Boolean);
      body.append(el("div",{class:"card mb-3"},
        el("div",{class:"flex items-start justify-between gap-3"},
          el("span",{class:"font-medium"}, e.question),
          // Plain labels, not links. `evaluated.anchors` are hunk ids from the diff the
          // interview ran against, while a stored tour stop's anchors are path plus line
          // ranges — so there is nothing here to match them to. A clickable chip that
          // could not navigate would be worse than a label that does not pretend to.
          hunkChips(anchors)),
        points(e.answer, "mt-2 text-sm text-ink-700")));
    }
    const d = el("details",{class:"mt-1"});
    d.append(el("summary",{class:"cursor-pointer text-sm text-ink-600"},
      doc.evaluated.length + " question" + (doc.evaluated.length===1?"":"s") + " asked during the session and answered — check here before raising one of your own"));
    d.append(body);
    sec.append(d);
    right.append(sec);
  }

  const ap = doc.approach;
  const asec = section("Approach");
  asec.append(points(ap.adopted.summary, "text-ink-800"));
  asec.append(labeled("Rationale.", points(ap.adopted.rationale, "text-ink-700")));
  if (ap.requirements?.length) asec.append(subsection(`Requirements (${ap.requirements.length})`,
    el("ul",{class:"mt-2 list-disc space-y-1 pl-5 text-ink-700"}, ...ap.requirements.map(r=>
      el("li",{}, r.text, r.source ? el("span",{class:"text-ink-400"}, " — "+r.source) : null)))));
  if (ap.trials?.length) asec.append(subsection(`Considered and rejected (${ap.trials.length})`,
    el("div",{class:"mt-2 space-y-3"}, ...ap.trials.map(t=>el("div",{class:"border-l-2 border-ink-200 pl-3"},
      el("p",{}, el("span",{class:"font-medium"},"Tried. "), t.what),
      el("p",{class:"text-sm text-ink-600"}, "Outcome — "+t.outcome),
      el("p",{class:"text-sm text-ink-600"}, "Abandoned — "+t.why_abandoned))))));
  left.append(asec);

  if (doc.diagrams?.length){
    const dsec = section("Diagrams");
    for (const d of doc.diagrams){
      dsec.append(el("figure",{class:"mb-5"},
        el("figcaption",{class:"mb-1.5 text-sm font-medium text-ink-700"}, d.title),
        el("pre",{class:"mermaid overflow-x-auto rounded-lg border border-ink-200 bg-ink-50 p-3 text-center"}, d.mermaid),
        d.caption ? el("p",{class:"mt-1 text-sm text-ink-500"}, d.caption) : null));
    }
    left.append(dsec);
  }

  f.append(el("div",{class:"ov-split"}, left, right));
  f.append(el("div",{class:"mt-8 flex items-center gap-3 border-t border-ink-200 pt-6"},
    el("button",{class:"btn-primary", onclick:()=>{STATE.view="tour";STATE.stopIndex=0;render();}}, "Start walkthrough"),
    el("span",{class:"text-sm text-ink-500"}, `${STATE.ordered.length} stops`)));
  return f;
}

function section(title, ...body){ return el("section",{class:"mb-8"}, el("h2",{class:"section-h"}, title), ...body); }
function row(k,v){ return el("div",{class:"flex gap-2"}, el("dt",{class:"shrink-0 text-ink-500"}, k+":"), el("dd",{}, v)); }
function subsection(title, body){ return el("div",{class:"mt-3 border-t border-ink-200 pt-3"}, el("h3",{class:"text-sm font-medium text-ink-600"}, title), body); }
function ackBtn(id,kind,label,state){ return el("button",{class:"btn-ghost"+(state===kind?" is-on":""), onclick:()=>{STATE.acks[id]= state===kind?null:kind; render();}}, label); }

/**
 * Everything still uncertain that belongs to THIS stop.
 *
 * The point of the walk. A reviewer at a stop wants three things — what changed, what to
 * check, and what is still uncertain HERE — and the third used to live in four separate
 * lists on another page, leaving the reader to do the join by hand. Measured on this
 * repo's own documents, 54% of every document was fields with no link to the code.
 *
 * Anchored items move here; unanchored ones stay on the Overview, which is the right home
 * for something about the whole change. Nothing appears in both places: saying it twice is
 * the waste this whole redesign exists to remove.
 */
function liveForStop(doc, ids){
  const mine = a => (a || []).some(h => ids.has(h));
  const nv = (doc.verification?.not_verified || []).map(n =>
    typeof n === "string" ? {text:n, anchors:[]} : {text:n.text, anchors:n.anchors || []});
  return {
    assumptions: (doc.assumptions || []).filter(a => (a.confidence || "unverified") === "unverified" && mine(a.anchors)),
    unresolved: (doc.unresolved || []).filter(u => mine(u.anchors)),
    questions: (doc.open_questions || []).filter(q => mine(q.anchors)),
    unverified: nv.filter(n => mine(n.anchors)),
    evaluated: (doc.evaluated || []).filter(e => mine(e.anchors)),
  };
}

/** The hunk ids a stop covers. Empty for a document written before anchors kept their ids. */
function stopHunkIds(stop){
  return new Set((stop.anchors || []).map(a => a && a.id).filter(Boolean));
}

/**
 * What is still uncertain at this stop, in the order it should be read.
 *
 * Unanswered questions lead. Measured across 32 runs, 67 of 279 diff-provoked questions
 * got no reply at all, and they include a secret blast radius and an unpinned image: an
 * unanswered question about a code risk means the risk was never considered, which makes
 * it the strongest thing on the page rather than the weakest.
 *
 * Silence is reported, not hidden. A core stop with nothing flagged says so, because "we
 * looked and found nothing here" is information, and an empty space is not.
 */
function renderLiveHere(doc, ids, role){
  const live = liveForStop(doc, ids);
  const n = live.assumptions.length + live.unresolved.length + live.questions.length + live.unverified.length;
  const box = el("section",{class:"mt-6 border-t border-ink-200 pt-5"});

  if (!n){
    // Not shown for a supporting or incidental stop: nobody expects a finding there, so
    // the reassurance would be noise.
    if (role !== "core" || !ids.size) return box;
    box.append(el("p",{class:"text-sm text-ink-500"},"Nothing flagged at this stop — no unverified assumption, unsettled question or unexercised path anchors here."));
    return box;
  }

  box.append(el("h2",{class:"section-h"},"Still uncertain here"));

  const DISP = {
    unanswered: ["Never answered", "tag tag-warn"],
    escalated: ["Asked for your eyes", "tag tag-warn"],
    accepted_partial: ["Known and shipped", "tag"],
  };
  for (const u of live.unresolved){
    const [label, cls] = DISP[u.disposition] || ["Unsettled","tag"];
    box.append(el("div",{class:"card mb-3"},
      el("div",{class:"flex items-start justify-between gap-3"},
        el("span",{class:"font-medium"}, u.question),
        el("span",{class:cls}, label)),
      u.note ? points(u.note, "mt-2 text-sm text-ink-700") : null));
  }

  for (const a of live.assumptions){
    const state = STATE.acks[a.id];
    box.append(el("div",{class:"card mb-3"},
      el("div",{class:"flex items-start justify-between gap-3"},
        el("div",{}, el("span",{class:"id-chip mr-2"}, a.id), el("span",{class:"font-medium"}, a.assumption)),
        el("span",{class:"tag tag-warn"},"unverified")),
      el("dl",{class:"mt-2 space-y-1 text-sm text-ink-600"},
        row("If wrong", a.impact_if_wrong),
        a.how_to_verify ? row("How to verify", a.how_to_verify) : null),
      el("div",{class:"mt-3 flex gap-2"},
        ackBtn(a.id,"accept","Accept",state),
        ackBtn(a.id,"flag","Flag for discussion",state)),
      STATE.composer==="assume:"+a.id ? renderGlobalComposer("assume:"+a.id, STATE.composerSeed) : null,
      STATE.posted["assume:"+a.id] ? el("p",{class:"mt-2 text-sm text-ink-500"},"\u2713 Posted to the PR discussion.") : null));
  }

  for (const q of live.questions){
    box.append(el("div",{class:"card mb-3"},
      el("div",{}, el("span",{class:"id-chip mr-2"}, q.id), el("span",{class:"font-medium"}, q.question)),
      q.context ? el("p",{class:"mt-1.5 text-sm text-ink-600"}, q.context) : null));
  }

  if (live.unverified.length){
    box.append(subsection("Never exercised",
      el("ul",{class:"mt-1 space-y-1.5 text-sm"}, ...live.unverified.map(x=>el("li",{class:"flex items-start gap-2 text-ink-700"},
        el("span",{class:"select-none text-warn-fg"},"\u2014"), el("span",{}, x.text))))));
  }

  // Closed by default and last: these are settled, so they are a lookup for a reviewer who
  // arrives holding the same question, not something to read through.
  if (live.evaluated.length){
    const d = el("details",{class:"mt-4"});
    d.append(el("summary",{class:"cursor-pointer text-sm text-ink-600"},
      live.evaluated.length + " question" + (live.evaluated.length===1?"":"s") + " about this hunk already asked and answered"));
    for (const e of live.evaluated) d.append(el("div",{class:"card mt-2"},
      el("p",{class:"font-medium"}, e.question), points(e.answer, "mt-2 text-sm text-ink-700")));
    box.append(d);
  }
  return box;
}

function renderStop(){
  const s = STATE.ordered[STATE.stopIndex];
  const total = STATE.ordered.length;
  const f = document.createDocumentFragment();
  const prose = el("div",{class:"stop-prose"});
  prose.append(el("section",{},
    el("div",{class:"mb-2 flex flex-wrap items-center gap-2 text-sm text-ink-500"},
      el("span",{}, `Stop ${STATE.stopIndex+1} of ${total}`),
      // Core count, because `supporting` and `incidental` stops are not the ones a reviewer
      // has to weigh and knowing how many really matter changes how the walk is paced.
      el("span",{}, `${STATE.ordered.filter(x=>x.role==="core").length} core`),
      el("span",{class: s.role==="core" ? "tag tag-warn" : "tag"}, s.role),
      s.parent ? el("span",{}, `follows ${s.parent}`) : null,
      el("span",{class:"ml-auto"}, titleCase(s.provenance))),
    el("h1",{class:"mb-4"}, el("span",{class:"id-chip mr-2 text-ink-400"}, s.id), s.title),
    // `attention` leads. It is the one line a reviewer with a minute actually reads — "the
    // thing you would check with only a minute" — and it sat below What and Why, which are
    // the longest fields on the page.
    s.attention ? el("div",{class:"note mb-4"}, el("p",{class:"mb-0.5 text-sm font-semibold text-warn-fg"},"Check first"), el("p",{class:"text-ink-800"}, s.attention)) : null,
    labeled("What.", points(s.what, "text-ink-800")),
    labeled("Why.", points(s.why, "text-ink-800"))));

  prose.append(renderLiveHere(STATE.data.document, stopHunkIds(s), s.role));

  const code = el("div",{class:"stop-code"});
  for (const hp of hunksForStop(s, STATE.files)){
    if (hp.missing){ code.append(el("div",{class:"diff"}, el("div",{class:"diff-file"}, hp.path, el("span",{class:"tag tag-warn"},"no matching change")))); continue; }
    code.append(renderHunk(hp.path, hp.hunk));
  }

  const last = STATE.stopIndex===total-1;
  prose.append(el("div",{class:"mt-8 flex justify-between border-t border-ink-200 pt-6"},
    el("button",{class:"btn-ghost", disabled: STATE.stopIndex===0?"":null, onclick:()=>{if(STATE.stopIndex>0){STATE.stopIndex--;render();}}}, "Previous"),
    last && STATE.me
      ? el("button",{class:"btn-primary", onclick:()=>{STATE.view="submit";render();}}, "Finish review")
      : el("button",{class:"btn-ghost", disabled: last?"":null, onclick:()=>{if(!last){STATE.stopIndex++;render();}}}, "Next")));

  f.append(el("div",{class:"stop-split"}, prose, code));
  return f;
}

// ---------- submit review (approve / request changes) ----------
function reviewSeed(){
  const cov = STATE.coverage;
  const flagged = Object.entries(STATE.acks).filter(([,v])=>v==="flag").map(([k])=>k);
  const lines = [`Reviewed via guided walkthrough — ${cov.explained} of ${cov.total} changes explained.`];
  if (flagged.length) lines.push(`Assumptions flagged for discussion: ${flagged.join(", ")}.`);
  return lines.join("\n");
}
function renderSubmitReview(){
  const m = STATE.data.meta, cov = STATE.coverage;
  const f = document.createDocumentFragment();
  f.append(el("h1",{class:"mb-1"},"Submit review"));

  if (STATE.reviewSubmitted){
    const r = STATE.reviewSubmitted;
    f.append(el("p",{class:"mb-5 text-ink-500"},"Your review is on the pull request."));
    f.append(el("div",{class:"card"},
      el("p",{}, el("span",{class: r.state==="APPROVED" ? "tag tag-ok" : "tag tag-warn"}, titleCase(r.state.toLowerCase())),
        el("span",{class:"ml-2 text-ink-700"}, `${m.owner}/${m.repo} #${m.pull}`)),
      el("p",{class:"mt-3 text-sm text-ink-600"},"Merging stays on GitHub — branch protection, required checks and the merge method live there."),
      el("div",{class:"mt-3 flex gap-2"},
        el("a",{class:"btn-primary", href:r.html_url, target:"_blank", rel:"noopener"}, "View on GitHub"),
        el("a",{class:"btn-ghost", href:`https://github.com/${m.owner}/${m.repo}/pull/${m.pull}`, target:"_blank", rel:"noopener"}, "Open pull request"))));
    return f;
  }

  f.append(el("p",{class:"mb-5 text-ink-500"},"Conclude the review on this pull request as @"+(STATE.me||"")+". Merging stays on GitHub."));
  const covOk = cov.unexplained.length === 0;
  f.append(el("p",{class:"mb-4"},
    el("span",{class: covOk ? "tag tag-ok" : "tag tag-warn"},
      covOk ? `${cov.explained} of ${cov.total} changes explained`
            : `${cov.unexplained.length} change${cov.unexplained.length>1?"s":""} uncovered`)));

  const ta = el("textarea",{class:"rev-textarea", rows:"5"});
  ta.value = reviewSeed();
  const status = el("span",{class:"rev-status"});
  const btnApprove = el("button",{class:"btn-primary"}, "Approve");
  const btnChanges = el("button",{class:"btn-ghost"}, "Request changes");
  const submit = async (event)=>{
    const body = ta.value.trim();
    if (event==="REQUEST_CHANGES" && !body){ status.textContent = "Say what needs to change."; ta.focus(); return; }
    btnApprove.setAttribute("disabled","disabled"); btnChanges.setAttribute("disabled","disabled");
    status.textContent = "Submitting…";
    try {
      const r = await fetch("/api/review",{method:"POST",headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ owner:m.owner, repo:m.repo, pull:m.pull, event, body, commit_id:m.head_sha })});
      const data = await r.json().catch(()=>({}));
      if (r.ok){ STATE.reviewSubmitted = data.review; render(); return; }
      status.textContent = data.error || "Failed — try again.";
    } catch(e){ status.textContent = String(e); }
    btnApprove.removeAttribute("disabled"); btnChanges.removeAttribute("disabled");
  };
  btnApprove.addEventListener("click", ()=>submit("APPROVE"));
  btnChanges.addEventListener("click", ()=>submit("REQUEST_CHANGES"));
  f.append(el("div",{},
    ta,
    el("div",{class:"rev-actions"}, btnApprove, btnChanges, status)));
  return f;
}

function renderHunk(path, h){
  const body = el("div",{class:"diff-body"});
  body.append(el("code",{class:"diff-line is-hunk"}, `@@ -${h.old_start},${h.old_lines} +${h.new_start},${h.new_lines} @@${h.header||""}`));
  let newLine = h.new_start;
  for (const line of h.lines){
    const t = line[0];
    const cls = t==="+" ? "is-add" : t==="-" ? "is-del" : "is-ctx";
    const onRight = (t==="+" || t===" " || t===undefined || t==="");
    const lineNo = onRight ? newLine : null;
    const code = el("code",{class:"diff-line "+cls}, line);
    if (onRight && STATE.me){
      const key = path+":"+lineNo;
      const sel = STATE.selAnchor;
      // Shift-click marks the other end of a range. One line is the common case, so a plain
      // click still opens a single-line composer without ceremony.
      const addBtn = el("button",{class:"rev-add",
        title:"Comment on line "+lineNo+" — or select lines with the mouse first, or shift-click a second line, to comment on a range",
        onclick:(e)=>{
          // If the reviewer has dragged across lines, that selection IS the range — no
          // modifier to discover. Falls through to shift-click and single-line otherwise.
          const dragged = e.shiftKey ? null : selectedLineRange(path);
          if (dragged) {
            STATE.selAnchor = null;
            STATE.composer = dragged[0]===dragged[1]
              ? path+":"+dragged[1]
              : `${path}:${dragged[0]}-${dragged[1]}`;
            const ws = window.getSelection(); if (ws) ws.removeAllRanges();
            render();
            return;
          }
          if (e.shiftKey) {
            if (!sel || sel.path!==path) { STATE.selAnchor = {path, line:lineNo}; STATE.composer = null; }
            else {
              const a = Math.min(sel.line, lineNo), b2 = Math.max(sel.line, lineNo);
              STATE.selAnchor = null;
              STATE.composer = a===b2 ? path+":"+b2 : `${path}:${a}-${b2}`;
            }
          } else {
            STATE.selAnchor = null;
            STATE.composer = STATE.composer===key ? null : key;
          }
          render();
        }}, "+");
      const pending = sel && sel.path===path && sel.line===lineNo;
      const inRange = rangeOf(STATE.composer, path);
      const spanned = inRange && lineNo>=inRange[0] && lineNo<=inRange[1];
      body.append(el("div",{class:"rev-line"+(pending||spanned?" is-sel":""),
        "data-path":path, "data-line":String(lineNo)}, code, addBtn));
      for (const root of STATE.comments.filter(c => c.path===path && c.line===lineNo && !c.in_reply_to_id)) body.append(renderThread(root));
      if (STATE.composer===key) body.append(renderComposer(path, lineNo, lineNo, null));
      if (inRange && inRange[1]===lineNo) body.append(renderComposer(path, inRange[0], inRange[1], null));
    } else {
      body.append(code);
    }
    if (onRight) newLine++;
  }
  return el("div",{class:"diff"}, el("div",{class:"diff-file"}, el("span",{}, path)), body);
}

// ---------- Stage C: inline review comments (GitHub-backed) ----------
async function loadComments(){
  const m = STATE.data && STATE.data.meta; if (!m) return;
  try {
    const r = await fetch(`/api/comments?owner=${encodeURIComponent(m.owner)}&repo=${encodeURIComponent(m.repo)}&pull=${m.pull}`);
    if (r.ok) STATE.comments = (await r.json()).comments || [];
  } catch {}
}
/**
 * Line numbers covered by the current text selection within one file's diff.
 * Reading the browser's own selection means the familiar click-and-drag works without the
 * viewer reimplementing drag tracking, and it also picks up double-click and shift-arrow.
 */
function selectedLineRange(path){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
  const range = sel.getRangeAt(0);
  const nums = [];
  for (const el of document.querySelectorAll(".rev-line")) {
    if (el.dataset.path !== path) continue;
    let hit = false;
    try { hit = range.intersectsNode(el); } catch { hit = false; }
    if (!hit) continue;
    const n = Number(el.dataset.line);
    if (Number.isFinite(n)) nums.push(n);
  }
  if (nums.length < 2) return null;
  return [Math.min(...nums), Math.max(...nums)];
}

/** A composer key of "path:start-end" means a range; anything else is a single line. */
function rangeOf(key, path){
  if (!key || !key.startsWith(path+":")) return null;
  const m = /:(\d+)-(\d+)$/.exec(key);
  return m ? [Number(m[1]), Number(m[2])] : null;
}

function renderThread(root){
  const replies = STATE.comments
    .filter(c => c.in_reply_to_id === root.id)
    .sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
  const box = el("div",{class:"rev-thread"}, renderComment(root), ...replies.map(renderComment));
  const key = "reply:"+root.id;
  box.append(el("button",{class:"rev-reply-toggle",
    onclick:()=>{ STATE.composer = STATE.composer===key ? null : key; render(); }}, "Reply"));
  if (STATE.composer===key) box.append(renderComposer(null, null, null, root.id));
  return box;
}
function renderComment(c){
  return el("div",{class:"rev-comment"},
    el("div",{class:"rev-meta"},
      el("span",{class:"rev-author"}, "@"+c.user),
      c.start_line && c.line && c.start_line !== c.line
        ? el("span",{class:"tag"}, `lines ${c.start_line}\u2013${c.line}`) : null,
      c.outdated ? el("span",{class:"tag tag-warn"}, "outdated") : null,
      el("a",{class:"rev-link", href:c.html_url, target:"_blank", rel:"noopener"}, "GitHub \u2197")),
    el("div",{class:"rev-body"}, c.body));
}
function renderComposer(path, startLine, endLine, replyTo){
  const isRange = !replyTo && startLine !== endLine;
  const ta = el("textarea",{class:"rev-textarea", rows:"3",
    placeholder: replyTo ? "Reply\u2026"
      : isRange ? `Comment on lines ${startLine}\u2013${endLine}\u2026`
                : ("Comment on line "+endLine+"\u2026")});
  const status = el("span",{class:"rev-status"});
  const submit = el("button",{class:"btn-primary"}, replyTo ? "Reply" : "Comment");
  submit.addEventListener("click", async ()=>{
    const text = ta.value.trim(); if (!text) return;
    submit.setAttribute("disabled","disabled"); status.textContent = "Posting\u2026";
    const res = replyTo ? await replyComment(replyTo, text)
                        : await postComment(path, startLine, endLine, "RIGHT", text);
    if (res.ok){ STATE.composer = null; STATE.selAnchor = null; await loadComments(); render(); }
    else { submit.removeAttribute("disabled"); status.textContent = res.error || "Failed \u2014 try again."; }
  });
  const cancel = el("button",{class:"btn-ghost", onclick:()=>{ STATE.composer=null; STATE.selAnchor=null; render(); }}, "Cancel");
  const wrap = el("div",{class:"rev-composer"},
    isRange ? el("div",{class:"rev-range"}, `Lines ${startLine}\u2013${endLine}`) : null,
    ta, el("div",{class:"rev-actions"}, submit, cancel, status));
  setTimeout(()=>ta.focus(), 0);
  return wrap;
}
async function postComment(path, startLine, endLine, side, body){
  const m = STATE.data.meta;
  try {
    const r = await fetch("/api/comments",{method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ owner:m.owner, repo:m.repo, pull:m.pull, commit_id:m.head_sha, path,
        line:endLine, side, body,
        ...(startLine!==endLine ? { start_line:startLine, start_side:side } : {}) })});
    if (r.ok) return { ok:true };
    return { ok:false, error:(await r.json().catch(()=>({}))).error };
  } catch(e){ return { ok:false, error:String(e) }; }
}
async function replyComment(commentId, body){
  const m = STATE.data.meta;
  try {
    const r = await fetch("/api/comments/reply",{method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ owner:m.owner, repo:m.repo, pull:m.pull, comment_id:commentId, body })});
    if (r.ok) return { ok:true };
    return { ok:false, error:(await r.json().catch(()=>({}))).error };
  } catch(e){ return { ok:false, error:String(e) }; }
}

// ---------- Stage C: global (PR-level) comments for non-line items ----------
function assumeAction(a, kind){
  const on = STATE.acks[a.id]===kind;
  if (on){ STATE.acks[a.id]=null; if (STATE.composer==="assume:"+a.id) STATE.composer=null; }
  else {
    STATE.acks[a.id]=kind;
    STATE.composer="assume:"+a.id;
    STATE.composerSeed = (kind==="flag"
      ? `\ud83d\udea9 Flagging assumption ${a.id} for discussion: \u201c${a.assumption}\u201d.\n\n`
      : `\u2705 Accepting assumption ${a.id}: \u201c${a.assumption}\u201d.\n\n`);
  }
  render();
}
function renderGlobalComposer(key, seed){
  const ta = el("textarea",{class:"rev-textarea", rows:"3", placeholder:"Add a comment for the PR discussion\u2026"});
  ta.value = seed || "";
  const status = el("span",{class:"rev-status"});
  const submit = el("button",{class:"btn-primary"}, "Post to PR");
  submit.addEventListener("click", async ()=>{
    const text = ta.value.trim(); if (!text) return;
    submit.setAttribute("disabled","disabled"); status.textContent="Posting\u2026";
    const res = await postIssueComment(text);
    if (res.ok){ STATE.posted[key]=true; STATE.composer=null; render(); }
    else { submit.removeAttribute("disabled"); status.textContent = res.error || "Failed \u2014 try again."; }
  });
  const cancel = el("button",{class:"btn-ghost", onclick:()=>{ STATE.composer=null; render(); }}, "Cancel");
  const wrap = el("div",{class:"rev-composer mt-2"}, ta, el("div",{class:"rev-actions"}, submit, cancel, status));
  setTimeout(()=>{ ta.focus(); const n=ta.value.length; ta.setSelectionRange(n,n); }, 0);
  return wrap;
}
async function postIssueComment(body){
  const m = STATE.data.meta;
  try {
    const r = await fetch("/api/issue-comment",{method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ owner:m.owner, repo:m.repo, pull:m.pull, body })});
    if (r.ok) return { ok:true };
    return { ok:false, error:(await r.json().catch(()=>({}))).error };
  } catch(e){ return { ok:false, error:String(e) }; }
}

function renderCoverage(){
  const f = document.createDocumentFragment();
  f.append(el("h1",{class:"mb-1"},"Uncovered changes"));
  f.append(el("p",{class:"mb-5 text-ink-500"},"These changes aren’t accounted for by any walkthrough stop. A complete review explains every change."));
  const wrap = el("div",{class:"space-y-3"});
  if (!STATE.coverage.unexplained.length) wrap.append(el("p",{class:"text-ink-500"},"Everything is accounted for."));
  for (const u of STATE.coverage.unexplained) wrap.append(renderHunk(u.path, u.hunk));
  f.append(wrap);
  return f;
}

function renderVerify(doc){
  const v = doc.verification;
  const f = document.createDocumentFragment();
  f.append(el("h1",{class:"mb-5"},"Verification"));
  const cols = el("div",{class:"ver-split"});
  f.append(cols);
  cols.append(section("Checks performed",
    el("ul",{class:"space-y-2"}, ...v.performed.map(p=>el("li",{class:"flex items-baseline gap-2"},
      el("span",{class:"tag"}, p.kind),
      el("span",{class:"text-ink-800"}, p.description),
      el("span",{class:"text-ink-400"}, "— "+p.result))))));
  // A plain string or {text, anchors}: published content read off open pull requests, so
  // the string form cannot retire. Normalized here, as the renderers do elsewhere.
  const unexercised = (v.not_verified || []).map(n =>
    typeof n === "string" ? {text:n, anchors:[]} : {text:n.text, anchors:n.anchors || []});
  if (unexercised.length) cols.append(section("Not verified",
    el("ul",{class:"space-y-1.5"}, ...unexercised.map(n=>el("li",{class:"flex items-start gap-2 text-ink-700"},
      el("span",{class:"select-none text-warn-fg"},"—"), el("span",{}, n.text), hunkChips(n.anchors))))));
  return f;
}

window.addEventListener("keydown",(e)=>{
  if (STATE.view!=="tour") return;
  if ((e.key==="j"||e.key==="ArrowRight") && STATE.stopIndex<STATE.ordered.length-1){STATE.stopIndex++;render();}
  if ((e.key==="k"||e.key==="ArrowLeft") && STATE.stopIndex>0){STATE.stopIndex--;render();}
});
window.addEventListener("hashchange", boot);
boot();
</script>
