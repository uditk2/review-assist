<!-- Route facts the rest of <head> depends on, so this runs first.
     The build prerenders the landing page into #app (build/prerender.mjs), so crawlers and
     no-JS clients get real content. A PR link lands on that same "/" document, and the
     viewer only replaces #app once the document has loaded, so without the data-route flag
     the marketing page would show under every guided-review link until then. Set before
     <body> parses, so the prerendered nodes are hidden from the first paint, not after it.
     GitHub's Setup URL appends installation_id, which names an installation; it is dropped
     from the address before analytics can read it, since nothing on the page uses it.

     SITE_ANALYTICS is the one decision about analytics, and both tags below obey it:
     - Never on a PR route. A guided review's address names the repository and pull
       request, and both tools record addresses unmasked, so the only way to keep private
       repo names out is not to load them there. Site pages carry no repository data.
     - Only on reviewassist.dev. This repo is public and this file is the served asset, so
       without the gate anyone self-hosting the viewer would report their sessions into
       these projects. Neither tool has an allowed-domains setting; refusing to send is the
       only point of control. The ids are not secrets; the gate is about whose data goes.
     A PR address can also arrive without a page load: pasting a review link into a tab
     already on the site only changes the hash. The listener below is registered before
     either tag loads, on the capture phase, so it runs first: it switches both tags off,
     stops them hearing the event, and reloads, and the reload lands with SITE_ANALYTICS
     false. parseHash in the page script uses the same anchored pattern, on purpose. -->
<script>
(function () {
  var PR_ROUTE = /^#[^/]+\/[^/]+\/pull\/\d+/;
  var onPr = PR_ROUTE.test(location.hash);
  try {
    var theme = localStorage.getItem("theme");
    if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
  } catch (e) { /* storage blocked: follow the OS setting, as before */ }
  if (onPr) document.documentElement.setAttribute("data-route", "pr");
  if (/^\/installed\/?$/.test(location.pathname) && location.search.indexOf("installation_id") >= 0) {
    var q = new URLSearchParams(location.search); q.delete("installation_id");
    history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash);
  }
  window.GA_ID = "G-JMHGW95G13";
  window.SITE_ANALYTICS = location.hostname === "reviewassist.dev" && !onPr;
  if (!window.SITE_ANALYTICS) return;
  function leaveForPr(e) {
    if (!PR_ROUTE.test(location.hash)) return;
    window["ga-disable-" + window.GA_ID] = true;
    if (typeof window.clarity === "function") window.clarity("stop");
    e.stopImmediatePropagation();
    location.reload();
  }
  addEventListener("popstate", leaveForPr, true);
  addEventListener("hashchange", leaveForPr, true);
})();
</script>
<!-- Microsoft Clarity: session replays and the funnel events from track(). Worker metrics

     visitors; this separates people from machines. Masking stays Strict in the Clarity
     dashboard as a second line, in case a PR view ever renders without the gate seeing it. -->
<script type="text/javascript">
    if (window.SITE_ANALYTICS) {
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y2w90h1hhq");
    }
</script>
<!-- Google Analytics: the same funnel events, in the property the Worker also reports the
     server-side steps to (install, repositories, review posted; see worker/src/analytics.ts),
     so the whole funnel can be read in one place. Google's snippet, loaded by script rather
     than a static <script src> so the gate above can keep it off. -->
<script>
  if (window.SITE_ANALYTICS) {
    var gt = document.createElement("script");
    gt.async = true;
    gt.src = "https://www.googletagmanager.com/gtag/js?id=" + window.GA_ID;
    document.head.appendChild(gt);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    gtag("js", new Date());
    gtag("config", window.GA_ID);
  }
</script>

<script>
"use strict";
// ---------- diff parser + coverage (ported from @intentdoc/validator) ----------
function parseUnifiedDiff(diff) {
  const lines = diff.split("\n");
  const files = []; let cur = null, hunk = null, renameFrom = null;
  const FILE = /^diff --git a\/(.+?) b\/(.+)$/;
  const HUNK = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@(.*)$/;
  const flush = () => { if (cur && hunk) cur.hunks.push(hunk); hunk = null; };
  const strip = p => { p = p.trim(); if (p === "/dev/null") return p; return (p.startsWith("a/")||p.startsWith("b/")) ? p.slice(2) : p; };
  for (const line of lines) {
    const fm = FILE.exec(line);
    if (fm) { flush(); cur = { path: fm[2], hunks: [] }; files.push(cur); renameFrom = null; continue; }
    if (!cur) continue;
    if (line.startsWith("--- ")) { renameFrom = strip(line.slice(4)); continue; }
    if (line.startsWith("+++ ")) { const to = strip(line.slice(4));
      if (to === "/dev/null" && renameFrom && renameFrom !== "/dev/null") cur.path = renameFrom;
      else if (to !== "/dev/null") cur.path = to; continue; }
    const hm = HUNK.exec(line);
    if (hm) { flush(); hunk = { old_start:+hm[1], old_lines:hm[2]===undefined?1:+hm[2],
      new_start:+hm[3], new_lines:hm[4]===undefined?1:+hm[4], header: hm[5]||"", lines: [], substantive:false }; continue; }
    if (hunk && (line.startsWith("+")||line.startsWith("-")||line.startsWith(" "))) {
      hunk.lines.push(line);
      if ((line[0]==="+"||line[0]==="-") && line.slice(1).trim().length) hunk.substantive = true;
    }
  }
  flush(); return files;
}
const newRange = h => h.new_lines===0 ? [h.new_start,h.new_start] : [h.new_start, h.new_start+h.new_lines-1];
const overlap = (a,b) => a[0]<=b[1] && b[0]<=a[1];

function orderTour(tour) {
  const byParent = new Map();
  for (const s of tour) { const k = s.parent ?? null; if (!byParent.has(k)) byParent.set(k, []); byParent.get(k).push(s); }
  const out = []; const visit = p => { for (const s of (byParent.get(p)||[])) { out.push(s); visit(s.id); } };
  visit(null);
  for (const s of tour) if (!out.includes(s)) out.push(s);
  return out;
}
function computeCoverage(tour, diffFiles) {
  const anchors = [];
  tour.forEach(s => (s.anchors||[]).forEach(a => anchors.push({ path:a.path, range:newRange(a.hunk) })));
  const unexplained = []; let total = 0;
  for (const f of diffFiles) {
    if (f.path === ".intent" || f.path.startsWith(".intent/")) continue; // a doc needn't explain itself
    for (const h of f.hunks) {
    total++; const hr = newRange(h);
    const cov = anchors.some(an => an.path===f.path && overlap(an.range,hr));
    if (!cov && h.substantive) unexplained.push({ path:f.path, hunk:h });
  } }
  return { total, unexplained, explained: total - unexplained.length };
}
function hunksForStop(stop, diffFiles) {
  const res = [];
  for (const a of (stop.anchors||[])) {
    const file = diffFiles.find(f => f.path === a.path);
    const ar = newRange(a.hunk);
    if (!file || !file.hunks.some(h => overlap(newRange(h), ar))) { res.push({ path:a.path, missing:true }); continue; }
    for (const h of file.hunks) if (overlap(newRange(h), ar)) res.push({ path:a.path, hunk:h });
  }
  return res;
}

// ---------- dom helper ----------
const el = (t, props={}, ...kids) => {
  const n = document.createElement(t);
  for (const [k,v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === "class") n.className = v; else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
};

// Render any <pre class="mermaid"> nodes. securityLevel 'strict' neutralizes scripts/HTML
// in the (repo-authored) diagram source. If the CDN hasn't loaded yet, onload re-runs this.
function runMermaid(){
  if(!window.mermaid) return;
  try{
    const dark = currentTheme() === "dark";
    if(window.__mmTheme !== (dark ? "dark" : "light")){
      // Drawn in the site's own palette and type, read from the live tokens, so a diagram
      // matches the page around it in both themes instead of Mermaid's stock look.
      const t = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      // Mermaid wants pixels; the body token is in rem.
      const px = n => parseFloat(t(n)) * parseFloat(getComputedStyle(document.documentElement).fontSize) + "px";
      window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme:"base",
        themeVariables:{
          darkMode: dark, fontFamily:'"IBM Plex Sans", system-ui, sans-serif', fontSize:px("--text-base"),
          background:t("--surface"), textColor:t("--ink-800"), lineColor:t("--ink-500"),
          primaryColor:t("--accent-50"), primaryBorderColor:t("--accent-600"), primaryTextColor:t("--ink-900"),
          secondaryColor:t("--ink-50"), tertiaryColor:t("--surface"),
          actorBkg:t("--accent-50"), actorBorder:t("--accent-600"), actorTextColor:t("--ink-900"), actorLineColor:t("--ink-300"),
          signalColor:t("--ink-700"), signalTextColor:t("--ink-800"),
          labelBoxBkgColor:t("--ink-50"), labelBoxBorderColor:t("--ink-300"), labelTextColor:t("--ink-800"), loopTextColor:t("--ink-700"),
          noteBkgColor:t("--warn-bg"), noteBorderColor:t("--warn-border"), noteTextColor:t("--ink-800"),
          activationBkgColor:t("--accent-100"), activationBorderColor:t("--accent-600"),
        },
        flowchart:{ useMaxWidth:true, curve:"basis" },
        sequence:{ useMaxWidth:true, mirrorActors:false, actorMargin:64, boxMargin:12, messageMargin:40 } });
      window.__mmTheme = dark ? "dark" : "light";
    }
    const nodes = [...document.querySelectorAll(".mermaid:not([data-processed])")];
    if(nodes.length) window.mermaid.run({ nodes });
  }catch(e){ /* leave the <pre> source visible as a fallback */ }
}
window.__onMermaid = runMermaid;

const CONF = {
  confirmed_by_user: { cls: "tag tag-ok", label: "confirmed by user" },
  grounded_in_code:  { cls: "tag",        label: "grounded in code" },
  unverified:        { cls: "tag tag-warn", label: "unverified" },
};
const titleCase = s => String(s||"").replace(/_/g," ");

let STATE = { data:null, files:[], coverage:null, ordered:[], view:"overview", stopIndex:0, cueIndex:0, decisions:{}, recorded:{}, noteOpen:null, discussion:[], me:null, comments:[], composer:null, reviewSubmitted:null, selAnchor:null };

/** The review route is deliberately derived from the document rather than hard-coded in
 * two navs. Desktop's rail and mobile's scroll strip therefore always tell the same story.
 * The order is the reading order: why the change exists, then what was and was not checked
 * (which sets how hard to look at everything after it), then what could change the
 * decision, the code, and what is still open. */
function reviewRoute(doc){
  const questions = doc.open_questions || [];
  const cues = reviewCues(doc);
  const gaps = (doc.verification?.not_verified || []).length;
  // Risk cues and open questions count what is still to decide, so the rail shows progress;
  // `total` lets an all-decided step show a check instead of an empty count.
  const undecided = xs => xs.filter(x => !isDecided(decisionKey(x))).length;
  const diagrams = doc.diagrams || [];
  return [
    { key:"overview", label:"Overview", count:0, detail:"What the change is for, and how it was approached." },
    // Right after the why: a picture of how the pieces fit makes everything after it easier.
    ...(diagrams.length ? [{ key:"diagrams", label:"Diagrams", count:diagrams.length, detail:"How the change fits together, drawn out." }] : []),
    { key:"verify", label:"Verification", count:gaps, detail:"What was checked, and what was not." },
    { key:"route", label:"Risk cues", count:undecided(cues.map(c => c.data)), total:cues.length, detail:"Review what could change the decision." },
    { key:"tour", label:"Walk the change", count:STATE.ordered.length, detail:"Follow the important changes in context." },
    { key:"questions", label:"Open questions", count:undecided(questions), total:questions.length, detail:"See what the session could not settle." },
  ];
}

/** Where Continue goes from a route step: the next step, then Submit for a signed-in
 *  reviewer. One function, so no view can send the reader backwards along the route. */
function nextRouteStep(doc, key){
  const route = reviewRoute(doc);
  const next = route[route.findIndex(s => s.key === key) + 1];
  if (next) return { label: next.label, go: () => { STATE.view = next.key; if (next.key === "tour") STATE.stopIndex = 0; render(); } };
  return STATE.me ? { label: "Submit review", go: () => { STATE.view = "submit"; render(); } } : null;
}
/** The route's navigation bar, shared by every step. It is fixed to the bottom of the
 *  window (see .route-next), so Continue sits in the same place on every step however
 *  long or short that step's content is. */
function routeBar(nextLabel, ...buttons){
  return el("div",{class:"route-next"},
    el("p",{}, el("strong",{},"Next: "), nextLabel),
    el("div",{class:"route-next-actions"}, ...buttons));
}
const continueButton = go => el("button",{class:"btn-primary", onclick:go}, "Continue →");
function routeNextBar(doc, key){
  const next = nextRouteStep(doc, key);
  return next ? routeBar(next.label, continueButton(next.go)) : null;
}

/** Everything that could change the review decision, in the order the route visits it:
 * unverified assumptions, then questions nobody settled. The rail's count and the cue pager
 * both read this one list, so "cue 1 of N" can never point at a cue the pager cannot reach.
 * Open questions and verification gaps have route steps of their own. */
function reviewCues(doc){
  const cue = kind => x => ({ kind, data:x, anchors:x.anchors || [] });
  return [
    ...(doc.assumptions || []).filter(a => (a.confidence || "unverified") === "unverified").map(cue("assumption")),
    ...(doc.unresolved || []).map(cue("unresolved")),
  ];
}

/** Editorial articles and release notes have separate, crawlable route families. */
function parseBlogRoute() {
  const m = /^\/blog(?:\/([A-Za-z0-9._-]+))?\/?$/.exec(location.pathname);
  return m ? { slug: m[1] || null } : null;
}
const blogHref = v => v ? `/blog/${v}/` : "/blog/";
function parseReleaseRoute() {
  const m = /^\/releases(?:\/([A-Za-z0-9._-]+))?\/?$/.exec(location.pathname);
  return m ? { slug: m[1] || null } : null;
}
const releaseHref = v => v ? `/releases/${v}/` : "/releases/";

/** Where GitHub sends someone after installing the App (the App's Setup URL). */
const isInstalledRoute = () => /^\/installed\/?$/.test(location.pathname);

/** Anchored exactly like PR_ROUTE in <head>: that test decides whether analytics loads and
 *  when a hash change forces a reload, so the two must never disagree about a PR route. */
function parseHash() {
  // The public sample is self-contained, so the landing page remains useful on a static
  // host as well as behind the local mock server. Keep it distinct from a real PR route:
  // analytics may still measure the landing-to-sample transition, while real PR data never
  // reaches those tools.
  if (location.hash === "#sample") return { sample:true };
  const m = /^#([^/]+)\/([^/]+)\/pull\/(\d+)/.exec(location.hash);
  return m ? { owner:m[1], repo:m[2], pull:m[3] } : null;
}

/** The pages that need no data, or null on a PR route. One function, so boot and the theme
 *  toggle's re-render cannot disagree about what is on screen. */
function sitePage(){
  if (parseHash()) return null;
  const blog = parseBlogRoute();
  if (blog) return blog.slug ? renderArticlePost(blog.slug) : renderBlogIndex();
  const release = parseReleaseRoute();
  if (release) return release.slug ? renderReleasePost(release.slug) : renderReleaseIndex();
  if (isInstalledRoute()) return renderInstalled();
  return renderLanding();
}

/** Funnel events, sent to Clarity and GA. Both load only when SITE_ANALYTICS says so (see
 *  <head>): reviewassist.dev, never a PR route. So this is a no-op on PR pages, on
 *  self-hosted copies and in the prerender build. Clarity carries properties as session
 *  tags; GA takes them as event parameters. */
function track(event, tags){
  if (!window.SITE_ANALYTICS) return;
  if (typeof window.clarity === "function") {
    for (const [k, v] of Object.entries(tags || {})) window.clarity("set", k, String(v));
    window.clarity("event", event);
  }
  if (typeof window.gtag === "function") window.gtag("event", event, tags || {});
}

let PAGE_TRACKED = false;

async function boot() {
  const app = document.getElementById("app");
  stopDemo();
  // Release notes used to live at "#/blog/<v>", and those links are out in the world.
  const legacy = /^#\/blog(?:\/([A-Za-z0-9._-]+))?\/?$/.exec(location.hash);
  if (legacy) return location.replace(blogHref(legacy[1]));
  const oldRelease = parseBlogRoute();
  if (oldRelease?.slug && RELEASES.some(r => r.v === oldRelease.slug))
    return location.replace(releaseHref(oldRelease.slug));

  const page = sitePage();
  if (page) {
    app.replaceChildren(page);
    // "/#permissions" from another page has to land on the section, not the top.
    let target = null;
    try { target = location.hash.length > 1 && document.getElementById(decodeURIComponent(location.hash.slice(1))); }
    catch { /* a malformed fragment is just not a section id */ }
    target ? target.scrollIntoView() : window.scrollTo(0, 0);
    // Once per page. boot also runs on every hash change (back, forward, a plain #anchor),
    // and counting each of those would inflate the first step of the funnel.
    if (!PAGE_TRACKED) {
      PAGE_TRACKED = true;
      if (parseBlogRoute()) track("blog_view");
      else if (parseReleaseRoute()) track("release_notes_view");
      else if (isInstalledRoute()) track("app_install_return", { setup_action: installSetupAction() || "none" });
      else track("landing_view");
    }
    return;
  }

  const ref = parseHash();
  if (ref.sample) {
    STATE.me = null;
    return openReview(sampleReviewData(), false);
  }
  app.replaceChildren(centered(el("p",{class:"text-ink-500"},"Loading…")));
  try { STATE.me = (await (await fetch("/api/me")).json()).login; } catch {}
  const res = await fetch(`/api/document?owner=${encodeURIComponent(ref.owner)}&repo=${encodeURIComponent(ref.repo)}&pull=${ref.pull}`);
  if (res.status === 401) return renderLogin(ref);
  const data = await res.json();
  if (data.error) return app.replaceChildren(centered(el("h1",{},"Couldn’t load this PR"), el("p",{class:"text-ink-500"}, data.error)));
  if (data.document_missing || !data.document) return app.replaceChildren(centered(
    el("h1",{},"No Intent Document"),
    el("p",{class:"max-w-prose text-ink-500"},"This pull request has no .intent document on its head commit. The authoring agent should generate one before review.")));

  openReview(data);
}

/** Populate the reviewer shell from either GitHub data or the public static sample. The
 * shared initializer keeps their navigation, coverage and review route identical. */
function openReview(data, fetchComments = true) {
  STATE.data = data;
  STATE.files = parseUnifiedDiff(data.diff || "");
  STATE.ordered = orderTour(data.document.tour || []);
  // hunk id -> index of the stop covering it. Buildable only because anchor expansion now
  // keeps the id it was written as; before, a stored stop held a path and line ranges, so
  // every other field's hunk ids had nothing to match and rendered as dead labels.
  STATE.stopOfHunk = {};
  STATE.ordered.forEach((stop, i) => {
    for (const a of stop.anchors || []) if (a && a.id && !(a.id in STATE.stopOfHunk)) STATE.stopOfHunk[a.id] = i;
  });
  STATE.coverage = computeCoverage(data.document.tour || [], STATE.files);
  STATE.view = "overview"; STATE.stopIndex = 0; STATE.cueIndex = 0;
  STATE.comments = []; STATE.composer = null; STATE.reviewSubmitted = null;
  STATE.decisions = loadDecisions(); STATE.recorded = {}; STATE.noteOpen = null; STATE.discussion = [];
  render();
  // Overlay PR review comments, and the decisions and diagram comments already on the PR.
  if (fetchComments) Promise.all([loadComments(), loadDiscussion()]).then(render);
}

function centered(...kids){ return el("div",{class:"mx-auto flex min-h-screen max-w-prose flex-col items-start justify-center gap-3 px-6"}, ...kids); }

const REPO_URL = "https://github.com/uditk2/review-assist";
const APP_INSTALL = "https://github.com/apps/review-assist-guided-review";
const MCPB_DOWNLOAD = REPO_URL + "/releases/latest/download/review-assist-mcp.mcpb";

/** Every "Install the GitHub App" button. The placement tag is what tells the hero's CTA
 *  apart from the install step's when reading the funnel. GitHub's own install pages are
 *  out of reach, so this click is the last step the site can see before the Setup URL. */
function installAppLink(placement, label = "Install the GitHub App →", cls = "btn-primary"){
  return el("a",{class:cls, href:APP_INSTALL,
    onclick:()=>track("install_app_click", { install_cta: placement })}, label);
}

/** An in-page link that scrolls instead of changing the hash: a hash change re-runs boot,
 *  which would rebuild the page and restart the demo. Without JS it is a plain anchor. */
function jumpLink(id, cls, ...kids){
  return el("a",{class:cls, href:"#"+id, onclick:(e)=>{
    e.preventDefault();
    const target = document.getElementById(id);
    if (target) target.scrollIntoView({behavior:"smooth"});
    else location.hash = "#"+id;
  }}, ...kids);
}

/** A real review, with the complete guided-review shell, that needs no GitHub account or
 * development server. This is intentionally a route instead of a hero scroll: a visitor
 * who presses the CTA gets a clear state change and can use every review interaction.
 * The placement tag tells the funnel which of the page's sample links was used. */
function sampleReviewLink(placement, cls, ...kids){
  return el("a",{class:cls, href:"#sample", onclick:(e)=>{
    e.preventDefault();
    track("sample_review_open", { sample_cta:placement });
    if (location.hash === "#sample") boot();
    else location.hash = "#sample";
  }}, ...kids);
}

function copyIcon(){

}

function chevronIcon(){
  return `<svg width="16" height="16" viewBox="0 0 16 16" class="fill-none stroke-ink-400" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 6l4 4 4-4"></path>
  </svg>`;
}

/** The copy control shared by every command block. The icon follows the button's text
 *  colour, so the same control works on the light code block and the dark setup one. */
function copyButton(text, onCopy, cls){
  return el("button",{
    class:cls,
    title:"Copy to clipboard",
    onclick: async (e) => {
      onCopy?.();
      try { await navigator.clipboard.writeText(text); } catch {}
      const label = e.currentTarget.querySelector(".copy-label");
      if (!label) return;
      const prevHtml = label.innerHTML;
      label.textContent = "Copied";
      setTimeout(() => { label.innerHTML = prevHtml; }, 1200);
    }},
    el("span",{class:"copy-label", html: copyIcon()}));
}

function codeBlock(text, onCopy){
  const body = el("div",{class:"diff-body"});
  for (const line of String(text).split("\n")) body.append(el("code",{class:"diff-line is-ctx"}, line));
  const copyBtn = copyButton(text, onCopy, "flex items-center gap-1.5 font-mono text-micro text-ink-500 hover:text-accent-600");
  return el("div",{class:"diff"}, el("div",{class:"diff-file"}, el("span",{}, "Terminal"), copyBtn), body);
}

/** One shell command, set as the terminal it will be pasted into. */
function commandBlock(text, onCopy){
  return el("div",{class:"command-block"},
    el("code",{}, text),
    copyButton(text, onCopy, "command-copy"));
}

/** Where each coding agent gets the MCP server. One list, read by the setup flow on the
 *  landing page and by the post-install page, so the commands cannot drift apart. */
const AGENTS = [
  { key:"claude-code", label:"Claude Code", icon:"burst",
    command:"claude mcp add -s user review-assist -- npx -y review-assist-mcp",
    note:"Launched your editor from the Dock? A GUI app can’t see `npx` on its PATH, so [use the form in the README](" + REPO_URL + "#claude-code)." },
  { key:"codex", label:"Codex", icon:"terminal",
    command:"codex mcp add review-assist -- npx -y review-assist-mcp" },
  { key:"claude-desktop", label:"Claude Desktop", icon:"desktop" },
];

/** Pick the agent, get its one command. Three answers to "where do you write code?", so a
 *  reader sees only their own command and caveat. Self-contained: repaints its own DOM on
 *  click, the same pattern as the hero demo. */
function agentPicker(){
  let active = AGENTS[0].key;
  const root = el("div",{class:"agent-picker"});
  function paint(){
    const agent = AGENTS.find(a => a.key === active);
    root.replaceChildren(
      el("div",{class:"agent-options", role:"group", "aria-label":"Coding agent"},
        ...AGENTS.map(a => el("button",{class:"agent-option"+(a.key===active ? " is-active" : ""),
          "aria-pressed":String(a.key===active), onclick:()=>{ active = a.key; paint(); }},
          el("span",{class:"agent-icon", html:lineIcon(a.icon, 22)}),
          el("span",{class:"agent-text"}, el("span",{class:"agent-name"}, a.label), el("span",{class:"agent-sub"}, "Add the Review Assist MCP server")),
          el("span",{class:"agent-radio"})))),
      agent.command
        ? el("div",{},
            el("p",{class:"agent-label"}, "Run this command in your terminal:"),
            commandBlock(agent.command, () => track("mcp_command_copy", { agent: agent.key })),
            agent.note ? el("p",{class:"agent-note", html:richHtml(agent.note)}) : null)
        : el("div",{},
            el("p",{class:"agent-label"}, "No terminal needed: download the bundle and open it, and Claude Desktop installs the server automatically."),
            el("a",{class:"btn-primary", href:MCPB_DOWNLOAD, onclick:()=>track("mcpb_download")}, "Download the .mcpb →")),
      el("p",{class:"agent-note"}, "Your agent uses it to turn the session’s decisions and assumptions into an Intent Document."));
  }
  paint();
  return root;
}

// the live demo), what exactly do I get (labelled parts), how do I start (three steps), and

      // The demo is real, interactive UI (the same viewer a reviewer gets), not a product

      // sits there, tilted. Every section on the page shares this one width, header
      // included — nothing here is narrower than what's below it.
      el("div",{class:"mx-auto max-w-[92rem] px-6"},
      el("section",{class:"contour-field"},
        el("div",{class:"grid grid-cols-1 gap-10 py-8 lg:grid-cols-[minmax(0,34rem)_minmax(0,1fr)] lg:items-center lg:gap-12 lg:py-16"},
          el("div",{},
            el("p",{class:"mb-4"}, el("span",{class:"free-pill"}, "Free & open source")),
            el("h1",{class:"promise-title mb-5"}, "AI code review that keeps the reasoning intact."),
            el("p",{class:"max-w-md text-title text-ink-700"},
              "Review the reasoning that produced the code."),
            el("div",{class:"mt-6 flex flex-wrap items-center gap-3"},

              jumpLink("get-started","btn-ghost hero-secondary","Install free")),

          el("div",{class:"lg:sticky lg:top-24", id:"demo"},

            el("div",{class:"promise-panel"}, renderDemo()),
            el("p",{class:"mt-2 text-sm text-ink-500"},
              "Session context, linked to the code it explains."))),

        // Under both columns, not inside the left one: it qualifies the whole hero, and
        // parking it in the copy column was pushing the proof points past the demo.
        el("div",{class:"mt-8 flex flex-wrap items-center gap-3 border-t border-ink-200 pt-4 text-sm text-ink-600"},

/** The product model as one picture, matching design/mockups/approved-review-flow.png: a
 *  coding session becomes an Intent Document, which becomes a guided review. Built as HTML
 *  rather than one SVG so the text stays real text and the cards stack on a phone instead
 *  of scrolling sideways. It is one example change told three ways, so the cards agree. */
function renderReviewSummary(){
  const icon = (name, cls, size) => el("span",{class:cls, html:lineIcon(name, size)});
  const term = (cls, ...kids) => el("div",{class:"flow-term-line"+(cls ? " "+cls : "")}, ...kids);
  const session = el("article",{class:"flow-card flow-session"},
    el("div",{class:"flow-card-head"},
      icon("terminal","flow-term-badge",16),
      el("span",{class:"flow-card-title"}, "Coding session"),
      el("span",{class:"flow-card-meta"}, "10:24 AM")),
    el("div",{class:"flow-terminal"},
      term("", "$ git checkout -b feat/retry-logic"),
      term("", "$ make test"),
      term("is-muted", el("span",{class:"flow-term-fail"}), "Tests failed (2) …"),
      term("", "$ vim src/api/client.py"),
      term("is-muted", "# add exponential backoff …"),
      term("", "$ make test"),

const DWELL = 6000;
let DEMO_STATE = { i: 0, timer: null, auto: true, files: null,
                   panel: null, visible: true, hover: false, maxH: 0, width: 0 };

function reducedMotion(){
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/** Any route change leaves the interval running otherwise, painting into a dead node. */
function stopDemo(){
  if (DEMO_STATE.timer) { clearInterval(DEMO_STATE.timer); DEMO_STATE.timer = null; }
}

function demoGoto(i, byHand){
  DEMO_STATE.i = (i + DEMO.stops.length) % DEMO.stops.length;
  // A click is a statement of intent: stop moving the thing the reader is reading.
  if (byHand) { DEMO_STATE.auto = false; stopDemo(); }
  paintDemo();
}

function startDemo(){
  stopDemo();
  if (!DEMO_STATE.auto || reducedMotion()) return;
  DEMO_STATE.timer = setInterval(() => {
    if (!document.getElementById("demo-body")) return stopDemo();
    DEMO_STATE.i = (DEMO_STATE.i + 1) % DEMO.stops.length;
    paintDemo();
  }, DWELL);
}

/** The demo runs only while it is on screen and unhovered. Each input sets its own flag and
 *  calls this, so a stale mouseleave (fired because the panel scrolled out from under a
 *  parked pointer) cannot restart a demo that visibility has already put to sleep. */
function syncDemo(){
  if (!(DEMO_STATE.auto && DEMO_STATE.visible && !DEMO_STATE.hover)) return stopDemo();
  if (DEMO_STATE.timer) return; // already running: leave the dwell where the reader found it
  paintDemo();                  // paintDemo owns the progress bar, so restart the two together
  startDemo();
}

/** Only ever scrolls the rail's own horizontal overflow. scrollIntoView walked up to the
 *  document and yanked the whole page back to the demo every dwell, which is what a reader
 *  further down the page saw as the page scrolling by itself. */
function keepActiveStopInRail(rail){
  const active = rail.querySelector(".is-active");
  if (!active || rail.scrollWidth <= rail.clientWidth) return; // column layout: nothing to scroll
  const a = active.getBoundingClientRect(), r = rail.getBoundingClientRect();
  rail.scrollLeft += (a.left - r.left) - (r.width - a.width) / 2;
}

function watchDemoVisibility(panel){
  if (!window.IntersectionObserver) return;
  const io = new IntersectionObserver(entries => {
    // A route change leaves this observer bound to a detached panel. Its stop must not reach
    // through the shared state and cancel the live one.
    if (DEMO_STATE.panel !== panel || !panel.isConnected) return io.disconnect();
    DEMO_STATE.visible = entries[entries.length - 1].isIntersecting;
    syncDemo();
  }, { threshold: 0 }); // any sliver counts: a panel taller than the viewport never hits a ratio
  io.observe(panel);
}

/** Stops differ in height once the rail stacks above the pane, so every advance would reflow
 *  the whole page under a reader below the hero. Hold the panel at the tallest stop seen at
 *  this width; reading the natural height back before the frame paints keeps it flicker-free. */
function lockDemoHeight(panel){
  if (!panel) return;
  if (DEMO_STATE.width !== panel.clientWidth) { DEMO_STATE.width = panel.clientWidth; DEMO_STATE.maxH = 0; }
  panel.style.minHeight = "";
  DEMO_STATE.maxH = Math.max(DEMO_STATE.maxH, panel.offsetHeight);
  panel.style.minHeight = DEMO_STATE.maxH + "px";
}

function renderDemo(){
  DEMO_STATE.files = parseUnifiedDiff(DEMO.diff);
  DEMO_STATE.i = 0; DEMO_STATE.auto = true;
  DEMO_STATE.visible = true; DEMO_STATE.hover = false; DEMO_STATE.maxH = 0; DEMO_STATE.width = 0;

  const panel = el("div",{class:"demo demo-tilt"},
    el("div",{class:"demo-bar"},
      el("span",{class:"font-mono"}, DEMO.repo),
      el("span",{class:"id-chip"}, "#"+DEMO.pull),
      el("span",{class:"hidden truncate text-ink-500 sm:inline"}, DEMO.title),
      el("span",{class:"flex-1"}),
      el("span",{class:"tag tag-ok"}, "4 of 4 changes explained")),
    el("div",{class:"demo-track"}, el("div",{class:"demo-progress", id:"demo-progress"})),
    el("div",{class:"demo-grid", id:"demo-body"}));

  DEMO_STATE.panel = panel;

  // Pausing on hover keeps a reader from losing the stop they are mid-way through.
  panel.addEventListener("mouseenter", () => { DEMO_STATE.hover = true;  syncDemo(); });
  panel.addEventListener("mouseleave", () => { DEMO_STATE.hover = false; syncDemo(); });

  // Hover has no touch equivalent, and a panel nobody can see has no reader to keep: pause
  // whenever the demo scrolls off screen, so the rest of the page sits still. Observing is
  // deferred with the first paint, because isConnected only answers once the panel is in.
  setTimeout(() => { syncDemo(); watchDemoVisibility(panel); }, 0);
  return panel;
}

function paintDemo(){
  const body = document.getElementById("demo-body");
  if (!body) return stopDemo();
  const s = DEMO.stops[DEMO_STATE.i];

  const rail = el("div",{class:"demo-rail"},
    ...DEMO.stops.map((t, i) => el("button",{
      class:"demo-stop"+(i===DEMO_STATE.i ? " is-active" : ""),
      onclick:()=>demoGoto(i, true)},
      el("span",{class:"id-chip"}, t.id),
      el("span",{class:"truncate"}, t.title))));

  const pane = el("div",{class:"demo-pane"},
    el("div",{class:"mb-2 flex items-center gap-2"},
      el("span",{class:"eyebrow"}, `stop ${String(DEMO_STATE.i+1).padStart(2,"0")} / ${String(DEMO.stops.length).padStart(2,"0")}`),
      el("span",{class:"tag"}, s.role)),
    el("p",{class:"mb-2 font-medium text-ink-900"}, s.title),
    el("p",{class:"text-sm text-ink-700"}, el("span",{class:"font-medium text-ink-900"},"What. "), s.what),
    el("p",{class:"mt-1 text-sm text-ink-700"}, el("span",{class:"font-medium text-ink-900"},"Why. "), s.why),
    s.attention ? el("div",{class:"note mt-3 text-sm"},
      el("p",{class:"mb-0.5 font-mono text-micro text-warn-fg"},"reviewer note"),
      el("p",{class:"text-ink-800"}, s.attention)) : null,
    el("div",{class:"mt-3 space-y-2"},
      ...hunksForStop(s, DEMO_STATE.files).map(hp => hp.missing ? null : renderHunk(hp.path, hp.hunk))));

  body.replaceChildren(rail, pane);
  lockDemoHeight(body.closest(".demo"));
  keepActiveStopInRail(rail);

  // Restart the dwell bar from zero, in the direction of travel.
  const bar = document.getElementById("demo-progress");
  if (bar) {
    const run = DEMO_STATE.auto && !reducedMotion();
    bar.style.transition = "none";
    bar.style.width = "0%";
    void bar.offsetWidth; // commit the zero state, or the two writes coalesce into no-op
    if (run) {
      bar.style.transition = `width ${DWELL}ms linear`;
      bar.style.width = "100%";
    }
  }
}

/** Minimal inline markup for authored prose: `code`, **bold**, and [text](href). */
function richHtml(text){
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // Code spans are set aside before emphasis runs, and put back last. Otherwise an asterisk
  // inside one (a glob like `intent-*.md`) paired with one in the next span and italicised
  // everything between them, eating both asterisks.
  const code = [];
  return esc(text)
    .replace(/`([^`]+)`/g, (m, c) => `\u0000${code.push(c) - 1}\u0000`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong class=\"font-medium text-ink-900\">$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
      (m, text, href) => /^(https?:|#|\/)/i.test(href) ? `<a href="${href}">${text}</a>` : text)
    .replace(/\u0000(\d+)\u0000/g, (m, i) => `<code class="code-inline">${code[i]}</code>`);
}

      "Start with the API contract. Ask whether the key is scoped to an account and operation, how long it is retained, and what happens if the same key is sent with a different amount, currency, or recipient. A replay with changed payment details must not silently return the first payment as though it matched the new request. Compare a stable fingerprint of the meaningful request fields, and define a clear mismatch response. Avoid comparing raw JSON bytes if field order or harmless defaults can differ.",
      "Trace the key through the handler, queue, database, and provider adapter. If only one process keeps an in-memory map, a retry routed to another instance can still create a second payment. If the provider supports its own idempotency key, check whether the same stable operation identifier reaches that boundary too. A local database guard cannot by itself make an external side effect atomic with a local write.",
      "In Review Assist, compare the stated request in `problem.user_asks` with the assumptions and anchored code tour in the Intent Document. The document can show why the agent chose a key scope or retention window. It does not establish that the choice matches your payment contract. [Checking scope drift](/blog/how-to-check-scope-drift-in-ai-written-prs/) helps if the PR quietly changes retry behavior beyond the requested endpoint.",
      { h: "Inspect the race and the uncertain outcome" },
      "Look for one atomic way to claim the key, usually a unique constraint or an equivalent durable conditional write over the chosen scope. A read followed by an insert is not enough: both requests can read an empty slot. The losing request needs defined behavior while the first is in progress, such as a retryable in-progress response or a wait for the committed result. It must not start a second provider call.",
      "Then walk through the order of writes and side effects. If the service records success before calling the provider, a crash can leave a false success. If it calls the provider first and only then records success, a timeout or crash leaves an unknown local outcome. That case needs reconciliation, often by querying the provider with the stable operation identifier before any new attempt. Do not label a timeout as a failed charge unless the provider has confirmed failure.",
      "Retention matters after the happy path. A key that expires while clients may still retry can permit a second effect. Ask who sets the retry window and how the service treats an expired key. The exact period is a product and provider decision; the PR should make the boundary visible and test it.",
      { h: "Ask for tests that can expose a second charge" },
      "A useful test drives two identical requests at the service boundary at the same time. Hold the first at the provider call until the second has passed key lookup, then release both. Assert one provider invocation, one durable payment, and the documented response for each caller. This is stronger than calling the handler twice in sequence. Use a real uniqueness constraint or a faithful test database, since an in-memory mock can hide the race.",
      "Add a same-key, different-payload case; a retry after a completed result; a provider timeout after an accepted charge; and a crash or restart between the external call and the local result write. For the uncertain case, assert that reconciliation finds the original payment and that the retry does not charge again. Tests should inspect the side effect and stored state, not only the HTTP status. The [guide to untested paths](/blog/how-to-review-untested-paths-in-ai-prs/) is a way to turn any missing case into a focused request.",
      "Check `verification.performed` and `verification.not_verified` against the current PR head. Review Assist anchors changed hunks and records what the agent says it exercised. Its coverage count means counted hunks have an explanation; it does not simulate concurrent calls or certify payment safety. [What a green check means](/blog/what-a-review-assist-check-means/) explains that limit.",
      { h: "Make the approval condition specific" },
      "A review comment could say: “The new lookup is before the provider call, but two requests can both miss it. Please show the durable unique claim, add a concurrent same-key test that asserts one provider call, and cover a provider success followed by a local timeout. What response do we return for a changed payload and an in-progress operation?”",
      "Approve when the key's scope and lifetime are explicit, the claim is atomic, the provider boundary is protected, and tests cover concurrent duplicates and uncertain outcomes. If the provider cannot confirm an ambiguous charge, record that gap and its operational owner instead of treating a green check as proof of exactly-once processing.",
    ],

    slug: "how-to-review-ai-written-request-logging",
    date: "18 Oct 2026",
    modified: "18 Oct 2026",
    title: "How to review an AI-written request logging change without leaking sensitive data",
    summary: "Inspect every log path, allowlist useful fields, and test emitted records with secret sentinels before approving.",
    hero: "/blog/how-to-review-ai-written-request-logging.png",
    alt: "A request path sends selected safe fields into a log record while a sensitive field stops at the boundary",
    caption: "A useful request log carries diagnostic context without copying sensitive input.",
    body: [
      "When an AI-written PR adds request logging, review the records it can emit, not just the new logger call. List the fields that leave the request, follow every success and failure path to the log sink, and run a test that puts a unique secret in the request and asserts that it never appears in the captured output. The useful outcome is a log that helps diagnose a request without copying credentials or private payloads into it.",
      "Imagine a checkout endpoint where an agent adds middleware that logs the method, path, headers, body, duration, and thrown error. The happy-path record looks helpful. A failed payment may carry an authorization header, an address in the body, or a provider error that echoes part of the request. The review needs to follow those paths too.",
      { h: "Map what can reach each log sink" },
      "Start at the changed logger calls and trace the values they receive. Include framework request logging, exception handlers, retry wrappers, background jobs, and any shared serializer the PR changes. A direct call may log only `requestId`, while a surrounding error handler serializes the whole request or the exception object. Check the actual output format, including nested metadata and stack traces, instead of trusting a type named `SafeRequest`.",
      "Write a small field inventory: which values are required for diagnosis, where each comes from, and whether the field can contain user input. Method, a route template, status, duration, and a generated request ID may be enough. A raw URL can include query parameters; headers and bodies can carry credentials or personal data. Decide on fields by meaning and source, not by whether their names look harmless.",
      "The Intent Document can help you find where the agent made that decision. Compare `problem.user_asks` and `approach.requirements` with the anchored tour. If the request only asked for latency visibility, ask why request bodies were added. [Checking scope drift](/blog/how-to-check-scope-drift-in-ai-written-prs/) is useful when the logging change grew beyond the original ask.",
      { h: "Allowlist useful fields before serialization" },
      "Prefer constructing a new record from explicit safe fields at the point where request data crosses into logging. This keeps a future header or body property from appearing automatically. If a field needs masking, define the transformation and test it for missing, malformed, repeated, and nested values. A blocklist that removes a few known header names can miss a token inside an error message, query string, or object added later.",
      "Check what happens when logging itself fails. A fallback such as `logger.error(error, request)` can restore the exact data the main path removed. Also check whether an error library copies request details into `message`, `cause`, or stack metadata. Keep enough context to debug, such as a request ID and stable error category, without serializing the original payload.",
      "This is an engineering choice for the service, not a claim that Review Assist sanitizes application logs. Review Assist's local validator checks likely secrets in the Intent Document. It does not inspect your service's runtime log stream. The [data-flow article](/blog/where-code-and-transcript-go-in-review-assist/) explains Review Assist's own boundary.",
      { h: "Test emitted records on success and failure" },
      "Capture the real logger output in a focused test. Send one request with a distinctive fake token in an authorization header, query parameter, body field, and nested error detail. Exercise a successful response, a validation failure, and a downstream exception or timeout. Assert that the token is absent from the serialized message and metadata in every record. Also assert the allowed fields are present, so a fix that turns logging off does not pass as useful observability.",
      "Use fake values that look like the data the service receives, and keep the test local. If the application has multiple transports or formatters, exercise the one deployed in production or verify that they share the same serializer. A unit test of a redaction helper alone cannot show what an exception handler or transport emits.",
      "Read `verification.performed` and `verification.not_verified` against the current PR head. Review Assist anchors changed hunks and records what the agent says it checked, but its coverage count only shows that counted hunks have tour anchors. It does not prove that logs are safe. [Reviewing an untested path](/blog/how-to-review-untested-paths-in-ai-prs/) gives a way to turn the remaining gap into a concrete request.",
      { h: "Ask for evidence you can inspect" },
      "A useful review comment is: “The new middleware logs the request body on failure. Please show a captured record for a request with fake credentials in the header, query, body, and nested error. Remove those values from every transport while keeping request ID, route template, status, duration, and a stable error category. Add an assertion for the emitted record, then name any failure path the test still misses.”",
      "Approve when the field inventory is explicit, the output is built from the allowed fields, the failure paths have been checked, and a captured-record test proves both absence of sensitive values and presence of diagnostic context. If a log destination or retention rule sits outside this PR, name its owner as an open question rather than treating code review as proof of the whole data lifecycle.",
    ],
  },

    slug: "how-to-review-ai-written-api-response-changes",
    date: "17 Oct 2026",
    modified: "17 Oct 2026",
    title: "How to review an AI-written API response change without breaking clients",
    summary: "Trace the response field through existing consumers, compare the contract, and test the old client path before approving.",
    hero: "/blog/how-to-review-ai-written-api-response-changes.jpg",
    alt: "An API response shape branches to three clients, with one incompatible path marked for review",
    caption: "A response change is only safe when the clients that receive it still work.",
    body: [
      "When an AI-written PR changes an API response, start with the clients that already consume it. Identify the exact field or behavior that changed, find every known consumer, and run at least one check using the old client against the new provider. An updated schema and passing provider tests are useful, but neither tells you how a deployed client will behave.",
      "Suppose an agent changes `total_cents` to `total` in an order response while updating the web app in the same PR. The new app works with the new API. A mobile build already in users' hands may still read `total_cents`. The review question is whether that old build can make the same request after the server deploys, and what it does with the reply.",
      { h: "Write down the old and new wire behavior" },
      "Compare the response as a client sees it, not just the TypeScript type or serializer. Record the endpoint, status code, content type, and a representative body from the base and proposed head. Look for removed or renamed fields, changed types, new null values, enum changes, different nesting, and altered error responses. A field can keep its name while changing meaning: `total` might be cents in one version and a decimal amount in another.",
      "Use an OpenAPI diff if the repository maintains an accurate spec. It gives you a map of contract changes, not a verdict. A spec can lag behind the handler, and a nominally additive field can still upset a client with strict response validation. Check the actual serialized response and the callers before labeling a change backward compatible.",
      "In Review Assist, compare the original request in `problem.user_asks` with `approach.requirements` and the anchored tour of changed hunks. If the request was to add a display label but the response rename appeared along the way, ask why the rename belongs in this PR. The [scope drift guide](/blog/how-to-check-scope-drift-in-ai-written-prs/) gives a way to separate necessary contract work from an opportunistic cleanup.",
      { h: "Find the clients that cannot deploy with the provider" },
      "Search for the old field name in this repository, generated clients, tests, and any known downstream services. Ask who owns clients outside the repository. Web code may deploy with the API, but a mobile app, SDK, scheduled job, or partner integration can remain on the old contract. Write down the supported client versions and deploy order. If nobody can identify the consumers, treat compatibility as an open question rather than assuming the search was complete.",
      "For the order example, a compatible transition could return both `total_cents` and a clearly specified new field while consumers migrate, then remove the old field only under an agreed retirement plan. That is an option to evaluate, not a universal fix. If the fields can disagree, the provider needs one source of truth and a test for the mapping. If versioning is proposed instead, check how existing clients select their version and whether the old version actually remains served.",
      "Check failures as well as success. A renamed error code, a newly nullable amount, or a changed status can break retry and fallback logic even when the happy-path screen looks right. Review the client branch that handles missing fields and malformed responses, including what the user sees and whether the operation can be retried safely.",
      { h: "Make API contract testing exercise the old caller" },
      "Keep a fixture or consumer contract for the old request and expected response, then run it against the proposed provider. Also run the current client against the new provider. If the service uses generated clients, regenerate them and inspect the generated diff, but keep a check from a previously released client: regeneration alone proves only that the new client understands the new schema.",
      "For `total_cents`, a focused test should send the old request, assert the old field's value and unit, and cover the error response the client relies on. If compatibility is intentionally broken, the PR needs a version or rollout plan with an owner, a client migration path, and a date or condition for removing the old behavior. A green integration suite that only starts the latest web app beside the latest API leaves the deployed-client question unanswered.",
      "Read `verification.performed` and `verification.not_verified` in the Intent Document against the final head commit. Review Assist can show which checks the agent says it ran and anchor the changed handler, schema, and client hunks. Its coverage check confirms that counted hunks have an explanation; it does not run consumer contracts or certify compatibility. The [guide to what the check means](/blog/what-a-review-assist-check-means/) covers that boundary.",
      { h: "Ask for the one piece of missing evidence" },
      "A useful review comment is: “The PR updates the web caller, but the old mobile build reads `total_cents`. Please show the response it receives from this head, add a contract test for that field and its unit, and name when the old field can be removed. If the mobile build cannot be tested here, list that gap and the owner of the rollout decision.”",
      "Approve when the old and new wire behavior is explicit, the relevant consumers are accounted for, the old caller has been exercised against the proposed provider, and any intentional break has a rollout decision. That is the practical answer to an API response review: follow the value across the deploy boundary, then ask for evidence at the boundary that can fail.",

    summary: "Check both flag states, the evaluation failure path, rollout scope, rollback, and cleanup before approving.",
    hero: "/blog/how-to-review-ai-written-feature-flag-rollouts.jpg",
    alt: "Two code paths controlled by a feature flag, with a rollback path from a failed rollout",
    caption: "The flag adds a second production path. Review both.",
    body: [
      "When an agent puts a change behind a feature flag, review the two behaviors it creates. Check what runs with the flag off, what runs with it on, and what happens when the flag value cannot be read. Then ask who can turn it on, how they will observe the rollout, and how they will turn it off. A flag can limit exposure, but it does not make the new path correct.",
      "Suppose a PR adds a new checkout price calculation behind a flag. The agent writes the new calculation and wraps the call in an `if`. The obvious diff is small. The review still has to cover which customers see each price, whether both paths use the same inputs, and what happens to an in-flight checkout if the flag changes.",
      { h: "Define the behavior on each side of the flag" },
      "Start with the request that led to the PR. Is the flag there for a gradual rollout, an internal test, or a fast disable switch? Those goals lead to different defaults and ownership. Ask the author to write down the expected behavior for off, on, and unavailable. For a price calculation, compare the amount shown to the customer with the amount charged and recorded. A test that only checks the new helper misses the boundary between the helper and the checkout flow.",
      "Read the flag evaluation where the application actually makes the decision. Check its default value, the identity or account used for targeting, and whether a cached value can change mid-request. If the new path writes data that the old path cannot read, switching the flag off may not restore the old behavior. Follow the changed data shape through readers, background jobs, and stored records before calling it reversible.",
      "In Review Assist, compare the proposed rollout with `problem.user_asks`, `approach.requirements`, and any assumptions in the committed Intent Document. The guided tour can point you to changed hunks. It cannot tell you whether every path through the flag is safe.",
      { h: "Test the flag matrix, including failure" },
      "A practical feature flag testing matrix starts with off and on at the service boundary, then adds a failed or delayed flag lookup. For each state, check the observable result and any side effect. In the checkout example, that means the returned total, the persisted order amount, and any downstream event. Run these tests with the targeting context the rollout will use, not just a hard-coded Boolean in a unit test.",
      "Look for behavior that differs across instances or over time. If the flag is evaluated once when a request starts, confirm that every later step uses that decision. If it is evaluated again before writing an order, a customer might see one price and be charged another. If the flag provider is unavailable, the fallback must be explicit and tested. A safe fallback is a product decision tied to the data and operation, not a universal default.",
      "Read `verification.performed` and `verification.not_verified` for the actual head commit. A passing suite is useful only if it exercised the states and side effects you care about. The [guide to untested paths](/blog/how-to-review-untested-paths-in-ai-prs/) shows how to turn a missing case into a focused review request.",
      { h: "Make the rollout and rollback executable" },
      "Ask for the first audience, expansion rule, metric or log that signals trouble, and the person who can change the flag. For the price example, a rollout plan might start with internal accounts, compare calculated totals across old and new paths without charging twice, and expand only after mismatches are understood. The exact thresholds belong to the team operating checkout. The PR should at least name the signal and the decision owner.",
      "Check that turning the flag off reaches the old behavior without another deploy. If the new path has already changed data, queued jobs, or external calls, a toggle alone may not undo the effect. Ask what must be repaired and how the team will detect a partial rollback. If schema or backfill work travels with the flag, follow the [database migration review](/blog/how-to-review-ai-written-database-migrations/) too.",
      "Finally, give the flag an exit condition. Who will remove the old branch after rollout, and what evidence says it is safe to do so? A permanent two-path implementation increases the number of states future changes must handle. If the flag is deliberately long-lived, say why and identify its owner.",
      { h: "Ask for the missing proof" },
      "A useful review comment is: “The new price path is covered when the flag is on. Please add a test for the off path and a failed flag lookup at checkout, show which account key controls targeting, and state what happens if we disable the flag after new-price orders have been written. Who watches mismatches during the first rollout?”",
      "Approve when both paths and the failure path have a defined result, the evidence covers the side effects, and the rollout has an owner with a usable rollback. Review Assist helps you locate the agent's intent and claimed verification; its coverage check confirms that changed hunks were explained. The decision about whether the flag is safe to ship still rests on the code, tests, and rollout plan.",

    slug: "how-to-review-ai-written-npm-audit-fix-prs",
    date: "15 Oct 2026",
    modified: "15 Oct 2026",
    title: "How to review an AI-written npm audit fix pull request",
    summary: "Trace the advisory through the dependency tree, inspect what the fix actually changed, and test the affected behavior before approving.",
    hero: "/blog/how-to-review-ai-written-npm-audit-fix-prs.jpg",
    alt: "A dependency graph before and after a fix, with one changed package highlighted for review",
    caption: "Follow the changed dependency path, not just the new audit count.",
    body: [
      "When an agent opens a PR after running `npm audit fix`, review the change as a dependency upgrade with a security reason. First identify the advisory and the installed package path it affects. Then inspect the manifest and lockfile changes, run a clean install, and test the code that consumes the changed packages. A lower vulnerability count is useful evidence, but it is not an approval decision.",
      "Suppose the PR says it fixes a vulnerable transitive package in a Node service. The agent may have changed only `package-lock.json`, or it may have used `--force` and moved a direct dependency across a major version. Those are different reviews. Ask for the command and the before-and-after dependency path before reading hundreds of lockfile lines.",
      { h: "Locate the advisory in the installed tree" },
      "Read the original audit finding: affected package, vulnerable range, severity, advisory, and the path from a direct dependency to the installed version. Use `npm ls <package>` in the relevant workspace to see why it is present. Also ask whether the affected package ships to production or is used only by a development tool. That does not by itself settle exploitability, but it tells you which behavior and deployment path need attention.",
      "Record the starting state. A useful PR description names the advisory, the old and new installed versions, and the command that produced the change. If the initial report was not kept, rerun the audit against the base branch in a separate checkout. Audit results can change as advisories change, so distinguish a newly reported finding from a dependency introduced by this PR.",
      "In Review Assist, compare that reason with the original ask in `problem.user_asks` and the constraints in `approach.requirements`. If the agent also upgraded unrelated packages, use the [scope review](/blog/how-to-check-scope-drift-in-ai-written-prs/) to decide whether they belong in the same PR.",
      { h: "Read the package changes as code changes" },
      "Check `package.json`, the lockfile, and workspace manifests together. Name every direct dependency whose declared range changed. In the lockfile, follow the path that resolves the vulnerable package and scan for other changed top-level packages, new registries, install scripts, and a large unrelated resolution churn. A lockfile diff is generated data, but it still defines what a clean install will run.",
      "Find out whether the agent used plain `npm audit fix` or `npm audit fix --force`. npm documents that the first applies compatible updates and that `--force` can install top-level packages outside their stated ranges, including major versions. If a major upgrade was needed, read that package's migration notes and inspect the repository code that calls it. Do not treat an audit command's exit status as a compatibility test. See [npm's audit command documentation](https://docs.npmjs.com/cli/commands/npm-audit/) for the command behavior.",
      "For a transitive change, the consuming API might stay stable, but you still need the path and an appropriate test. For a direct major change, review configuration, imports, plugin interfaces, and runtime assumptions. If the PR combines several remediations, make the evidence specific to each affected package rather than one blanket claim that the suite passed.",
      { h: "Reproduce the result and exercise the consumer" },
      "From the proposed head, run `npm ci` with the repository's normal Node and npm versions so the committed lockfile drives a clean install. Rerun `npm audit` and compare the remaining findings with the PR's claim. A clean audit means the registry reported no known findings for that dependency tree at that time; it does not prove that the package or application is secure.",
      "Then run the repository's build and relevant tests. Add a focused check for the actual consumer: for example, an HTTP client upgrade should exercise the request and error paths your service uses, while a build-tool upgrade should produce the expected artifact. If the affected package is deployed, ask how the changed path was tested in the deployed runtime. A passing test suite that never reaches the upgraded behavior leaves a specific gap.",
      "Review Assist records checks that ran in `verification.performed` and gaps in `verification.not_verified`. Match those entries to the final dependency tree and code. Its tour can anchor the changed manifest and lockfile hunks, while the GitHub App recounts coverage on the PR. That coverage only says the changed hunks have an explanation. It does not scan dependencies or establish that the remediation works. The [green-check guide](/blog/what-a-review-assist-check-means/) explains that boundary.",
      { h: "Decide what remains open" },
      "If the audit still reports a finding, identify which package path remains and why the chosen fix did not remove it. The answer may be a blocked upstream upgrade, an incompatible major release, or a finding with no available fix. Record the owner and follow-up; do not silently describe the PR as fully remediated. If a proposed workaround changes application behavior, review and test that behavior separately.",
      "A useful review request is: “The audit count fell, but this PR also moves our direct HTTP client to a new major version. Please show the advisory path that required it, link the migration note, and add a test for our timeout and error handling on the new version. Also list the finding that remains in `npm audit`.” That gives the author a finite set of evidence to provide.",
      "Approve when you can trace the reported risk to the installed dependency, explain each package change, reproduce the new tree, and point to tests for the affected behavior. If one of those links is missing, ask for that link. The goal is a reviewable security fix, not a tidy audit number.",

    slug: "how-to-review-ai-written-database-migrations",
    date: "14 Oct 2026",
    modified: "14 Oct 2026",
    title: "How to review an AI-written database migration",
    summary: "Check the rollout order, old and new code compatibility, backfill behavior, and recovery plan before approving a schema change.",
    hero: "/blog/how-to-review-ai-written-database-migrations.jpg",
    alt: "A reviewer traces a schema change through old, transitional, and new table shapes",
    caption: "Review the transitional state, not just the final schema.",
    body: [
      "For an AI-written database migration, review the sequence of states the system will actually pass through. Ask whether the old application can run with the new schema, whether new code can run before every row is backfilled, and what happens if the deploy stops halfway. A migration file that works on an empty test database answers none of those questions.",
      "Consider a PR that adds `account_id` to `orders` and eventually makes it required. Existing orders have no value for that column. A safe review has to account for the code, data, and deployment order, not just the `ALTER TABLE` statement.",
      { h: "Write down the rollout sequence" },
      "Ask the author to name each deployable step: add a nullable column, write it for new orders, backfill existing orders, verify the result, switch reads if needed, and only then enforce `NOT NULL`. The exact sequence depends on the repository and database. The point is to make each intermediate state explicit so you can check it against the real deploy process.",
      "Look for the application version that is live while the migration runs. If old code continues to insert orders without `account_id`, a `NOT NULL` constraint in the first deploy can break writes. If new code reads the column before the backfill completes, it needs a defined behavior for null rows. Ask which step makes every writer compatible and which step removes that temporary behavior.",
      "Review Assist's Intent Document records requirements and assumptions, while its guided tour anchors the explanation to changed hunks. Use those as a map: find the migration, every writer, every reader, and any deployment configuration changed by the PR. An anchored tour is an explanation of the diff, not proof that the rollout order is safe.",
      { h: "Check the backfill against real data" },
      "For `orders.account_id`, ask where the value comes from for historical orders. Is there a reliable relationship to an account, or are some rows genuinely ambiguous? Do not approve a default account ID merely because it makes the constraint pass. The owner of the data rule needs to decide what those rows mean.",
      "Inspect how the backfill runs on the expected table size. A single transaction over millions of rows may hold locks or create more load than the release window allows. A batched job needs a stable cursor, a way to resume, and idempotent updates so a retry does not overwrite a corrected value. Ask for the query or job and the expected row count; then check the actual database's locking and migration behavior rather than assuming one engine's behavior applies to another.",
      "Verification should name the invariant, not just say that the migration ran. For this example, useful evidence is a count of orders still missing `account_id`, a check that every populated value points to the intended account, and a test that writes continue while old and new application versions overlap. If those checks have not run, keep them visible as open work. The guide to [reviewing an untested path](/blog/how-to-review-untested-paths-in-ai-prs/) covers how to make that gap actionable.",
      { h: "Ask what can be reversed" },
      "Rollback is different at each step. Before enforcing the constraint, reverting application code may be possible if the old version ignores the added nullable column. After new writes depend on it, or after a column is dropped, rolling back code can lose behavior or data. Ask the author to state the last reversible step and the recovery action beyond it, including whether the team would roll forward instead of running a down migration.",
      "Be especially cautious when a PR combines adding, backfilling, enforcing, and deleting old fields in one release. Separating those steps gives reviewers a chance to observe data before removing the compatibility path. If the team intentionally ships them together, the PR should explain its deployment guarantees and failure recovery, with an owner accepting that risk.",
      { h: "Use the review to request one concrete proof" },
      "Read `verification.performed` and `verification.not_verified` in the committed document or guided review. Match each claimed check to the final code and to the migration state it exercises. Review Assist's local validator checks document structure, diff coverage, staleness, cross-references, and likely secret patterns. The GitHub App recounts coverage on the PR. Neither check runs the migration or proves that a backfill is correct.",
      "A useful comment on the example would be: “The first deploy adds `account_id` as required, but the currently deployed writer still inserts without it. Can we add it nullable first, show the backfill query and remaining-null count, then enforce the constraint after all writers have changed? Please also state how we recover if the backfill stops halfway.” That request names the failure mode, evidence, and rollout decision.",
      "Before approval, you should be able to point to a compatible sequence, a rule for historical rows, evidence for the transitional state, and a recovery plan. If one is missing, ask for that specific piece. A generic database migration checklist will not settle a question that depends on this repository's deploy order and data.",

  },
