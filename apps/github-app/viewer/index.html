// Newest first, from releases.json. The build and the mock server inline that file into
// #release-notes (build/release-notes.mjs), and the publish workflow writes each release
// its entry there from the commits it ships.
const RELEASES = JSON.parse(document.getElementById("release-notes")?.textContent || "[]");

function renderLogin(ref){
  const back = encodeURIComponent(location.pathname + location.hash);
  document.getElementById("app").replaceChildren(centered(
    el("h1",{},"Sign in to review"),
    el("p",{class:"text-ink-600"}, `${ref.owner}/${ref.repo} #${ref.pull} — sign in with GitHub to load this walkthrough.`),
    el("a",{class:"btn-primary mt-2", href:`/api/login?return=${back}`}, "Sign in with GitHub")));
}

function render(){
  const doc = STATE.data.document, m = STATE.data.meta, cov = STATE.coverage;
  const covOk = cov.unexplained.length === 0;
  const covTag = el("span",{class: (covOk ? "tag tag-ok" : "tag tag-warn") + " hidden sm:inline-flex"},
    covOk ? `${cov.explained} of ${cov.total} changes explained`
          : `${cov.unexplained.length} change${cov.unexplained.length>1?"s":""} uncovered`);

  const header = el("header",{class:"sticky top-0 z-20 border-b border-ink-200 bg-canvas"},
    el("div",{class:"flex w-full max-w-[120rem] items-center gap-3 px-4 py-3 md:px-6"},
      el("span",{class:"min-w-0 truncate font-mono text-sm text-ink-700"}, `${m.owner}/${m.repo}`),
      el("span",{class:"id-chip shrink-0"}, `#${m.pull}`),
      el("span",{class:"hidden truncate text-ink-500 sm:inline"}, m.title || ""),
      el("span",{class:"flex-1"}),
      covTag,
      STATE.me ? el("span",{class:"tag hidden md:inline-flex"}, "@"+STATE.me) : null,
      themeToggle()));

  const route = reviewRoute(doc);
  const goView = view => { STATE.view=view; render(); };
  const nav = el("nav",{class:"route-rail"},
    el("p",{class:"route-rail-h"},"Review route"),
    el("p",{class:"route-rail-lead"}, "Start with why and what was checked, then what could change the decision."),
    ...route.map((step, i) => el("button",{
      class:"route-step"+(STATE.view===step.key ? " is-active" : ""), onclick:()=>goView(step.key)
    }, el("span",{class:"route-index"}, String(i+1)),
       el("span",{class:"min-w-0 flex-1"}, el("span",{class:"route-step-title"},step.label),
          el("span",{class:"route-step-detail"},step.detail)),
       step.count ? el("span",{class:step.key==="route" ? "tag tag-warn" : "tag"}, String(step.count))
         : step.total ? el("span",{class:"tag tag-ok", title:"All decided", html:lineIcon("check", 12)}) : null)),
    cov.unexplained.length ? el("button",{class:"route-step mt-4",onclick:()=>goView("coverage")},
      el("span",{class:"route-index"}, "!"), el("span",{class:"flex-1 font-medium"}, "Uncovered changes"),
      el("span",{class:"tag tag-warn"}, String(cov.unexplained.length))) : null,
    STATE.me ? el("button",{class:"route-step mt-4",onclick:()=>goView("submit")},
      el("span",{class:"route-index"}, "✓"), el("span",{class:"flex-1 font-medium"}, "Submit review")) : null);

  const railbar = el("div",{class:"route-mobile"},
    ...route.map((step, i) => el("button",{class:STATE.view===step.key ? "is-active" : "", onclick:()=>goView(step.key)},
      `${i+1}. ${step.label}`, step.count ? ` (${step.count})` : "")),
    cov.unexplained.length ? el("button",{class:STATE.view==="coverage" ? "is-active" : "",onclick:()=>goView("coverage")}, "Uncovered") : null);

  // Prose views keep a reading measure; the code-bearing views get the whole canvas.
  const wide = STATE.view !== "submit";
  const main = el("main",{class:"view"},
    el("div",{class: wide ? "view-wide" : "view-prose"},
      STATE.view==="route" ? renderReviewRoute(doc)
      : STATE.view==="overview" ? renderOverview(doc)
      : STATE.view==="questions" ? renderQuestions(doc)
      : STATE.view==="diagrams" ? renderDiagrams(doc)
      : STATE.view==="verify" ? renderVerify(doc)
      : STATE.view==="coverage" ? renderCoverage()
      : STATE.view==="submit" ? renderSubmitReview()
      : renderStop()));

  document.getElementById("app").replaceChildren(header, railbar, el("div",{class:"route-shell"}, nav, main));
  runMermaid();
}

function currentTheme() {
  const attr = document.documentElement.getAttribute("data-theme");
  if (attr) return attr;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function themeToggle() {
  const dark = currentTheme() === "dark";
  return el("button",{
    class:"btn-ghost !px-3 !py-2", title:"Toggle light / dark",
    onclick:()=>{
      const next = dark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      // The release notes are separate pages now, not views of this one, so a choice that
      // lived only on <html> reset on every link. Read back in <head>, before first paint.
      try { localStorage.setItem("theme", next); } catch {}
      rerenderCurrent();
    }
  }, dark ? "Light" : "Dark");
}

/** Re-render whichever view is on screen, keeping the scroll position. The header is
 *  shared by three routes, so the toggle cannot assume the PR view is the live one. */
function rerenderCurrent() {
  stopDemo();
  const y = window.scrollY;
  const page = sitePage();
  if (page) document.getElementById("app").replaceChildren(page);
  else render();
  window.scrollTo(0, y);
}

// Document fields are point lists: "- one\n- two". As a text node the newlines collapse
// and the dashes show up mid-sentence, so split them back into a real list. A field with
// no bullets stays inline, which is what the single-point fields want.
/**
 * A hunk id as a chip, navigating to the stop covering it when there is one.
 *
 * Falls back to a plain label rather than a dead button: a chip that looks clickable and
 * does nothing is worse than one that does not pretend. That happens for a document
 * written before anchors kept their ids, and for an id no stop covers.
 */
function hunkChip(id){
  const i = STATE.stopOfHunk ? STATE.stopOfHunk[id] : undefined;
  if (i === undefined) return el("span",{class:"id-chip ml-1"}, id);
  return el("button",{class:"id-chip ml-1 cursor-pointer", title:"Go to the stop covering "+id,
    onclick:()=>{ STATE.view="tour"; STATE.stopIndex=i; render(); }}, id);
}

/** Hunk-id chips for a list of ids, or null when there are none. */
function hunkChips(ids){
  const list = (ids || []).filter(Boolean);
  return list.length ? el("span",{class:"shrink-0"}, ...list.map(hunkChip)) : null;
}

function points(text, cls){
  const lines = String(text ?? "").split("\n").filter(l => l.trim());
  const isBullet = l => /^[-*+]\s+/.test(l.trim());
  if (lines.length <= 1 || !lines.some(isBullet)) return el("span",{class:cls}, String(text ?? ""));
  const list = el("ul",{class:"list-disc space-y-1 pl-5 "+(cls||"")});
  let li = null;
  for (const l of lines){
    const t = l.trim();
    if (isBullet(t)) { li = el("li",{}, t.replace(/^[-*+]\s+/, "")); list.append(li); }
    else if (li) li.append(" " + t);            // continuation of the bullet above
    else list.append(el("li",{}, t));
  }
  return list;
}

function labeled(label, ...body){
  if (body.length === 1 && body[0] && body[0].tagName === "UL")
    return el("div",{class:"mt-3"}, el("p",{class:"font-medium text-ink-900"}, label), body[0]);
  return el("p",{class:"mt-3"}, el("span",{class:"font-medium text-ink-900"}, label+" "), ...body);
}

/**
 * How many anchored items moved to the walkthrough, so the Overview can say so. Open
 * questions are not counted: they all have their own route step.
 *
 * Without this the Overview looks thinner than the document is, and a reader cannot tell
 * whether something was dropped or relocated. Showing the item in both places instead
 * would be the duplication this redesign exists to remove.
 */
function movedToStops(doc){
  const anchored = xs => (xs || []).filter(x => (x.anchors || []).length).length;
  const nv = (doc.verification?.not_verified || []).filter(n => typeof n !== "string" && (n.anchors || []).length).length;
  return anchored((doc.assumptions || []).filter(a => (a.confidence || "unverified") === "unverified"))
    + anchored(doc.unresolved) + nv;
}

/** The first screen is one review cue and its evidence, not the whole document at once.
 * Every value here comes from the published Intent Document, so the route stays an aid to
 * judgement rather than pretending to score the reviewer or prove the code correct. */
function renderReviewRoute(doc){
  const openStop = i => { STATE.view="tour"; STATE.stopIndex=i; render(); };
  const cues = reviewCues(doc);
  if (!cues.length) {
    return el("div",{class:"mx-auto max-w-prose py-16"},
      el("h1",{}, "Nothing needs a decision first"),
      el("p",{class:"mt-3 text-ink-600"}, "Walk the change to see why each hunk exists."),
      el("div",{class:"mt-6 flex gap-2"},
        el("button",{class:"btn-primary",onclick:()=>openStop(0)}, "Walk the change")));
  }

  const i = Math.min(STATE.cueIndex, cues.length - 1);
  const cue = cues[i];
  const goCue = n => { STATE.cueIndex = n; render(); };
  const hunk = cue.anchors.find(id => STATE.stopOfHunk?.[id] !== undefined);
  const stopIndex = hunk === undefined ? 0 : STATE.stopOfHunk[hunk];
  const stop = hunk === undefined ? null : STATE.ordered[stopIndex];

  const code = el("div",{class:"evidence-code"});
  if (stop) {
    for (const hp of hunksForStop(stop, STATE.files)) {
      code.append(hp.missing
        ? el("div",{class:"diff"}, el("div",{class:"diff-file"}, hp.path, el("span",{class:"tag tag-warn"}, "no matching change")))
        : renderHunk(hp.path, hp.hunk));
    }
  } else {
    code.append(el("div",{class:"card text-ink-600"}, "This cue concerns the change as a whole. Walk the diff to inspect the related code."));
  }

  const pagerBtn = (label, icon, to) => el("button",{class:"cue-page", "aria-label":label,
    disabled: to < 0 || to >= cues.length ? "" : null, onclick:()=>goCue(to), html:lineIcon(icon, 16)});
  const relatedLink = label => stop
    ? el("button",{class:"mt-4 text-sm font-medium text-accent-700",onclick:()=>openStop(stopIndex)}, label)
    : null;

  // Built through el(), which drops null children. Element.append would print them as "null".
  let body;
  if (cue.kind === "assumption") {
    const a = cue.data;
    body = [
      el("p",{class:"id-chip mb-2"}, a.id + " · Assumption"),
      el("h1",{class:"mb-5 text-heading"}, a.assumption),
      el("dl",{class:"cue-meta"},
        el("div",{},el("dt",{},"If wrong"),el("dd",{class:"text-ink-800"},a.impact_if_wrong)),
        a.how_to_verify ? el("div",{},el("dt",{},"How to verify"),el("dd",{class:"text-ink-800"},a.how_to_verify)) : null),
      relatedLink(stop && "Related change · "+stop.id+" "+stop.title+" →"),
      decisionControl("assumption", a),
    ];
  } else {
    body = [
      el("p",{class:"id-chip mb-2"}, "Unresolved question"),
      el("h1",{class:"mb-5 text-heading"}, cue.data.question),
      cue.data.note ? el("p",{class:"text-ink-700"},cue.data.note) : null,
      relatedLink("Open the related change →"),
      decisionControl("unresolved", cue.data),
    ];
  }

  const card = el("section",{class:"cue-card evidence-text"},
    el("div",{class:"mb-4 flex items-center justify-between gap-3"},
      el("div",{class:"cue-pager"},
        pagerBtn("Previous risk cue", "chevron-left", i - 1),
        el("p",{class:"eyebrow"}, `Risk cue ${i + 1} of ${cues.length}`),
        pagerBtn("Next risk cue", "chevron-right", i + 1)),
      el("span",{class:"tag tag-warn"}, cue.kind === "assumption" ? "unverified" : "needs attention")),
    ...body);

  // The route is a sequence: Continue visits every cue, then starts the walkthrough at its
  // first stop so no stop is skipped. "Related change" is the jump to this cue's own code.
  const hasNext = i < cues.length - 1;
  const after = nextRouteStep(doc, "route");
  const f = document.createDocumentFragment();
  f.append(el("div",{class:"evidence-split cue-grid"}, card, code));
  f.append(routeBar(
    hasNext ? `risk cue ${i + 2} of ${cues.length}` : after.label,
    continueButton(() => hasNext ? goCue(i + 1) : after.go())));
  return f;
}

/** The why of the change as four equal panels, two to a row on a wide screen: the problem
 *  beside the approach, then the requirements beside what was tried and dropped. Half the
 *  width each fills the screen while every line stays at a reading measure. Items about the
 *  whole change that still need a decision follow in the same grid. */
function renderOverview(doc){
  const p = doc.problem, ap = doc.approach;
  const panel = (title, ...body) => el("section",{class:"ov-panel"}, el("h2",{class:"ov-panel-h"}, title), ...body);
  const f = document.createDocumentFragment();

  f.append(el("header",{class:"grid-field ov-head"},
    el("p",{class:"eyebrow mb-1"}, p.origin==="emerged_during_session" ? "The problem was defined over the course of the session" : "Problem stated up front"),
    el("h1",{}, "Overview")));

  f.append(el("div",{class:"ov-grid"},
    panel("The problem",
      el("p",{class:"ov-problem"}, p.statement),
      p.out_of_scope?.length ? el("div",{class:"ov-scope"},
        el("p",{class:"ov-label"}, "Out of scope"),
        el("ul",{class:"ov-list"}, ...p.out_of_scope.map(x => el("li",{}, x)))) : null),
    panel("Approach",
      points(ap.adopted.summary, "text-ink-800"),
      labeled("Rationale.", points(ap.adopted.rationale, "text-ink-700"))),
    ap.requirements?.length ? panel(`Requirements (${ap.requirements.length})`,
      el("ul",{class:"ov-list"}, ...ap.requirements.map(r =>
        el("li",{}, r.text, r.source ? el("span",{class:"text-ink-400"}, ` (${r.source})`) : null)))) : null,
    ap.trials?.length ? panel(`Considered and rejected (${ap.trials.length})`,
      ...ap.trials.map(t => el("div",{class:"ov-trial"},
        el("p",{class:"font-medium text-ink-900"}, t.what),
        el("p",{class:"mt-1 text-ink-700"}, "Outcome: " + t.outcome),
        el("p",{class:"mt-1 text-ink-700"}, "Dropped because: " + t.why_abandoned)))) : null));

  // Only the UNVERIFIED assumptions are reading. `grounded_in_code` and `confirmed_by_user`
  // are settled — 40 of the 68 in this repo's own documents, and mostly the agent scoping
  // the document rather than describing the code. A settled assumption is not a thing to
  // review, so it does not take a reviewer's minute. Mirrors the validator's renderer.
  //
  // And only the ones belonging to the WHOLE change stay here. An assumption anchored to a
  // hunk is shown at that stop instead, where a reviewer is looking at the code it bears
  // on; repeating it here would say it twice. `movedToStops` reports the count so the page
  // never looks as though something went missing.
  const liveAssumptions = (doc.assumptions || []).filter(a =>
    (a.confidence || "unverified") === "unverified" && !(a.anchors || []).length);
  const moved = movedToStops(doc);
  if (moved) f.append(el("p",{class:"mt-5 text-sm text-ink-500"},
    moved + " more " + (moved===1?"item is":"items are") + " attached to walkthrough stops, shown where the code is."));

  // Raised and not settled. `unanswered` leads deliberately. Measured across 32 runs, 67 of
  // 279 diff-provoked questions got no reply at all, and they include a secret blast radius
  // and an unpinned image. An unanswered question about a code risk means the risk was never
  // considered, which makes it the strongest finding here rather than the weakest.
  const DISPOSITION = {
    unanswered: ["Never answered", "tag tag-warn", "Nobody considered this."],
    escalated: ["Asked for your eyes", "tag tag-warn", "The developer wants a human to look here."],
    accepted_partial: ["Known and shipped", "tag", "A risk the developer took knowingly."],
  };
  const order = { unanswered: 0, escalated: 1, accepted_partial: 2 };
  const globalUnresolved = (doc.unresolved || []).filter(u => !(u.anchors || []).length)
    .sort((a,b) => (order[a.disposition] ?? 9) - (order[b.disposition] ?? 9));

  const wholeChange = [
    ...globalUnresolved.map(u => {
      const [label, cls, gloss] = DISPOSITION[u.disposition] || ["Unsettled", "tag", ""];
      return el("div",{class:"ov-panel"},
        el("div",{class:"flex items-start justify-between gap-3"},
          el("span",{class:"font-medium"}, u.question),
          el("span",{class:"shrink-0"}, el("span",{class:cls}, label), hunkChips((u.anchors || []).filter(Boolean)))),
        gloss ? el("p",{class:"mt-1.5 text-sm text-ink-500"}, gloss) : null,
        u.note ? points(u.note, "mt-2 text-ink-700") : null,
        decisionControl("unresolved", u));
    }),
    ...liveAssumptions.map(a => {
      const conf = CONF[a.confidence] || CONF.unverified;
      return el("div",{class:"ov-panel"},
        el("div",{class:"flex items-start justify-between gap-3"},
          el("div",{}, el("span",{class:"id-chip mr-2"},a.id), el("span",{class:"font-medium"}, a.assumption)),
          el("span",{class:"shrink-0"}, el("span",{class:conf.cls}, conf.label), hunkChips(a.anchors))),
        el("dl",{class:"mt-2 space-y-1 text-ink-700"},
          row("If wrong", a.impact_if_wrong),
          a.how_to_verify ? row("How to verify", a.how_to_verify) : null),
        decisionControl("assumption", a));
    }),
  ];
  if (wholeChange.length) f.append(el("section",{class:"mt-10"},
    el("h2",{class:"section-h ov-wide"}, "About the whole change"),
    el("p",{class:"mb-4 text-sm text-ink-500"}, "Unverified, and not tied to one hunk. If any is wrong, the change likely needs rework."),
    el("div",{class:"ov-grid"}, ...wholeChange)));

  // Open questions, answered questions and diagrams each have a route step of their own.
  const next = routeNextBar(doc, "overview");
  if (next) f.append(next);
  return f;
}

/** How to read a diagram of this kind, from the first word of its Mermaid source. */
function diagramGuide(src){
  const kind = String(src || "").trim().split(/\s/)[0];
  if (kind === "sequenceDiagram") return "Read it top to bottom: each arrow is one call or reply, in the order it happens. A labelled box (alt, opt, loop) holds the steps that only run in that case.";
  if (/^(flowchart|graph)$/.test(kind)) return "Follow the arrows: each box is a step or a component, and each arrow is what passes between them.";
  if (/^stateDiagram/.test(kind)) return "Each box is a state, and each arrow is the event that moves from one to the next.";
  if (kind === "erDiagram") return "Each box is a table or entity, and each line says how many of one relate to the other.";
  if (kind === "classDiagram") return "Each box is a type with its fields, and each line shows how two types relate.";
  return null;
}

/** Diagram comments are PR-level comments behind a marker naming the diagram, so the thread
 *  under each diagram reads back from the PR itself. */
const diagramMark = key => `<!-- review-assist:diagram ${key} -->`;
function diagramComments(key){
  return (STATE.discussion || []).filter(c => String(c.body || "").includes(diagramMark(key))).map(c => ({ ...c,
    text: String(c.body).replace(diagramMark(key), "").replace(/^\s*\*\*On diagram [^\n]*\*\*\s*/, "").trim() }));
}

/** The rendered diagram, full screen. Esc closes it, like any modal dialog. */
function expandDiagram(canvas, title){
  const svg = canvas.querySelector("svg");
  if (!svg) return;
  const copy = svg.cloneNode(true);
  copy.removeAttribute("style"); copy.removeAttribute("height"); copy.setAttribute("width", "100%");
  const dlg = el("dialog",{class:"diagram-dialog", "aria-label":title},
    el("div",{class:"diagram-dialog-head"},
      el("h2",{}, title),
      el("button",{class:"btn-ghost", onclick:()=>dlg.close()}, "Close")),
    el("div",{class:"diagram-dialog-body"}, copy));
  dlg.addEventListener("close", () => dlg.remove());
  document.body.append(dlg);
  dlg.showModal();
}

/** Each diagram at full width: what it shows (its caption) and how to read it above the
 *  picture, and its discussion below, where a reviewer can comment on it. */
function renderDiagrams(doc){
  const diagrams = doc.diagrams || [];
  const f = document.createDocumentFragment();
  f.append(el("h1",{class:"mb-1"}, "Diagrams"));
  f.append(el("p",{class:"mb-8 text-ink-500"}, "How the change fits together. Comment on a diagram to ask about the design it shows."));
  diagrams.forEach((d, i) => {
    const key = "D" + (i + 1);
    const canvas = el("figure",{class:"diagram-canvas"}, el("pre",{class:"mermaid"}, d.mermaid));
    canvas.append(el("button",{class:"diagram-expand", onclick:()=>expandDiagram(canvas, d.title)}, "Expand"));
    const thread = diagramComments(key);
    const guide = diagramGuide(d.mermaid);
    f.append(el("section",{class:"diagram", id:"diagram-" + key},
      el("div",{class:"diagram-head"},
        el("p",{class:"eyebrow"}, `Diagram ${i + 1} of ${diagrams.length}`),
        el("h2",{class:"diagram-title"}, d.title),
        d.caption ? el("p",{class:"diagram-caption"}, d.caption) : null,
        guide ? el("p",{class:"diagram-guide"}, guide) : null),
      canvas,
      el("div",{class:"diagram-thread"},
        el("p",{class:"text-sm font-medium text-ink-700"},
          thread.length ? `${thread.length} comment${thread.length === 1 ? "" : "s"}` : "No comments yet"),
        ...thread.map(c => el("div",{class:"diagram-comment"},
          el("p",{class:"mb-1 text-sm text-ink-500"}, el("span",{class:"font-medium text-ink-800"}, "@" + c.user),
            c.sample ? " · sample, not posted" : c.at ? " · " + new Date(c.at).toLocaleDateString() : ""),
          points(c.text, "text-ink-800"))),
        STATE.composer === "diagram:" + key
          ? renderGlobalComposer("diagram:" + key, "", t => `${diagramMark(key)}\n**On diagram ${key}: ${d.title}**\n\n${t}`)
          : el("button",{class:"btn-ghost", onclick:()=>{ STATE.composer = "diagram:" + key; render(); }}, "Comment on this diagram"))));
  });
  const next = routeNextBar(doc, "diagrams");
  if (next) f.append(next);
  return f;
}

/** A link to the walkthrough stop whose code a question concerns, or null when none of
 *  its hunk ids belongs to a stop. */
function seeAtStop(anchors){
  const hunk = (anchors || []).find(id => STATE.stopOfHunk?.[id] !== undefined);
  const stopIndex = hunk === undefined ? -1 : STATE.stopOfHunk[hunk];
  const stop = STATE.ordered[stopIndex];
  return stop ? el("button",{class:"mt-3 text-sm font-medium text-accent-700", onclick:()=>{STATE.view="tour";STATE.stopIndex=stopIndex;render();}},
    `See it at ${stop.id} · ${stop.title} →`) : null;
}

/** Every question, at the end of the route where the reviewer is about to decide: first
 *  what the session left open, then what it asked and answered. An answered question is
 *  not reading, but a reviewer holding the same question should find it settled here,
 *  with the code that settles it, instead of re-deriving the answer. */
function renderQuestions(doc){
  const qs = doc.open_questions || [];
  const resolved = doc.evaluated || [];
  const f = document.createDocumentFragment();
  f.append(el("h1",{class:"mb-1"}, "Open questions"));
  f.append(el("p",{class:"mb-6 text-ink-500"}, qs.length
    ? "What the session could not settle. Weigh these before you decide."
    : "The session left no open questions."));
  const list = el("div",{class:"max-w-prose space-y-3"});
  for (const q of qs){
    list.append(el("div",{class:"card"},
      el("div",{}, el("span",{class:"id-chip mr-2"}, q.id), el("span",{class:"font-medium"}, q.question)),
      q.context ? el("p",{class:"mt-1.5 text-ink-600"}, q.context) : null,
      seeAtStop(q.anchors),
      decisionControl("question", q)));
  }
  f.append(list);

  if (resolved.length){
    f.append(el("section",{class:"mt-10 max-w-prose"},
      el("h2",{class:"section-h"}, `Resolved during the session (${resolved.length})`),
      el("p",{class:"mb-4 text-sm text-ink-500"}, "Asked and answered while the change was written. Check here before raising one of your own."),
      el("div",{class:"space-y-3"}, ...resolved.map(e => el("div",{class:"card"},
        el("div",{class:"flex items-start justify-between gap-3"},
          el("span",{class:"font-medium"}, e.question),
          el("span",{class:"tag tag-ok shrink-0"}, "resolved")),
        el("div",{class:"mt-2"}, points(e.answer, "text-ink-700")),
        seeAtStop(e.anchors))))));
  }
  const next = routeNextBar(doc, "questions");
  if (next) f.append(next);
  return f;
}

function section(title, ...body){ return el("section",{class:"mb-8"}, el("h2",{class:"section-h"}, title), ...body); }
function row(k,v){ return el("div",{class:"flex gap-2"}, el("dt",{class:"shrink-0 text-ink-500"}, k+":"), el("dd",{}, v)); }
function subsection(title, body){ return el("div",{class:"mt-3 border-t border-ink-200 pt-3"}, el("h3",{class:"text-sm font-medium text-ink-600"}, title), body); }

/**
 * Everything still uncertain that belongs to THIS stop.
 *
 * The point of the walk. A reviewer at a stop wants three things — what changed, what to
 * check, and what is still uncertain HERE — and the third used to live in four separate
 * lists on another page, leaving the reader to do the join by hand. Measured on this
 * repo's own documents, 54% of every document was fields with no link to the code.
 *
 * Anchored items move here; unanchored ones stay on the Overview, which is the right home
 * for something about the whole change. Nothing appears in both places: saying it twice is
 * the waste this whole redesign exists to remove.
 */
function liveForStop(doc, ids){
  const mine = a => (a || []).some(h => ids.has(h));
  const nv = (doc.verification?.not_verified || []).map(n =>
    typeof n === "string" ? {text:n, anchors:[]} : {text:n.text, anchors:n.anchors || []});
  return {
    assumptions: (doc.assumptions || []).filter(a => (a.confidence || "unverified") === "unverified" && mine(a.anchors)),
    unresolved: (doc.unresolved || []).filter(u => mine(u.anchors)),
    questions: (doc.open_questions || []).filter(q => mine(q.anchors)),
    unverified: nv.filter(n => mine(n.anchors)),
    evaluated: (doc.evaluated || []).filter(e => mine(e.anchors)),
  };
}

/** The hunk ids a stop covers. Empty for a document written before anchors kept their ids. */
function stopHunkIds(stop){
  return new Set((stop.anchors || []).map(a => a && a.id).filter(Boolean));
}

/**
 * What is still uncertain at this stop, in the order it should be read.
 *
 * Unanswered questions lead. Measured across 32 runs, 67 of 279 diff-provoked questions
 * got no reply at all, and they include a secret blast radius and an unpinned image: an
 * unanswered question about a code risk means the risk was never considered, which makes
 * it the strongest thing on the page rather than the weakest.
 *
 * Silence is reported, not hidden. A core stop with nothing flagged says so, because "we
 * looked and found nothing here" is information, and an empty space is not.
 */
function renderLiveHere(doc, ids, role){
  const live = liveForStop(doc, ids);
  const n = live.assumptions.length + live.unresolved.length + live.questions.length + live.unverified.length;
  const box = el("section",{class:"mt-6 border-t border-ink-200 pt-5"});

  if (!n){
    // Not shown for a supporting or incidental stop: nobody expects a finding there, so
    // the reassurance would be noise.
    if (role !== "core" || !ids.size) return box;
    box.append(el("p",{class:"text-sm text-ink-500"},"Nothing flagged at this stop — no unverified assumption, unsettled question or unexercised path anchors here."));
    return box;
  }

  box.append(el("h2",{class:"section-h"},"Still uncertain here"));

  const DISP = {
    unanswered: ["Never answered", "tag tag-warn"],
    escalated: ["Asked for your eyes", "tag tag-warn"],
    accepted_partial: ["Known and shipped", "tag"],
  };
  for (const u of live.unresolved){
    const [label, cls] = DISP[u.disposition] || ["Unsettled","tag"];
    box.append(el("div",{class:"card mb-3"},
      el("div",{class:"flex items-start justify-between gap-3"},
        el("span",{class:"font-medium"}, u.question),
        el("span",{class:cls}, label)),
      u.note ? points(u.note, "mt-2 text-ink-700") : null,
      decisionControl("unresolved", u)));
  }

  for (const a of live.assumptions){
    box.append(el("div",{class:"card mb-3"},
      el("div",{class:"flex items-start justify-between gap-3"},
        el("div",{}, el("span",{class:"id-chip mr-2"}, a.id), el("span",{class:"font-medium"}, a.assumption)),
        el("span",{class:"tag tag-warn"},"unverified")),
      el("dl",{class:"mt-2 space-y-1 text-ink-700"},
        row("If wrong", a.impact_if_wrong),
        a.how_to_verify ? row("How to verify", a.how_to_verify) : null),
      decisionControl("assumption", a)));
  }

  for (const q of live.questions){
    box.append(el("div",{class:"card mb-3"},
      el("div",{}, el("span",{class:"id-chip mr-2"}, q.id), el("span",{class:"font-medium"}, q.question)),
      q.context ? el("p",{class:"mt-1.5 text-ink-600"}, q.context) : null,
      decisionControl("question", q)));
  }

  if (live.unverified.length){
    box.append(subsection("Never exercised",
      el("ul",{class:"mt-1 space-y-1.5"}, ...live.unverified.map(x=>el("li",{class:"flex items-start gap-2 text-ink-700"},
        el("span",{class:"select-none text-warn-fg"},"\u2014"), el("span",{}, x.text))))));
  }

  // Closed by default and last: these are settled, so they are a lookup for a reviewer who
  // arrives holding the same question, not something to read through.
  if (live.evaluated.length){
    const d = el("details",{class:"mt-4"});
    d.append(el("summary",{class:"cursor-pointer text-sm text-ink-600"},
      live.evaluated.length + " question" + (live.evaluated.length===1?"":"s") + " about this hunk already asked and answered"));
    for (const e of live.evaluated) d.append(el("div",{class:"card mt-2"},
      el("p",{class:"font-medium"}, e.question), points(e.answer, "mt-2 text-ink-700")));
    box.append(d);
  }
  return box;
}

function renderStop(){
  const s = STATE.ordered[STATE.stopIndex];
  const total = STATE.ordered.length;
  const f = document.createDocumentFragment();
  const prose = el("div",{class:"evidence-text"});
  prose.append(el("section",{},
    el("div",{class:"mb-2 flex flex-wrap items-center gap-2 text-sm text-ink-500"},
      el("span",{}, `Stop ${STATE.stopIndex+1} of ${total}`),
      // Core count, because `supporting` and `incidental` stops are not the ones a reviewer
      // has to weigh and knowing how many really matter changes how the walk is paced.
      el("span",{}, `${STATE.ordered.filter(x=>x.role==="core").length} core`),
      el("span",{class: s.role==="core" ? "tag tag-warn" : "tag"}, s.role),
      s.parent ? el("span",{}, `follows ${s.parent}`) : null,
      el("span",{class:"ml-auto"}, titleCase(s.provenance))),
    el("h1",{class:"mb-4"}, el("span",{class:"id-chip mr-2 text-ink-400"}, s.id), s.title),
    // `attention` leads. It is the one line a reviewer with a minute actually reads — "the
    // thing you would check with only a minute" — and it sat below What and Why, which are
    // the longest fields on the page.
    s.attention ? el("div",{class:"note mb-4"}, el("p",{class:"mb-0.5 text-sm font-semibold text-warn-fg"},"Check first"), el("p",{class:"text-ink-800"}, s.attention)) : null,
    labeled("What.", points(s.what, "text-ink-800")),
    labeled("Why.", points(s.why, "text-ink-800"))));

  prose.append(renderLiveHere(STATE.data.document, stopHunkIds(s), s.role));

  const code = el("div",{class:"evidence-code"});
  for (const hp of hunksForStop(s, STATE.files)){
    if (hp.missing){ code.append(el("div",{class:"diff"}, el("div",{class:"diff-file"}, hp.path, el("span",{class:"tag tag-warn"},"no matching change")))); continue; }
    code.append(renderHunk(hp.path, hp.hunk));
  }

  // The last stop hands over to the next route step rather than ending the review there.
  const following = STATE.ordered[STATE.stopIndex + 1];
  const forward = following
    ? { label: `${following.id} · ${following.title}`, go: () => { STATE.stopIndex++; render(); } }
    : nextRouteStep(STATE.data.document, "tour");

  f.append(el("div",{class:"evidence-split"}, prose, code));
  f.append(routeBar(forward ? forward.label : "end of the walkthrough",
    el("button",{class:"btn-ghost", disabled: STATE.stopIndex===0?"":null, onclick:()=>{if(STATE.stopIndex>0){STATE.stopIndex--;render();}}}, "Previous"),
    forward ? continueButton(forward.go) : null));
  return f;
}

// ---------- submit review (approve / request changes) ----------
/** The review body: the coverage line, then the pending decisions grouped by what the
 *  author has to do about them. Asks @mention the PR's author, so GitHub notifies them. */
function reviewSeed(){
  const cov = STATE.coverage;
  const author = STATE.data.meta.author;
  const lines = [`Reviewed via guided walkthrough: ${cov.explained} of ${cov.total} changes explained.`];
  const group = (d, heading) => {
    const items = Object.values(STATE.decisions).filter(x => x.d === d);
    if (!items.length) return;
    lines.push("", heading, ...items.map(x =>
      `- ${x.ref ? "**" + x.ref + "** " : ""}${x.text}${x.note?.trim() ? "\n  " + x.note.trim() : ""}`));
  };
  group("block", "**Blocks merge**");
  group("ask", `**Questions for ${author ? "@" + author : "the author"}**`);
  group("accept", "**Accepted or closed as known**");
  return lines.join("\n");
}
function renderSubmitReview(){
  const m = STATE.data.meta, cov = STATE.coverage;
  const f = document.createDocumentFragment();
  f.append(el("h1",{class:"mb-1"},"Submit review"));

  if (STATE.reviewSubmitted){
    const r = STATE.reviewSubmitted;
    f.append(el("p",{class:"mb-5 text-ink-500"},"Your review is on the pull request."));
    f.append(el("div",{class:"card"},
      el("p",{}, el("span",{class: r.state==="APPROVED" ? "tag tag-ok" : "tag tag-warn"}, titleCase(r.state.toLowerCase())),
        el("span",{class:"ml-2 text-ink-700"}, `${m.owner}/${m.repo} #${m.pull}`)),
      el("p",{class:"mt-3 text-sm text-ink-600"},"Merging stays on GitHub — branch protection, required checks and the merge method live there."),
      el("div",{class:"mt-3 flex gap-2"},
        el("a",{class:"btn-primary", href:r.html_url, target:"_blank", rel:"noopener"}, "View on GitHub"),
        el("a",{class:"btn-ghost", href:`https://github.com/${m.owner}/${m.repo}/pull/${m.pull}`, target:"_blank", rel:"noopener"}, "Open pull request"))));
    return f;
  }

  f.append(el("p",{class:"mb-5 text-ink-500"},"Conclude the review on this pull request as @"+(STATE.me||"")+". Merging stays on GitHub."));
  const covOk = cov.unexplained.length === 0;
  f.append(el("p",{class:"mb-4"},
    el("span",{class: covOk ? "tag tag-ok" : "tag tag-warn"},
      covOk ? `${cov.explained} of ${cov.total} changes explained`
            : `${cov.unexplained.length} change${cov.unexplained.length>1?"s":""} uncovered`)));

  // A "Blocks merge" decision makes Request changes the main action. It is a suggestion,
  // not a lock: the reviewer can still approve.
  const blocking = Object.values(STATE.decisions).filter(x => x.d === "block").length;
  if (blocking) f.append(el("p",{class:"note mb-4 text-sm"},
    `${blocking} item${blocking === 1 ? "" : "s"} marked Blocks merge, so Request changes is suggested.`));

  const ta = el("textarea",{class:"rev-textarea", rows:"8"});
  ta.value = reviewSeed();
  const status = el("span",{class:"rev-status"});
  const btnApprove = el("button",{class: blocking ? "btn-ghost" : "btn-primary"}, "Approve");
  const btnChanges = el("button",{class: blocking ? "btn-primary" : "btn-ghost"}, "Request changes");
  const btnComment = el("button",{class:"btn-ghost"}, "Send without a verdict");
  const buttons = [btnApprove, btnChanges, btnComment];
  const submit = async (event)=>{
    const text = ta.value.trim();
    if (event==="REQUEST_CHANGES" && !text){ status.textContent = "Say what needs to change."; ta.focus(); return; }
    if (event==="COMMENT" && !text){ status.textContent = "Write something to send."; ta.focus(); return; }
    buttons.forEach(b => b.setAttribute("disabled","disabled"));
    status.textContent = "Submitting…";
    try {
      // The marker goes on at send time, outside the editable text, so editing the summary
      // can never change what is recorded.
      const body = text + decisionsMarker();
      const r = await fetch("/api/review",{method:"POST",headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ owner:m.owner, repo:m.repo, pull:m.pull, event, body, commit_id:m.head_sha })});
      const data = await r.json().catch(()=>({}));
      if (r.ok){ recordSentDecisions(); STATE.reviewSubmitted = data.review; render(); return; }
      status.textContent = data.error || "Failed. Try again.";
    } catch(e){ status.textContent = String(e); }
    buttons.forEach(b => b.removeAttribute("disabled"));
  };
  btnApprove.addEventListener("click", ()=>submit("APPROVE"));
  btnChanges.addEventListener("click", ()=>submit("REQUEST_CHANGES"));
  btnComment.addEventListener("click", ()=>submit("COMMENT"));
  f.append(el("div",{},
    ta,
    el("div",{class:"rev-actions"}, ...buttons, status)));
  return f;
}

function renderHunk(path, h){
  const body = el("div",{class:"diff-body"});
  body.append(el("code",{class:"diff-line is-hunk"}, `@@ -${h.old_start},${h.old_lines} +${h.new_start},${h.new_lines} @@${h.header||""}`));
  let newLine = h.new_start;
  for (const line of h.lines){
    const t = line[0];
    const cls = t==="+" ? "is-add" : t==="-" ? "is-del" : "is-ctx";
    const onRight = (t==="+" || t===" " || t===undefined || t==="");
    const lineNo = onRight ? newLine : null;
    const code = el("code",{class:"diff-line "+cls}, line);
    if (onRight && STATE.me){
      const key = path+":"+lineNo;
      const sel = STATE.selAnchor;
      // Shift-click marks the other end of a range. One line is the common case, so a plain
      // click still opens a single-line composer without ceremony.
      const addBtn = el("button",{class:"rev-add",
        title:"Comment on line "+lineNo+" — or select lines with the mouse first, or shift-click a second line, to comment on a range",
        onclick:(e)=>{
          // If the reviewer has dragged across lines, that selection IS the range — no
          // modifier to discover. Falls through to shift-click and single-line otherwise.
          const dragged = e.shiftKey ? null : selectedLineRange(path);
          if (dragged) {
            STATE.selAnchor = null;
            STATE.composer = dragged[0]===dragged[1]
              ? path+":"+dragged[1]
              : `${path}:${dragged[0]}-${dragged[1]}`;
            const ws = window.getSelection(); if (ws) ws.removeAllRanges();
            render();
            return;
          }
          if (e.shiftKey) {
            if (!sel || sel.path!==path) { STATE.selAnchor = {path, line:lineNo}; STATE.composer = null; }
            else {
              const a = Math.min(sel.line, lineNo), b2 = Math.max(sel.line, lineNo);
              STATE.selAnchor = null;
              STATE.composer = a===b2 ? path+":"+b2 : `${path}:${a}-${b2}`;
            }
          } else {
            STATE.selAnchor = null;
            STATE.composer = STATE.composer===key ? null : key;
          }
          render();
        }}, "+");
      const pending = sel && sel.path===path && sel.line===lineNo;
      const inRange = rangeOf(STATE.composer, path);
      const spanned = inRange && lineNo>=inRange[0] && lineNo<=inRange[1];
      body.append(el("div",{class:"rev-line"+(pending||spanned?" is-sel":""),
        "data-path":path, "data-line":String(lineNo)}, code, addBtn));
      for (const root of STATE.comments.filter(c => c.path===path && c.line===lineNo && !c.in_reply_to_id)) body.append(renderThread(root));
      if (STATE.composer===key) body.append(renderComposer(path, lineNo, lineNo, null));
      if (inRange && inRange[1]===lineNo) body.append(renderComposer(path, inRange[0], inRange[1], null));
    } else {
      body.append(code);
    }
    if (onRight) newLine++;
  }
  return el("div",{class:"diff"}, el("div",{class:"diff-file"}, el("span",{}, path)), body);
}

// ---------- Stage C: inline review comments (GitHub-backed) ----------
async function loadComments(){
  const m = STATE.data && STATE.data.meta; if (!m) return;
  try {
    const r = await fetch(`/api/comments?owner=${encodeURIComponent(m.owner)}&repo=${encodeURIComponent(m.repo)}&pull=${m.pull}`);
    if (r.ok) STATE.comments = (await r.json()).comments || [];
  } catch {}
}
/**
 * Line numbers covered by the current text selection within one file's diff.
 * Reading the browser's own selection means the familiar click-and-drag works without the
 * viewer reimplementing drag tracking, and it also picks up double-click and shift-arrow.
 */
function selectedLineRange(path){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
  const range = sel.getRangeAt(0);
  const nums = [];
  for (const el of document.querySelectorAll(".rev-line")) {
    if (el.dataset.path !== path) continue;
    let hit = false;
    try { hit = range.intersectsNode(el); } catch { hit = false; }
    if (!hit) continue;
    const n = Number(el.dataset.line);
    if (Number.isFinite(n)) nums.push(n);
  }
  if (nums.length < 2) return null;
  return [Math.min(...nums), Math.max(...nums)];
}

/** A composer key of "path:start-end" means a range; anything else is a single line. */
function rangeOf(key, path){
  if (!key || !key.startsWith(path+":")) return null;
  const m = /:(\d+)-(\d+)$/.exec(key);
  return m ? [Number(m[1]), Number(m[2])] : null;
}

function renderThread(root){
  const replies = STATE.comments
    .filter(c => c.in_reply_to_id === root.id)
    .sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
  const box = el("div",{class:"rev-thread"}, renderComment(root), ...replies.map(renderComment));
  const key = "reply:"+root.id;
  box.append(el("button",{class:"rev-reply-toggle",
    onclick:()=>{ STATE.composer = STATE.composer===key ? null : key; render(); }}, "Reply"));
  if (STATE.composer===key) box.append(renderComposer(null, null, null, root.id));
  return box;
}
function renderComment(c){
  return el("div",{class:"rev-comment"},
    el("div",{class:"rev-meta"},
      el("span",{class:"rev-author"}, "@"+c.user),
      c.start_line && c.line && c.start_line !== c.line
        ? el("span",{class:"tag"}, `lines ${c.start_line}\u2013${c.line}`) : null,
      c.outdated ? el("span",{class:"tag tag-warn"}, "outdated") : null,
      el("a",{class:"rev-link", href:c.html_url, target:"_blank", rel:"noopener"}, "GitHub \u2197")),
    el("div",{class:"rev-body"}, c.body));
}
function renderComposer(path, startLine, endLine, replyTo){
  const isRange = !replyTo && startLine !== endLine;
  const ta = el("textarea",{class:"rev-textarea", rows:"3",
    placeholder: replyTo ? "Reply\u2026"
      : isRange ? `Comment on lines ${startLine}\u2013${endLine}\u2026`
                : ("Comment on line "+endLine+"\u2026")});
  const status = el("span",{class:"rev-status"});
  const submit = el("button",{class:"btn-primary"}, replyTo ? "Reply" : "Comment");
  submit.addEventListener("click", async ()=>{
    const text = ta.value.trim(); if (!text) return;
    submit.setAttribute("disabled","disabled"); status.textContent = "Posting\u2026";
    const res = replyTo ? await replyComment(replyTo, text)
                        : await postComment(path, startLine, endLine, "RIGHT", text);
    if (res.ok){ STATE.composer = null; STATE.selAnchor = null; await loadComments(); render(); }
    else { submit.removeAttribute("disabled"); status.textContent = res.error || "Failed \u2014 try again."; }
  });
  const cancel = el("button",{class:"btn-ghost", onclick:()=>{ STATE.composer=null; STATE.selAnchor=null; render(); }}, "Cancel");
  const wrap = el("div",{class:"rev-composer"},
    isRange ? el("div",{class:"rev-range"}, `Lines ${startLine}\u2013${endLine}`) : null,
    ta, el("div",{class:"rev-actions"}, submit, cancel, status));
  setTimeout(()=>ta.focus(), 0);
  return wrap;
}
async function postComment(path, startLine, endLine, side, body){
  const m = STATE.data.meta;
  try {
    const r = await fetch("/api/comments",{method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ owner:m.owner, repo:m.repo, pull:m.pull, commit_id:m.head_sha, path,
        line:endLine, side, body,
        ...(startLine!==endLine ? { start_line:startLine, start_side:side } : {}) })});
    if (r.ok) return { ok:true };
    return { ok:false, error:(await r.json().catch(()=>({}))).error };
  } catch(e){ return { ok:false, error:String(e) }; }
}
async function replyComment(commentId, body){
  const m = STATE.data.meta;
  try {
    const r = await fetch("/api/comments/reply",{method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ owner:m.owner, repo:m.repo, pull:m.pull, comment_id:commentId, body })});
    if (r.ok) return { ok:true };
    return { ok:false, error:(await r.json().catch(()=>({}))).error };
  } catch(e){ return { ok:false, error:String(e) }; }
}

// ---------- decisions on assumptions, open questions and unsettled items ----------
// One click records a decision; nothing has to be written. Decisions wait in this browser,
// like a pending GitHub review, then go out together in the review body, so ten decisions
// are one notification rather than ten comments. The review carries a marker that is read
// back on load, so every reviewer sees what was decided and by whom, with no database.
const DECISION_KINDS = ["accept", "ask", "block"];
const decisionLabel = (d, kind) =>
  d === "accept" ? (kind === "assumption" ? "Accept" : "Known, close it") : d === "ask" ? "Ask the author" : "Blocks merge";
const decisionPast = (d, kind) =>
  d === "accept" ? (kind === "assumption" ? "Accepted" : "Closed as known") : d === "ask" ? "Asked the author" : "Marked Blocks merge";
const DECISION_MARK = /<!-- review-assist:decisions (\{[^]*?\}) -->/;

/** A stable key for anything a reviewer decides on: its own id when it has one, otherwise
 *  a short hash of its text, because unsettled items carry no id. */
function decisionKey(item){
  if (item.id) return item.id;
  let h = 5381;
  for (const c of String(item.question || "")) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0;
  return "U-" + h.toString(36);
}
const isDecided = key => !!(STATE.decisions[key] || STATE.recorded[key]);

// Pending decisions are a per-viewer draft, so browser storage is the right home until the
// review is sent; every read and write tolerates storage being unavailable.
const decisionStoreKey = () => { const m = STATE.data?.meta; return m ? `ra-decisions:${m.owner}/${m.repo}#${m.pull}` : null; };
function loadDecisions(){
  try { return JSON.parse(localStorage.getItem(decisionStoreKey()) || "{}") || {}; } catch { return {}; }
}
function saveDecisions(){
  try { localStorage.setItem(decisionStoreKey(), JSON.stringify(STATE.decisions)); } catch {}
}

function decide(kind, item, d){
  const key = decisionKey(item);
  const cur = STATE.decisions[key];
  if (cur && cur.d === d) { delete STATE.decisions[key]; if (STATE.noteOpen === key) STATE.noteOpen = null; }   // a second click clears it
  else STATE.decisions[key] = { ...cur, d, kind, ref: item.id || null, text: item.assumption || item.question || "" };
  saveDecisions();
  render();
}

/** The decision control, identical wherever the item appears (risk cue, stop, overview,
 *  questions), so a decision made in one place shows in all of them. */
function decisionControl(kind, item){
  const key = decisionKey(item);
  const mine = STATE.decisions[key];
  const rec = STATE.recorded[key];
  const current = mine?.d ?? rec?.d ?? null;
  let note = null;
  if (mine && STATE.noteOpen === key) {
    note = el("textarea",{class:"rev-textarea", rows:"2", placeholder:"Optional: why, or what you need from the author"});
    note.value = mine.note || "";
    note.addEventListener("input", () => { STATE.decisions[key].note = note.value; saveDecisions(); });
    setTimeout(() => note.focus(), 0);
  }
  const status = mine
    ? el("p",{class:"decision-status"},
        STATE.me ? "Saved. It posts with your review. " : "Saved in this browser. ",
        el("button",{class:"decision-note-link", onclick:()=>{ STATE.noteOpen = STATE.noteOpen === key ? null : key; render(); }},
          mine.note?.trim() ? "Edit note" : "Add a note"))
    : rec ? el("p",{class:"decision-status"}, `${decisionPast(rec.d, kind)} by @${rec.by}`)
    : null;
  return el("div",{class:"decision"},
    el("div",{class:"decision-buttons", role:"group", "aria-label": "Your decision" + (item.id ? " on " + item.id : "")},
      ...DECISION_KINDS.map(d => el("button",{
        class:"decision-btn is-" + d + (current === d ? " is-on" : ""), "aria-pressed": String(current === d),
        onclick:()=>decide(kind, item, d)}, decisionLabel(d, kind)))),
    status, note);
}

function decisionsMarker(){
  const ds = Object.fromEntries(Object.entries(STATE.decisions).map(([k, v]) => [k, v.d]));
  return Object.keys(ds).length ? `\n\n<!-- review-assist:decisions ${JSON.stringify(ds)} -->` : "";
}
/** Once the review is on GitHub, its decisions are the record: move them out of the draft. */
function recordSentDecisions(){
  for (const [k, v] of Object.entries(STATE.decisions)) STATE.recorded[k] = { d: v.d, by: STATE.me, at: new Date().toISOString() };
  STATE.decisions = {};
  saveDecisions();
}

/** Decisions already sent (from review bodies, latest wins) and the PR-level comments that
 *  diagrams read their threads from. */
async function loadDiscussion(){
  const m = STATE.data?.meta; if (!m) return;
  try {
    const r = await fetch(`/api/discussion?owner=${encodeURIComponent(m.owner)}&repo=${encodeURIComponent(m.repo)}&pull=${m.pull}`);
    if (!r.ok) return;
    const { reviews = [], comments = [] } = await r.json();
    STATE.recorded = {};
    for (const rv of [...reviews].sort((a, b) => String(a.at).localeCompare(String(b.at)))) {
      const mark = DECISION_MARK.exec(rv.body || "");
      if (!mark) continue;
      let ds; try { ds = JSON.parse(mark[1]); } catch { continue; }
      for (const [k, d] of Object.entries(ds)) if (DECISION_KINDS.includes(d)) STATE.recorded[k] = { d, by: rv.user, at: rv.at };
    }
    STATE.discussion = comments;
  } catch {}
}

// ---------- Stage C: global (PR-level) comments for non-line items ----------
/** A PR-level comment box. `decorate` wraps the text before it is posted (a diagram adds the
 *  marker its thread is read back by). The posted comment is echoed into STATE.discussion so
 *  it shows at once. On the public sample there is nobody signed in, so it stays local. */
function renderGlobalComposer(key, seed = "", decorate = t => t){
  const ta = el("textarea",{class:"rev-textarea", rows:"3", placeholder:"Add a comment for the PR discussion\u2026"});
  ta.value = seed || "";
  const status = el("span",{class:"rev-status"}, STATE.me ? "" : "This is a sample: on a real pull request, this posts to the PR discussion.");
  const submit = el("button",{class:"btn-primary"}, "Post to PR");
  submit.addEventListener("click", async ()=>{
    const text = ta.value.trim(); if (!text) return;
    const body = decorate(text);
    if (!STATE.me){
      STATE.discussion.push({ user:"you", at:null, body, sample:true }); STATE.composer=null; render(); return;
    }
    submit.setAttribute("disabled","disabled"); status.textContent="Posting\u2026";
    const res = await postIssueComment(body);
    if (res.ok){ STATE.discussion.push({ user:STATE.me, at:new Date().toISOString(), body }); STATE.composer=null; render(); }
    else { submit.removeAttribute("disabled"); status.textContent = res.error || "Failed. Try again."; }
  });
  const cancel = el("button",{class:"btn-ghost", onclick:()=>{ STATE.composer=null; render(); }}, "Cancel");
  const wrap = el("div",{class:"rev-composer mt-2"}, ta, el("div",{class:"rev-actions"}, submit, cancel, status));
  setTimeout(()=>{ ta.focus(); const n=ta.value.length; ta.setSelectionRange(n,n); }, 0);
  return wrap;
}
async function postIssueComment(body){
  const m = STATE.data.meta;
  try {
    const r = await fetch("/api/issue-comment",{method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ owner:m.owner, repo:m.repo, pull:m.pull, body })});
    if (r.ok) return { ok:true };
    return { ok:false, error:(await r.json().catch(()=>({}))).error };
  } catch(e){ return { ok:false, error:String(e) }; }
}

function renderCoverage(){
  const f = document.createDocumentFragment();
  f.append(el("h1",{class:"mb-1"},"Uncovered changes"));
  f.append(el("p",{class:"mb-5 text-ink-500"},"These changes aren’t accounted for by any walkthrough stop. A complete review explains every change."));
  const wrap = el("div",{class:"space-y-3"});
  if (!STATE.coverage.unexplained.length) wrap.append(el("p",{class:"text-ink-500"},"Everything is accounted for."));
  for (const u of STATE.coverage.unexplained) wrap.append(renderHunk(u.path, u.hunk));
  f.append(wrap);
  return f;
}

function renderVerify(doc){
  const v = doc.verification;
  const f = document.createDocumentFragment();
  f.append(el("h1",{class:"mb-5"},"Verification"));
  const cols = el("div",{class:"ver-split"});
  f.append(cols);
  cols.append(section("Checks performed",
    el("ul",{class:"space-y-2"}, ...v.performed.map(p=>el("li",{class:"flex items-baseline gap-2"},
      el("span",{class:"tag"}, p.kind),
      el("span",{class:"text-ink-800"}, p.description),
      el("span",{class:"text-ink-400"}, "— "+p.result))))));
  // A plain string or {text, anchors}: published content read off open pull requests, so
  // the string form cannot retire. Normalized here, as the renderers do elsewhere.
  const unexercised = (v.not_verified || []).map(n =>
    typeof n === "string" ? {text:n, anchors:[]} : {text:n.text, anchors:n.anchors || []});
  if (unexercised.length) cols.append(section("Not verified",
    el("ul",{class:"space-y-1.5"}, ...unexercised.map(n=>el("li",{class:"flex items-start gap-2 text-ink-700"},
      el("span",{class:"select-none text-warn-fg"},"—"), el("span",{}, n.text), hunkChips(n.anchors))))));
  const next = routeNextBar(doc, "verify");
  if (next) f.append(next);
  return f;
}

window.addEventListener("keydown",(e)=>{
  if (STATE.view!=="tour") return;
  if ((e.key==="j"||e.key==="ArrowRight") && STATE.stopIndex<STATE.ordered.length-1){STATE.stopIndex++;render();}
  if ((e.key==="k"||e.key==="ArrowLeft") && STATE.stopIndex>0){STATE.stopIndex--;render();}
});
window.addEventListener("hashchange", boot);
boot();
</script>
