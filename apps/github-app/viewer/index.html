      "Every repository has a reviewer who knows where it breaks. They know the schema change that needs a migration, the directory whose churn is never incidental, and the test suite that looks green and proves nothing. When an agent writes the code, that knowledge has to reach the review some other way.",
      "In Review Assist it lives in a `.reviewer/` folder: code review guidelines written down once, checked in next to the code, and applied before the pull request opens.",
      "Some context first. Review Assist turns a coding session into an Intent Document, the JSON file committed at `.intent/<branch>.json` that tells a reviewer what was asked, assumed, tried, and verified. Two agents produce it on the developer’s machine: an Author that holds the session, and a cold Intent Reviewer that never sees the session, reads the diff, and questions the Author.",
      { h: "The gap: the same questions in every repository" },
      "Before `.reviewer/`, the Reviewer asked the same baseline set everywhere: what the user asked for, what was assumed, what was tried and abandoned, which changes are incidental, and what was verified. The Intent Document for the change that added the folder, [PR #11](https://github.com/uditk2/review-assist/pull/11), states the problem: “anything true only of one repo (an invariant a past incident bought, churn that is never incidental) can never be asked.”",
      "My ask in that session was one sentence: add a folder called `.reviewer` “to hold reviewer specific instructions so that the reviewer agent can go over it and use it while asking questions.” My next message set the rule that shaped the rest: these are additional questions, not a replacement for the ones the Reviewer already asks.",
      { h: "How it runs before the pull request" },
      { ul: [
        "**You check in the guidelines.** Markdown in `.reviewer/` at the repository root, reviewed in pull requests like any other code.",
        "**`compute_diff` opens the run and reports presence only.** It says how many rule files exist, never what is in them, and tells the Reviewer to read them before it records round one.",
        "**The Reviewer pages the whole diff, then calls `get_reviewer_instructions`.** The MCP server reads the folder and serves it, bounded.",
        "**Each rule the diff triggers becomes a question** for the Author, in the same interview as the baseline questions. The Author answers from the session.",
        "**Findings go two ways:** into the committed Intent Document for whoever reviews the PR, and in the Reviewer’s closing message back to the coding session, which can still fix the code.",
      ] },
      "So the MCP server does not judge the commit itself. It never calls a model. It serves the guidelines to the agent doing the review, and that review happens while the change can still be fixed. The [presence-only report](https://github.com/uditk2/review-assist/blob/1151c9735ab27adb69a1a198487b4c4b623af89e/packages/mcp-server/src/index.ts#L205-L208) and the [read-before-round-one nudge](https://github.com/uditk2/review-assist/blob/1151c9735ab27adb69a1a198487b4c4b623af89e/packages/mcp-server/src/index.ts#L260-L266) are a few lines each.",
      { h: "The design decisions, and why" },
      { ul: [
        "**The server reads the folder, not the agent.** In Claude Code the Reviewer has no file tools, by design. Giving it `Read` for house rules would open the door to the transcript, the one thing the role split exists to block. So the rules arrive the way the diff does: through a bounded tool, and only the `.reviewer/` folder.",
        "**Presence only in `compute_diff`.** I considered carrying the rules in that response and rejected it. A repository can grow its rules until the `run_id` falls out of a truncated result, and a Reviewer that loses its run handle cannot submit. This repo had lost one that way before; a house rule records that “a spilled result once took the `run_id` with it.”",
        "**Additive, said seven times.** The first draft stated the additive framing once, in the questions file. My note that the Reviewer had to be clear on it is why PR #11 put it at seven points of contact, with a test pinning it in the Reviewer’s prompt. A short folder read as the whole set would quietly shorten every interview.",
        "**README first.** `README.md` always sorts first, so the framing survives a budget the rest of the folder does not. Files that do not fit the budget come back listed in `omitted`, to be fetched by name; a file cut partway is flagged `truncated`.",
        "**Reviewer only.** The Author does not get the tool. House rules are questions, and the Author’s job is answering them.",
        "**Untrusted by default.** A fork’s pull request can edit `.reviewer/`, so its content is served as reference material. It cannot change the schema or the validator, which are code. Whether it could talk the Reviewer out of a round depends on the prompt’s framing; more on that below.",
        "**It stays in coverage.** `.intent/` is left out of the count because it is the document’s own output. `.reviewer/` is not, and an edit there changes every future review, so it needs a tour stop like any other change.",
      ] },
      "The limits: `.md`, `.markdown`, and `.txt` files; up to 50 files, in the folder and two levels of subfolders; about 64,000 characters per file; and about 20 KB per response by default. The [ceilings](https://github.com/uditk2/review-assist/blob/1151c9735ab27adb69a1a198487b4c4b623af89e/packages/mcp-server/src/reviewer-instructions.ts#L27-L33) “bound a mistake, not a workload.” The [loader’s header comment](https://github.com/uditk2/review-assist/blob/1151c9735ab27adb69a1a198487b4c4b623af89e/packages/mcp-server/src/reviewer-instructions.ts#L1-L18) gives the reasoning in full.",
      { h: "Its own interview found four defects" },
      "PR #11 was distilled with the feature it added: two rounds, 31 questions, all answered by the Author. The interview found four defects, fixed before the document was written:",
      { ul: [
        "`present` meant “the folder exists” in one function and “there is something readable in it” in another, so a folder with no Markdown was reported absent and present in the same run.",
        "A repository with no consent decision recorded yet was never told the folder existed.",
        "A folder holding only unreadable files was told it did not exist, while its files were listed.",
        "A filename with no dot had its last character taken as its extension.",
      ] },
      "Two were found by reading the diff cold. The other two only became findable after the first pair was fixed. The consent defect is exactly what a house rule written in the same change predicts: “Ask what a consent-path change does to a repo that never opted in.” The feature shipped in [1.0.3](/releases/1.0.3/).",
      { h: "What I could not prove at the time" },
      "The document also records what it could not prove:",
      { ul: [
        "**Nothing enforces the read.** Its assumption A1: “The reviewer calls `get_reviewer_instructions` because prose tells it to; nothing enforces it and no gate at submit checks the folder was read.” That is still true. ",
        "**Framing is not a sandbox.** The defense against a hostile rule file, say one that tells the Reviewer to skip the interview, is framing in the prompt. There is still no test that commits such a file and checks it is ignored.",
        "**The first Reviewer could not see the tool.** The connected server predated the change, so it read the new house rules out of the diff as text. The `verification.md` written in the same change names exactly that failure: “A rebuilt server is not a reloaded one.”",
      ] },
      { h: "Evidence it works" },
      "The check A1 asked for was a distillation on a repository with a `.reviewer/` folder, to see whether its questions show up. [PR #19](https://github.com/uditk2/review-assist/pull/19)’s Intent Document is that run. Its Intent Document carries six questions that start with “House rule,” and two of them led to fixes before merge:",
      { ul: [
        "**Response bounds:** the Reviewer asked what limited the size of a field read from repository content and echoed whole into an error. Nothing did, and it was bounded.",
        "**The viewer is verified in a browser or not at all:** the Reviewer asked whether the page had been opened. It had not, and the generated stylesheet turned out to be stale.",
      ] },
      "The document does not record which round each question came in, so this shows the guidelines reached the interview, not that they arrived in round one.",
      { h: "Write your own" },
      "[How to add repository-specific review questions](/blog/how-to-add-repository-review-rules-for-ai-prs/) is the practical guide. The short version:",
      { ul: [
        "**Write each rule as a conditional question** with the evidence that would settle it.",
        "**Tie it to a failure you have seen.** This repo’s [house rules](https://github.com/uditk2/review-assist/blob/main/.reviewer/README.md) and [verification notes](https://github.com/uditk2/review-assist/blob/main/.reviewer/verification.md) each carry their reason.",
        "**Do not restate the baseline.** The Reviewer already asks it.",
        "**Review rule edits like code.** They change every future review.",
      ] },
      "An absent folder is the normal case and changes nothing. Start with the one question your best reviewer always asks about AI-written pull requests in your repository, then [install Review Assist](/#install) and watch for it in the next interview.",
    ],
  },

    slug: "how-to-review-authorization-changes-in-ai-prs",
    date: "13 Oct 2026",
    modified: "13 Oct 2026",
    title: "How to review authorization changes in an AI-written PR",
    summary: "Trace who can reach the changed path, challenge the permission assumptions, and ask for denial-path evidence before approving.",
    hero: "/blog/how-to-review-authorization-changes-in-ai-prs.jpg",
    alt: "Two reviewers trace allowed and denied paths through an authorization boundary in a code change",
    caption: "Trace the allowed path and the denied path before approving an access change.",
    body: [
      "When an AI-written PR changes an authorization check, start with the rule it is meant to preserve: which identity may do which operation on which resource. Then trace every changed route to the decision point, including the path that must be denied. A plausible explanation and a green check help you navigate. The approval still depends on the code and the evidence.",
      "Take a PR that moves a project membership check from a route handler into shared middleware. The happy path may still work while one route passes the wrong project ID, another bypasses the middleware, or a cached role survives removal. Review the boundary, not just the function that was edited.",
      { h: "Write down the access rule first" },
      "Before reading the diff, state the invariant in one sentence. For example: a user can read a project only while their current membership grants access to it. Name the caller, the resource, the operation, and when a revocation takes effect. If the ticket or policy does not say when membership changes apply, ask the owner. Do not let the agent pick that security tradeoff by default.",
      "Review Assist’s Intent Document is the JSON file committed at `.intent/<branch>.json`, written from the coding session to explain the change. Compare it with the ticket or policy:",
      { ul: [
        "**In the guided review’s Overview:** the problem statement, what is out of scope, and the requirements that shaped the change.",
        "**Only in the file:** `problem.user_asks`, the original requests in the user’s own words. Open the JSON when the exact wording of an access requirement matters.",
      ] },
      "An agent can faithfully describe an implementation of the wrong rule.",
      { h: "Trace the decision through every affected path" },
      "Start at an endpoint the diff touches and follow the identity and the resource ID to the check:",
      { ul: [
        "Where did the identity come from?",
        "Does the resource ID come from the request, or from a trusted lookup?",
        "Does the check run before data is read or changed?",
        "Does every affected route, job, and alternate handler go through it, including error and fallback branches?",
      ] },
      "For the middleware move, ask whether a user can swap the project ID in the URL, body, or query string and reach a project they do not belong to. If the change widens access for service accounts or admins, find the explicit requirement for that exception.",
      "“Every affected path” includes paths your tests do not run. I learned that on Review Assist’s own access boundary. The Author role’s grant of file access was written once for every client. Claude Code got a correct allowlist; Codex and generic clients were told to use four tool names they do not have. In the [fix commit’s](https://github.com/uditk2/review-assist/commit/940d874) words: “WHY IT SHIPPED: the tests were Claude-only.” The grant is now per client, and so are the tests.",
      "The guided tour anchors each stop to diff hunks. Use it to find the changed handlers and policy code, then follow the call path past the highlighted lines. Coverage tells you a stop overlaps each changed hunk. It cannot tell you the stop is right, or that access paths outside the diff are safe.",
      { h: "Challenge the assumptions that decide the boundary" },
      "Authorization bugs often hide in a premise: roles do not change during a request, cache entries expire quickly enough, an admin exemption applies everywhere, a resource always belongs to one project. The guided review lists the unverified assumptions with If wrong and How to verify. For an access change, also read the `grounded_in_code` ones in the JSON; that label is the agent’s own claim.",
      "A good review question is specific: “If membership is removed after the role cache is filled, can the same user still read the project? What invalidates that entry, and what is the maximum delay?” Record the answer against the code path. If the policy allows a delay, make that acceptance visible in the review.",
      { h: "Ask for denial-path evidence" },
      "A test that proves a member can read a project does not test the boundary. Ask for:",
      { ul: [
        "A nonmember request to the same resource.",
        "A member request after removal.",
        "A request that changes the resource ID while keeping the same identity.",
        "An admin or service-account case, when the PR changes that exception.",
      ] },
      "For each, read the assertion: the protected data must not be returned or changed. A denial test in this repo looks like that. The [role test](https://github.com/uditk2/review-assist/blob/1151c9735ab27adb69a1a198487b4c4b623af89e/packages/mcp-server/test/roles.test.ts#L234-L239) asserts that the Author is granted nothing that can write or execute, and says why: “a role that can edit the repository it is describing can make its own answers true.”",
      "Prefer a boundary where the forbidden action does not exist over one where it is refused. Review Assist’s [role gate](https://github.com/uditk2/review-assist/blob/1151c9735ab27adb69a1a198487b4c4b623af89e/packages/mcp-server/src/index.ts#L104-L115) never registers the other role’s tools, so an Author instance has no `submit_document` to call, whatever the agent driving it tries. When a PR replaces a structural boundary like that with a runtime check, ask why.",
      "The guided review’s Verification step shows what ran and its result. Any attached evidence is only in the JSON. If the denial path is missing, ask for the smallest test or manual reproduction that would settle it. [Reviewing an untested path](/blog/how-to-review-untested-paths-in-ai-prs/) goes deeper on that decision.",
      { h: "Make the approval condition explicit" },
      "Request changes when the access rule is unclear, an affected path skips enforcement, or a serious denial case is unverified. In the guided review:",
      { ul: [
        "**Mark the deciding assumption Blocks merge.** It lands under its own heading in your review, and the submit step suggests Request changes.",
        "**Write a missing denial test into the review body.** Not verified items have no decision buttons, so a gap only becomes a condition when you write it down.",
        "**Make the question permanent.** Add a [`.reviewer/` rule](/blog/how-to-add-repository-review-rules-for-ai-prs/) such as “when a diff touches an authorization check, ask which test exercises the denied caller,” and the Reviewer will ask it during the interview, before the PR opens.",
      ] },
      "If the team accepts a bounded risk, name the policy owner, the exact gap, and the follow-up. Do not move an unverified denial case into `verification.performed` to make the document look complete.",
      "Review Assist’s local checks cover document structure, coverage, staleness, cross-references, and likely secrets; the GitHub App recounts coverage on the PR. Neither is a security scanner. The [architecture](https://github.com/uditk2/review-assist/blob/main/docs/ARCHITECTURE.md) draws the line between those checks and the human review.",
      "The closing question for an access change: can you point to the rule, every path that enforces it, and evidence that the forbidden caller is denied? If one of the three is missing, you have your next request.",
    ],

    slug: "how-to-re-review-an-ai-pr-after-a-new-push",

    title: "How to re-review an AI-written PR after a new push",
    summary: "Use the new PR head as the review boundary: inspect changed behavior, refresh the explanation and evidence, then decide what needs another look.",
    hero: "/blog/how-to-re-review-an-ai-pr-after-a-new-push.jpg",
    alt: "An engineer examines a revised code change handed over by a teammate while the earlier version sits aside",
    caption: "A new push changes the evidence the review decision rests on.",
    body: [
      "After an AI agent pushes more commits to a pull request, treat the new head as a new state of the change. Find what changed since your last read. Check whether the Intent Document still explains the current diff, and whether the new code changes any assumption, test result, or accepted risk. Do not carry an earlier approval forward from memory.",
      "The Intent Document is the JSON file Review Assist commits at `.intent/<branch>.json`. It records what was asked, what the agent assumed, what it tried, a guided tour anchored to the diff, and what was verified. A new push can leave any part of it describing a change that no longer exists.",
      "So the question is not “did the agent address my comment?” It is “what is true about this PR now, and what supports it?” A fix can add a fallback, move a permission check, or change a test while closing the original thread.",
      { h: "Start with the delta since your last review" },
      "In GitHub, compare the latest head with the commit you last reviewed. Read the new commits and their combined effect on the full PR diff. After a rebase or force-push, commit-by-commit comparison gets noisy; review the final diff and the behavior instead. Before you open the guided review, write down which paths or claims need a second look.",
      "Suppose you asked for a test proving that logout invalidates a cached session. The next push adds that test, and also changes cache eviction on a network error. The test may answer your original question. The eviction change is a separate review item, even though it sits in the same file.",
      { h: "Check the document against the current head" },
      "The document records the commit range it explains. I built two guards around that on the authoring side:",
      { ul: [
        "**The validator** compares the document’s recorded `head_sha` with the head it is given.",
        "**Submit** refuses if the branch moved after the distillation run opened. The refusal goes to the Intent Reviewer, the role that submits. It is told to call `compute_diff` again on the same run. The interview stays on the run, and every tour stop has to be re-anchored against the renumbered hunks.",
      ] },
      "Those [submit-time refusals](https://github.com/uditk2/review-assist/blob/1151c9735ab27adb69a1a198487b4c4b623af89e/packages/mcp-server/src/index.ts#L1577-L1597) stop the authoring flow from publishing an explanation of an older change. They cannot stop anyone pushing more code after the document is committed.",
      "That is the GitHub App’s job. On every push to a PR it reads the document and diff at the new head and posts a fresh check. The check recounts coverage only: how many substantive hunks (changed blocks that add or remove at least one non-blank line) overlap a tour anchor. It does not rerun the staleness, schema, cross-reference, or redaction checks, so a green check after a push does not prove the document was revised. [What a green check tells you](/blog/what-a-review-assist-check-means/) covers each state.",
      "My own [PR #19](https://github.com/uditk2/review-assist/pull/19) is a real case. Its Intent Document was written for the branch at `62aeec7`. Eleven more commits landed before I opened the PR: more server fixes, five blog posts, image refreshes, and a redesign of the guided review. I never regenerated the document. The check the App posted when I opened the PR read **10/107 changes explained**, which was the right signal: the document still described an earlier change.",
      "For an [unexplained hunk](/blog/how-to-spot-unexplained-changes-in-ai-written-prs/), ask what behavior it adds before treating the count as the task. An anchor with a thin explanation is still a thin explanation. And two things the count will not tell you:",
      { ul: [
        "**Whether the document is stale.** Neither the App nor the guided review compares the document’s recorded `meta.commit_range.head_sha` with the PR head. A stale document can still show a full count if the new commits only touch lines its anchors already cover. Open the file and compare the two SHAs yourself.",
        "**Whether old decisions still apply.** Your Accept, Ask the author, and Blocks merge choices are read back from every earlier review and keyed by item ID. If a regenerated document reuses an ID such as `A3` for a different premise, it can show as already decided. Reload the guided review after a push, and re-read anything marked decided; comments post against the head the page loaded.",
      ] },
      "If the document is missing, stale, or its tour skips new hunks, ask the author to regenerate it for the new head.",
      { h: "Revisit the claims the new code can invalidate" },
      { ul: [
        "**Assumptions:** did the new path make an earlier premise matter more, or reveal a new one? Reopen the question, even if the old thread was resolved.",
        "**Scope:** does the fix add behavior beyond the request? Check the original ask and get an owner decision for extra work. The [scope review](/blog/how-to-check-scope-drift-in-ai-written-prs/) separates a necessary dependency from opportunistic cleanup.",
        "**Verification:** does the reported test exercise the final code and the failure you asked about? Read `verification.performed` beside `verification.not_verified`. A test run on the previous head is evidence about the previous head.",
      ] },
      "For the cache example, check that the new test warms the cache, logs out, then retries the same token before expiry, and read its assertion. Then inspect the new network-error branch on its own. If it can keep a revoked token usable, the original risk is still open despite the new test.",
      { h: "Close the loop on the new state" },
      "Answer each earlier thread with the evidence that resolves it, or keep it open with a narrower request. If the push adds a new risk, comment on that code. In your review, record which head you evaluated, what was verified, and what you accepted without a check. The Approve or Request changes decision stays yours, in GitHub.",
      "Re-reviewing a pull request after a push, in short:",
      { ul: [
        "Compare the delta since your last review.",
        "Read the final diff, not just the new commits.",
        "Check the Intent Document against the new head.",
        "Revisit the assumptions, scope, and verification the new code touches.",
        "Make a fresh decision.",
      ] },
      "The [Intent Document specification](https://github.com/uditk2/review-assist/blob/main/SPEC.md) defines the fields. The [architecture](https://github.com/uditk2/review-assist/blob/main/docs/ARCHITECTURE.md) shows where the local checks and the GitHub App run.",
    ],

    title: "How to check scope drift in an AI-written PR",

    body: [
      "To check scope drift in an AI-written PR, compare the original request with what the diff actually changes. For each behavior that goes beyond the request, ask who authorized it, what it depends on, and whether it can be reviewed and shipped separately. A tidy explanation from the agent is context. It is not approval for extra work.",
      "This is a pull request review problem even when every hunk has a good explanation. Coverage tells you the tour accounts for the code. It does not tell you the code belongs in the change.",

      "Start with the ticket or conversation that authorized the work. Then read what the Intent Document says about it. That is the JSON file Review Assist commits at `.intent/<branch>.json` to explain a change: what was asked, assumed, tried, and verified.",
      { ul: [
        "**In the guided review’s Overview:** the problem statement, whether it was stated up front or defined over the course of the session, and anything marked out of scope.",
        "**Only in the file:** `problem.user_asks`, the key requests in the user’s own words. The Overview does not show them, so open the document in the PR when exact wording matters.",
      ] },
      "Do not treat either artifact as the sole authority. An agent can misstate the problem or miss a later decision. Compare its account with the actual request and any human follow-up. If the request changed, find out who changed it and when before judging the diff against it.",
      { h: "Trace each extra behavior to a reason" },
      "Read `approach.requirements` for the constraints and, where recorded, where each came from. Then follow the guided tour to the hunks that implement them. `approach.trials` explains why alternatives were dropped. A tour stop’s `why` says why the agent believes a change exists. None of these proves the requester agreed to a broader outcome.",
      "Each tour stop’s header also shows where its explanation came from: from the transcript, confirmed in the interview, or inferred from the code. An `inferred_from_code` stop means the agent rebuilt the reason from the code alone, with no session behind it. That is the first place to look for drift.",
      "Two of my own PRs show both sides:",
      { ul: [
        "**Recorded:** [PR #9](https://github.com/uditk2/review-assist/pull/9) started as a change to how the document is written. A second session I was running at the same time redesigned the landing page and added release notes, and I chose to commit both together. The Intent Document says so. The redesign is in `user_asks`, appears as requirements sourced to “user, session B”, and has its own tour stops, while splitting the two sessions is listed as out of scope. A reviewer can see the expansion and who approved it.",
        "**Not recorded:** [PR #19](https://github.com/uditk2/review-assist/pull/19) is titled “Distillation handoff fixes, guided review redesign, and new blog articles”. Its document lists four user asks, none about the redesign or the blog posts. The one blog commit inside its range, `62aeec7`, it flagged as tour stop T7: from outside the session, tied to no plan item. The rest came after it was written. Nothing in it authorizes them, and the App’s 10/107 showed the document did not explain them. Whether they belonged was still my call, and they had a cost: that blog commit left the generated stylesheet 55 bytes stale until a later fix.",
      ] },
      "For each suspect change, write down three things: the behavior it changes, the request or constraint that justifies it, and the cost of separating it. That keeps the discussion on an observable effect rather than on whether the file looks related. If a hunk has no tour stop at all, start with the [unexplained-change review](/blog/how-to-spot-unexplained-changes-in-ai-written-prs/).",
      { h: "Separate necessary work from opportunistic work" },
      { ul: [
        "**Necessary dependency:** the requested behavior cannot work safely without it. A session cache, for example, needs logout to invalidate its entries. Ask for the dependency to be stated in the PR and covered by a test.",
        "**Approved expansion:** a human explicitly added the work. Check that the approval covers this exact behavior and that the Intent Document records the updated ask, as PR #9 does.",
        "**Opportunistic change:** the agent found nearby cleanup or a new feature while implementing the ask. Request a separate PR unless the owner deliberately accepts the extra review and release risk.",
      ] },
      "This is a decision aid, not a check result. Review Assist’s local checks cover document structure, coverage, staleness, cross-references, and likely secrets, and the GitHub App recounts coverage on the PR. None of them can tell whether a change was in scope. The [Intent Document format](https://github.com/uditk2/review-assist/blob/main/SPEC.md) describes the problem, approach, and tour fields; the [architecture](https://github.com/uditk2/review-assist/blob/main/docs/ARCHITECTURE.md) shows which checks run where.",
      { h: "Make the review request specific" },
      "A good comment names the extra behavior and the decision you need: “This PR renames the response field API clients use. I cannot find that in the original request or a later approved ask. Was it required for this change? If not, please move it to a separate PR. If it was, link the decision and add a compatibility check.”",
      "If the extra work stays, ask the author to update the document’s problem, requirements, and tour to match the agreed scope, then review the new diff and verification. Rewriting the document does not turn an unapproved change into an approved one. If the work is removed, check that the removal did not break the requested path.",
      "Recover the ask, map each changed behavior to an authorized reason, and settle the rest with the owner. That lets a team accept a real dependency without quietly shipping whatever the agent improved nearby.",
    ],
  },

      "If the document only says “not fully tested,” ask the author to name the path, the input, and the expected result. A vague gap cannot support a review decision. If the diff has an [unexplained change](/blog/how-to-spot-unexplained-changes-in-ai-written-prs/), settle its purpose first; you cannot judge verification against an unknown intent.",

    date: "8 Oct 2026",

    title: "Where your code and transcript go in Review Assist",
    summary: "The raw transcript stays local. The Intent Document lives in GitHub. The hosted App sees the diff in transit on each PR push and when a reviewer opens the guided review.",
    hero: "/blog/where-code-and-transcript-go-in-review-assist-v3.jpg",
    alt: "A developer keeps a large session archive behind while passing a slim review folder to another engineer",
    caption: "Follow each artifact to the place it actually lives.",
    body: [
      "If your team reviews private code, “we do not store your code” answers only part of the question. You also need to know what leaves the developer’s machine, what gets committed to GitHub, and what a hosted service handles while someone reads the pull request.",
      "I built Review Assist so each of those has one answer:",
      { ul: [
        "**The coding transcript** stays on the developer’s machine. The local MCP server reads it there. (The Author’s reads go to your coding agent’s own model provider, which already holds the session.)",
        "**The Intent Document** is the JSON file the MCP server writes to `.intent/<branch>.json` after consent and validation. It records what was asked, what the agent assumed, what it tried, a guided tour of the diff, and what was verified. You commit it, so GitHub stores it with the PR.",
        "**The diff** passes through the hosted GitHub App in transit, on each PR event and each guided-review request. The App keeps no copy.",
      ] },
      { h: "The transcript stays in the local authoring flow" },
      "Two agent roles produce the document. The Author reads the coding session through a local [conversation spine](/blog/conversation-spine-code-review-context/). The cold Intent Reviewer reads the diff and asks the Author questions. The Reviewer gets no transcript tools in any client. In Claude Code its tool allowlist also excludes file tools; Codex and other clients bring their own shell and file tools, so there the Reviewer is kept cold by its role-scoped MCP tools and its instructions, not by a sandbox. Either way, all of this runs on the developer’s machine.",
      "Questions and answers pass through a local run file under `~/.review-assist/runs/`. That is local state, not a copy of the transcript in the hosted App.",
      "Before writing `.intent/<branch>.json`, the local submit checks repository consent, schema, diff coverage, staleness, cross-references, and likely secrets. The MCP server itself never calls a model. Your coding agent’s own model connection is a separate data path, governed by that agent and its provider. This post covers Review Assist’s path only.",
      { h: "The Intent Document is repository content" },
      "The document is a curated review artifact, not a session archive. It can still carry sensitive context: the problem, quoted user requests, assumptions, rejected approaches, tour notes, and verification results. Once committed, it lives under the repository’s access controls and follows the same PR history as the code.",
      "The redaction check blocks a submission that matches one of six known credential patterns: an AWS access key ID, a GitHub token, a Slack token, a private key block, an `api_key`, `secret`, `password`, or `token` assignment with a quoted value, and a connection string with credentials. Anything else gets through: a JWT, a Stripe or Google key on its own, an internal hostname, a customer name. Read the document before committing it, especially quoted requests and examples copied from the session. Treat it like any other file you publish to the repository.",
      { h: "The hosted App sees the diff in transit" },
      "On every pull request event (opened, pushed to, reopened), the GitHub App reads the committed document and the diff to post its check and summary, and writes an Intent section into the PR description. When a signed-in reviewer opens the guided review, the Worker fetches the document and PR diff from GitHub with that reviewer’s own token and passes them to the browser, which renders the review.",
      { ul: [
        "**No storage:** the Worker has no database and no server-side session store.",
        "**No caching:** responses carrying repository data are sent with `Cache-Control: private, no-store`. Static site assets are cached, and they contain no PR data.",
        "**Your token:** kept in an encrypted, HttpOnly, Secure cookie, not a server-side session table.",
        "**Your draft decisions:** while you review, your Accept / Ask the author / Blocks merge choices and notes are kept in your browser’s local storage. They leave it only when you send the review.",
      ] },
      "No storage is not the same as no exposure. The Worker does receive private repository content for the length of a request. If your policy rules out even that, [self-host the App](https://github.com/uditk2/review-assist/blob/main/docs/SELF_HOSTING.md): the same Worker on your Cloudflare account, under your own GitHub App registration. Nothing changes on the developer’s side.",
      "Review comments, replies, checks, the summary comment, the Intent section the App writes into the PR description, and the final verdict are durable GitHub records. Expect them to stay on the pull request.",
      "The [Worker’s document handler](https://github.com/uditk2/review-assist/blob/1151c9735ab27adb69a1a198487b4c4b623af89e/apps/github-app/worker/src/index.ts#L161-L218) shows what the App fetches and the `no-store` flag. The [session code](https://github.com/uditk2/review-assist/blob/1151c9735ab27adb69a1a198487b4c4b623af89e/apps/github-app/worker/src/session.ts#L10-L46) shows what the cookie holds and how it is sealed.",
      { h: "What analytics see" },
      "I measure the install funnel, so here is exactly what that touches. The Worker sends Google Analytics an event name, counts, GitHub’s all-or-selected repository setting, and the PR action. Never a repository, owner, or account name, and never content. Each installation is counted under a keyed hash of its ID, not the ID itself.",
      "The website loads Google Analytics and Microsoft Clarity on reviewassist.dev pages, never on a pull request’s guided review. If a review page ever rendered without that gate noticing, Clarity’s masking is set to Strict as a second line. A self-hosted copy loads neither on its pages, and its Worker reports nothing unless you set your own analytics secret. The [analytics module](https://github.com/uditk2/review-assist/blob/main/apps/github-app/worker/src/analytics.ts) lists what is sent.",
      { h: "Check the boundary before using it on a private repo" },
      { ul: [
        "**Read the document before you commit it.** Look for customer details, internal URLs, prompts, credentials, or anything you would not put in the PR description.",
        "**Match access to intent.** Confirm the App installation and reviewer access cover only the repositories your team means to expose. The guided review reads through GitHub access, not an anonymous endpoint.",
        "**Decide on transit.** If hosted transit is not allowed, self-host the App. If your concern is the coding model provider, review that provider’s settings separately.",
        "**Verify it yourself.** Open the browser network panel on a guided review and find `/api/document`. It carries the document and diff, and its response says `Cache-Control: private, no-store`.",
      ] },
      "That is the privacy test I would apply to any AI code review tool: trace each artifact to its durable home, and each service that touches it on the way. [The architecture](https://github.com/uditk2/review-assist/blob/main/docs/ARCHITECTURE.md) has the full boundary. Then [try it](/#install) on a non-sensitive PR before it becomes part of your team’s review process.",

    title: "How to add repository-specific review questions for AI-written PRs",
    summary: "Put the invariants your team learned the hard way in .reviewer/, then check that they become specific questions during AI PR review.",
    hero: "/blog/how-to-add-repository-review-rules-for-ai-prs-v3.jpg",

    caption: "Ask the repository's question where the changed code can answer it.",
    body: [
      "A team knows things a generic reviewer cannot infer from a diff. A schema edit may need a backfill. A change to an authentication path may need a logout test. If that knowledge lives only in a senior engineer’s head, an AI-written pull request can look complete while skipping the one question that matters.",
      "Review Assist turns a coding session into an Intent Document, the JSON file committed at `.intent/<branch>.json` that explains a change. A cold Intent Reviewer reads the diff and questions an Author that holds the session. I added a `.reviewer/` folder in [PR #11](https://github.com/uditk2/review-assist/pull/11) so a repository can hand that Reviewer its own questions. It reads the folder after the diff and before its first interview round, and asks your questions alongside the baseline ones.",
      { h: "Write a question tied to a real invariant" },
      "Start with a failure your team has seen, or a pairing your system depends on. Write the rule as a conditional question, with the evidence that would settle it. “Check migrations” is not enough if a reviewer cannot tell which change should trigger it.",
      "Say every new non-null column must come with a backfill for existing rows. A good `.reviewer/README.md` rule is: “When a migration adds a non-null column, ask which step backfills existing rows and which test exercises an old row. If there is no backfill, ask why existing rows cannot occur.”",
      "That question names the trigger, the risk, and the evidence, and it allows a valid answer when the premise does not apply. “Verify database changes” leaves both the reviewer and the author guessing.",
      { h: "Keep the folder small and reviewable" },
      "Commit Markdown in `.reviewer/` with the code. A README holds the rules that apply everywhere; separate files can hold area-specific ones, such as `verification.md` for what counts as tested. The [house rules for this repo](https://github.com/uditk2/review-assist/blob/main/.reviewer/README.md) are a working example. Each is a condition with its reason: a prompt edit needs its observed before-and-after behavior, and a change under `packages/schema` is never incidental, because other repositories already hold documents written against the schema.",
      { ul: [
        "**Prefer questions over commands.** Ask what a change proves or what risk it leaves, instead of prescribing an answer the code may not support.",
        "**Do not repeat the baseline.** Every run already asks six standing questions: the plan and how it changed, what the user asked for, what was tried and abandoned, what was assumed, which changes are incidental, and what was actually run. Your rules should add what the diff alone cannot tell a reader.",
        "**Review rule changes like code.** The folder is repository content, so a pull request can edit it. Review Assist treats it as untrusted reference material and counts `.reviewer/` changes in diff coverage.",
      ] },
      "Like every tool result in Review Assist, the folder is bounded. The tool reads `.md`, `.markdown`, and `.txt` files: up to 50 files in the folder and two levels of subfolders, about 64,000 characters per file, and about 20 KB per response by default. Files that do not fit come back listed in `omitted`, so the Reviewer can request them by name. Other file types are listed but not read. An empty or absent folder is normal and leaves the baseline in place. The [folder reader](https://github.com/uditk2/review-assist/blob/1151c9735ab27adb69a1a198487b4c4b623af89e/packages/mcp-server/src/reviewer-instructions.ts#L25-L190) has the details.",
      { h: "Check the question reached the review" },
      "In this repo it does. The Intent Document for my [PR #19](https://github.com/uditk2/review-assist/pull/19) carries six questions that start with “House rule.” Two of them led to fixes before merge:",
      { ul: [
        "**Response bounds:** the Reviewer asked what limited the size of `existing_interview`, a field read from repository content and echoed whole into an error message. Nothing did, and it was bounded.",
        "**The viewer is verified in a browser or not at all:** the Reviewer asked whether the page had actually been opened. It had not, and the generated stylesheet turned out to be stale.",
      ] },
      "To test a new rule, use a representative PR that triggers it. Generate its Intent Document, then read the interview and the Reviewer’s closing findings. If the question never appears, check what `compute_diff` reported about the folder, then which files the tool marked unreadable or `omitted`. A folder holding no readable Markdown was exactly the bug fixed before [1.0.3](/releases/1.0.3/) shipped. If the file arrived, make the trigger more explicit.",
      "One consequence to know: the rules are read from the working tree when the distillation runs. A pull request that weakens a rule is reviewed under the weakened rule, which is one more reason to review rule edits like code.",
      "The folder does not turn a convention into a failing check. Your rules add questions; they cannot add a schema field, relax a check, or excuse the interview. A repository question can expose a missing migration or test, but someone still has to judge the answer and fix the code when the evidence is weak.",
      "Keep each rule tied to a real failure mode, and edit it in the same pull request when that failure mode changes. Then the next reviewer inherits a code review workflow they can inspect, not a checklist that quietly goes stale. Read [the architecture](https://github.com/uditk2/review-assist/blob/main/docs/ARCHITECTURE.md) for the interview boundary, or [install Review Assist](/#install) to try a rule on a real PR.",
    ],
