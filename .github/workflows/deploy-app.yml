# Manually deploy the GitHub App (Cloudflare Worker + static viewer).
# Trigger: Actions tab → "Deploy review app" → Run workflow.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_ZONE_ID.
# CLOUDFLARE_API_TOKEN needs Zone > Cache Purge > Purge on the reviewassist.dev zone, in
# addition to whatever scope `wrangler deploy` already needs — the purge step below reuses
# it rather than adding a second token.
name: Deploy review app
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [production, staging]
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build viewer stylesheet
        run: npm run build --workspace @review-assist/viewer

      - name: Typecheck worker
        run: npm run typecheck --workspace @review-assist/github-app-worker

      - name: Deploy Worker + assets
        working-directory: apps/github-app/worker
        run: npx wrangler deploy ${{ inputs.environment == 'staging' && '--env staging' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Static assets now carry a 24h Cache-Control (see cacheableAsset in src/index.ts),
      # so they no longer revalidate on every request — but nothing is filename-hashed, so
      # without a purge here a stale edge copy would outlive this deploy by up to a day.
      # Scoped to production: staging isn't served from the reviewassist.dev zone.
      - name: Purge Cloudflare cache
        if: inputs.environment == 'production'
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
