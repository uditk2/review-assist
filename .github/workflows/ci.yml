name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build all packages
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npx vitest run
      - name: Validate the example document
        run: node packages/validator/dist/cli.js validate packages/schema/src/example.json
