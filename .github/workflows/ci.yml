name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Anthropic's plugin directory downloads this repository as GitHub archives it and
      # will not validate one over 50 MiB, so an oversized repo fails before any check
      # runs. Blog images are what grows it: commit heroes as JPEG, not PNG. 45 leaves room.
      - name: Repository archive stays under the plugin directory's limit
        run: |
          size=$(git archive --format=tar.gz HEAD | wc -c)
          echo "archive: $((size / 1048576)) MiB"
          [ "$size" -le $((45 * 1048576)) ] || { echo "Archive is over 45 MiB; the plugin directory stops at 50."; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build all packages
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npx vitest run
      - name: Validate the example document
        run: node packages/validator/dist/cli.js validate packages/schema/src/example.json

      # The build regenerates manifest.json and server.json from package.json. If that
      # produces a diff, the committed copies were stale — which is how a release once
      # shipped a server reporting the previous version.
      - name: Generated files are current
        run: git diff --exit-code || { echo "Run 'npm run build' and commit the result."; exit 1; }

      # Invariants no generator owns: identifiers that must agree across files, and the
      # absence of a hand-written version literal.
      - name: Release consistency
        run: npm run check:release

      # The plugin and its marketplace, checked the way Claude Code loads them. A pinned
      # version, so a new Claude Code release cannot turn CI red overnight; 2.1.281 or later
      # is needed to know the directory's listing fields under --strict.
      - name: Claude Code plugin validates
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.295 plugin validate --strict plugins/review-assist
          npx --yes @anthropic-ai/claude-code@2.1.295 plugin validate --strict .
