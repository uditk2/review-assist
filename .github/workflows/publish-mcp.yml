# Publish the MCP server to npm and cut the GitHub release.
#
# Auth: npm Trusted Publishing (OIDC). There is no NPM_TOKEN secret — npm verifies
# this workflow's identity directly, so no long-lived credential is stored anywhere.
# One-time setup on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
# repository uditk2/review-assist, workflow publish-mcp.yml.
#
# Trigger: Actions tab -> "Publish MCP server" -> Run workflow.
name: Publish MCP server
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (patch | minor | major) or an explicit x.y.z"
        required: true
        default: "patch"
      dry_run:
        description: "Build and pack only; do not publish or release"
        type: boolean
        default: false
      release_only:
        description: "Skip the npm publish and bump; just cut the release for the current version"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the version-bump commit + tag, create the release
      id-token: write   # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Check out the branch, not a detached HEAD: `npm version` commits here and
          # the push below needs a branch to land on, or only the tag gets pushed and
          # main keeps the old version.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Trusted publishing needs npm >= 11.5.1, which Node 24 already bundles. Do NOT
      # `npm i -g npm@latest` here: it makes every run depend on whatever npm shipped
      # that hour, so a green pipeline can turn red without the repo changing.
      # Note: no registry-url on setup-node either, on purpose — it writes an
      # _authToken line into .npmrc that breaks OIDC.
      - name: Check the toolchain
        run: |
          echo "node $(node -v), npm $(npm -v)"
          npx --yes semver -r ">=11.5.1" "$(npm -v)" >/dev/null \
            || { echo "npm $(npm -v) is too old for trusted publishing"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

      # `npm version` run inside a workspace directory bumps package.json but performs
      # NO git operations at all — there is no .git in packages/mcp-server, so it silently
      # skips the commit and tag. That shipped 0.2.3 to npm while main stayed on 0.2.2.
      # Bump without git, then commit and tag from the repo root ourselves.
      - name: Bump version
        if: ${{ !inputs.release_only }}
        run: npm version "${{ inputs.version }}" --no-git-tag-version --workspace packages/mcp-server

      # Read it back from disk rather than parsing npm's stdout, which prints the package
      # name alongside the version.
      - name: Resolve version
        id: v
        run: echo "version=$(node -p "require('./packages/mcp-server/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: ${{ !inputs.dry_run && !inputs.release_only }}
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/sync-version.mjs
          git add -A
          git commit -m "release(mcp-server): v$V"
          # Annotated, not lightweight: `git push --follow-tags` below only pushes
          # annotated tags, so a lightweight one stays in the runner and the release
          # step then fails with "tag exists locally but has not been pushed".
          git tag -a "v$V" -m "review-assist-mcp v$V"

      - name: Publish to npm
        if: ${{ !inputs.dry_run && !inputs.release_only }}
        working-directory: packages/mcp-server
        run: npm publish --access public

      - name: Pack the desktop extension
        run: npx --yes @anthropic-ai/mcpb pack packages/mcp-server review-assist-mcp.mcpb

      - name: Push version commit and tag
        if: ${{ !inputs.dry_run && !inputs.release_only }}
        run: git push origin HEAD:${{ github.ref_name }} --follow-tags

      # The MCP registry namespaces servers by identity: io.github.uditk2/* belongs to
      # whoever controls that GitHub account. github-oidc proves it from the workflow,
      # so there is no device-code step and no cached token on anyone's laptop, and the
      # registry entry tracks each release instead of drifting.
      - name: Publish to the MCP registry
        if: ${{ !inputs.dry_run && !inputs.release_only }}
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" review-assist-mcp.mcpb --clobber
          else
            gh release create "$TAG" review-assist-mcp.mcpb \
              --title "$TAG" --generate-notes
          fi

      - name: Pack only (dry run)
        if: ${{ inputs.dry_run }}
        working-directory: packages/mcp-server
        run: npm pack
