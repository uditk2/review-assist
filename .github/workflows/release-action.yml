# Manually cut a release of the GitHub Action: bundle it, commit the built
# dist/main.cjs, and move the major tag (v0) so consumers on @v0 get the update.
# Trigger: Actions tab → "Release GitHub Action" → Run workflow.
name: Release GitHub Action
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Full tag to create, e.g. v0.1.1"
        required: true
        default: "v0.1.0"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Bundle the action
        run: npm run bundle --workspace @review-assist/github-action

      - name: Commit built action and move tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apps/github-action/dist/main.cjs
          git commit -m "build(action): release ${{ inputs.tag }}" || echo "no changes"
          git tag -fa "${{ inputs.tag }}" -m "${{ inputs.tag }}"
          MAJOR="$(echo '${{ inputs.tag }}' | sed -E 's/^(v[0-9]+).*/\1/')"
          git tag -fa "$MAJOR" -m "$MAJOR (moving tag)"
          git push origin HEAD:${{ github.ref_name }}
          git push -f origin "${{ inputs.tag }}"
          git push -f origin "$MAJOR"
