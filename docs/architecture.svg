<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-labelledby="title desc">
<title id="title">Review Assist system architecture</title>
<desc id="desc">A container-level topology. The external Developer works through the developer machine, which creates an Intent Document. GitHub stores the pull request and all review state. The Review Assist Application provides webhook automation and guided review. The Human Reviewer also remains outside every system boundary.</desc>
<defs>
      <style>
        .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
        .title { font-size: 27px; font-weight: 650; fill: #1c1917; }
        .subtitle { font-size: 15px; fill: #57534e; }
        .boundary-title { font-size: 17px; font-weight: 650; fill: #1c1917; }
        .node-title { font-size: 16px; font-weight: 650; fill: #1c1917; }
        .body { font-size: 14px; fill: #57534e; }
        .small { font-size: 12.5px; fill: #78716c; }
        .tiny { font-size: 11.5px; fill: #57534e; }
        .strong { font-weight: 600; fill: #292524; }
        .pill-text { font-size: 12px; fill: #292524; }
        .boundary { fill: #f7f6f5; stroke: #d6d3d1; stroke-width: 1.2; }
        .node { fill: #ffffff; stroke: #d6d3d1; stroke-width: 1.1; }
        .application { fill: #f7f6f5; stroke: #60a5fa; stroke-width: 1.4; }
        .accent-node { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.1; }
        .soft-node { fill: #fafaf9; stroke: #d6d3d1; stroke-width: 1; }
        .pill { fill: #ffffff; stroke: #d6d3d1; stroke-width: 1; }
        .pill-accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1; }
        .divider { stroke: #e7e5e4; stroke-width: 1; }
        .actor { fill: #ffffff; stroke: #0a6ae0; stroke-width: 1.5; }
        .arrow { fill: none; stroke: #a8a29e; stroke-width: 1.6; marker-end: url(#arrow); }
        .blue-arrow { fill: none; stroke: #0a6ae0; stroke-width: 1.8; marker-end: url(#blue-arrow); }
        .blue-bidi { fill: none; stroke: #0a6ae0; stroke-width: 1.7; marker-start: url(#blue-arrow); marker-end: url(#blue-arrow); }
      </style>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 1.2 L8.5 5 L0 8.8" fill="none" stroke="#a8a29e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 1.2 L8.5 5 L0 8.8" fill="none" stroke="#0a6ae0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
<rect width="1320" height="790" fill="#fbfaf9"/>
<text x="40" y="52" class="sans title">Review Assist</text>
<text x="40" y="80" class="sans subtitle">Container-level system topology</text>
<rect x="40" y="110" width="330" height="520" rx="12" class="boundary"/>
<rect x="430" y="110" width="330" height="520" rx="12" class="boundary"/>
<rect x="820" y="110" width="450" height="520" rx="12" class="application"/>
<text x="66" y="145" class="sans boundary-title">Developer machine</text>
<text x="344" y="145" class="sans small" text-anchor="end">local</text>
<line x1="66" y1="159" x2="344" y2="159" class="divider"/>
<text x="456" y="145" class="sans boundary-title">GitHub</text>
<text x="734" y="145" class="sans small" text-anchor="end">source of truth</text>
<line x1="456" y1="159" x2="734" y2="159" class="divider"/>
<text x="846" y="145" class="sans boundary-title">Review Assist Application</text>
<text x="1244" y="145" class="sans small" text-anchor="end">service boundary</text>
<line x1="846" y1="159" x2="1244" y2="159" class="divider"/>
<rect x="70" y="190" width="270" height="66" rx="8" class="node"/>
<text x="94" y="217" class="sans node-title">Coding agent + session</text>
<text x="94" y="239" class="sans small">implementation context</text>
<path d="M205 256 L205 286" class="arrow"/>
<rect x="70" y="294" width="270" height="112" rx="8" class="accent-node"/>
<text x="94" y="322" class="sans node-title">MCP Server</text>
<text x="94" y="346" class="sans body">role-scoped tool surfaces</text>
<text x="94" y="369" class="sans body">consent · validation · local write</text>
<text x="94" y="391" class="sans small">no model calls · transcript stays local</text>
<path d="M205 406 L205 436" class="blue-arrow"/>
<rect x="70" y="444" width="270" height="72" rx="8" class="node"/>
<text x="94" y="473" class="sans node-title">Intent Document</text>
<text x="94" y="497" class="mono small">.intent/&lt;branch&gt;.json</text>
<rect x="460" y="190" width="270" height="326" rx="8" class="node"/>
<text x="484" y="219" class="sans node-title">Pull request</text>
<text x="484" y="243" class="sans body">code + Intent Document</text>
<line x1="484" y1="261" x2="706" y2="261" class="divider"/>
<text x="484" y="290" class="sans node-title">Automation output</text>
<text x="484" y="314" class="sans body">Check Run</text>
<text x="484" y="337" class="sans body">summary + guided link</text>
<text x="484" y="360" class="sans body">managed PR-description block</text>
<line x1="484" y1="380" x2="706" y2="380" class="divider"/>
<text x="484" y="409" class="sans node-title">Reviewer-authored activity</text>
<text x="484" y="433" class="sans body">comments + replies</text>
<text x="484" y="456" class="sans body">approve / request changes</text>
<text x="484" y="493" class="sans small">merging stays on GitHub</text>
<rect x="850" y="190" width="390" height="140" rx="8" class="node"/>
<text x="874" y="219" class="sans node-title">Webhook automation</text>
<text x="1216" y="219" class="mono small" text-anchor="end">POST /api/webhook</text>
<text x="874" y="247" class="sans body">pull_request events</text>
<text x="874" y="270" class="sans body">read document + diff · compute coverage</text>
<text x="874" y="293" class="sans body">post check + summary + PR description</text>
<text x="874" y="314" class="sans small">GitHub App installation identity</text>
<rect x="850" y="370" width="390" height="146" rx="8" class="node"/>
<text x="874" y="399" class="sans node-title">Guided review</text>
<text x="1216" y="399" class="sans small" text-anchor="end">application service</text>
<text x="874" y="427" class="sans body strong">Browser SPA</text>
<text x="874" y="450" class="sans body">overview · assumptions · anchored tour</text>
<text x="874" y="482" class="sans body strong">Application API</text>
<text x="874" y="505" class="sans body">live GitHub reads · comments · verdict</text>
<path d="M340 480 C397 480 398 243 452 243" class="blue-arrow"/>
<text x="400" y="452" class="sans small" text-anchor="middle">commit with code</text>
<path d="M730 220 C785 220 794 247 842 247" class="blue-arrow"/>
<text x="786" y="205" class="sans small" text-anchor="middle">pull_request event</text>
<path d="M850 292 C793 292 788 325 738 325" class="blue-arrow"/>
<text x="790" y="309" class="sans small" text-anchor="middle">bot posts</text>
<path d="M738 442 C788 442 799 466 842 466" class="blue-bidi"/>
<text x="790" y="408" class="sans small" text-anchor="middle">GitHub API</text>
<text x="790" y="427" class="sans tiny" text-anchor="middle">reviewer identity</text>
<circle cx="205" cy="691" r="28" class="actor"/>
<circle cx="205" cy="682" r="7" class="actor"/>
<path d="M189 706 C193 690 217 690 221 706" fill="none" stroke="#0a6ae0" stroke-width="1.7"/>
<text x="248" y="684" class="sans node-title">Developer</text>
<text x="248" y="707" class="sans small">external actor</text>
<path d="M205 660 L205 638" class="blue-arrow"/>
<text x="221" y="644" class="sans small">implements change · grants consent</text>
<circle cx="1045" cy="691" r="28" class="actor"/>
<circle cx="1045" cy="682" r="7" class="actor"/>
<path d="M1029 706 C1033 690 1057 690 1061 706" fill="none" stroke="#0a6ae0" stroke-width="1.7"/>
<text x="1088" y="684" class="sans node-title">Human reviewer</text>
<text x="1088" y="707" class="sans small">external actor</text>
<path d="M595 516 L595 691 L1008 691" class="blue-arrow"/>
<text x="802" y="679" class="sans small" text-anchor="middle">guided-review link</text>
<path d="M1045 660 L1045 524" class="blue-arrow"/>
<text x="1061" y="601" class="sans small">opens · reviews · comments</text>
<line x1="40" y1="750" x2="1270" y2="750" class="divider"/>
<text x="40" y="775" class="sans small">Three systems · two external actors · GitHub owns durable review state</text>
<text x="1270" y="775" class="mono small" text-anchor="end">github.com/uditk2/review-assist</text>
</svg>
