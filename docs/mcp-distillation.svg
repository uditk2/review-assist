<line x1="40" y1="1382" x2="1200" y2="1382" class="divider"/>
<text x="40" y="1407" class="sans small">The split is structural: REVIEW_ASSIST_ROLE decides which tools the server registers, so the reviewer cannot reach the transcript at all.</text>
<text x="1200" y="1407" class="mono small" text-anchor="end">github.com/uditk2/review-assist</text>
<text x="40" y="1429" class="sans small">The closing report carries what the document could not settle: unanswered questions, anything left unverified, defects the cold read exposed.</text>
</svg>
