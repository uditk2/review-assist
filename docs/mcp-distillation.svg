<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1190" viewBox="0 0 1240 1190" role="img" aria-labelledby="title desc">
<title id="title">Review Assist MCP distillation detail</title>
<desc id="desc">A component-level detail of local intent distillation. The coding agent orchestrates separate Author and Intent Reviewer subagents. They use role-scoped tool surfaces exposed by the Review Assist MCP Server. The server makes no model calls. compute_diff only opens the run; read_diff pages the change itself. The interview is two-sided and server-attested: the Reviewer records questions and gets a q_id back for each, the Author answers by id, and the Reviewer reads the answers in the Author's own words. The server validates and writes the Intent Document after repository consent. get_role_definitions, manage_consent, and import_session belong to neither role — they set up the split itself and are called by the orchestrating agent.</desc>
