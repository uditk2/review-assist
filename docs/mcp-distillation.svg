<text x="1126" y="336" class="sans tiny strong" text-anchor="end">SUBAGENT</text>
<text x="708" y="364" class="sans body">Never sees the session. Reads the diff cold.</text>
<rect x="708" y="382" width="418" height="104" rx="8" class="soft-node"/>
<text x="726" y="406" class="sans small">Its questions come from three places</text>
<text x="726" y="431" class="sans tiny">· the baseline set carried in its role prompt</text>
<text x="726" y="453" class="sans tiny">· the diff it has just read</text>
<text x="726" y="475" class="sans tiny">· this repository's own .reviewer/ house rules</text>
<text x="708" y="508" class="sans small">Two outputs: the document, and a report back to the session</text>
