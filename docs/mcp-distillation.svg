<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1450" viewBox="0 0 1240 1450" role="img" aria-labelledby="title desc">
<title id="title">How Review Assist distills intent</title>
<desc id="desc">A component-level detail of local intent distillation, read as six numbered steps. The coding agent spawns two role-locked subagents. The Author holds this session's transcript and supplies what the diff cannot show: the ask in the user's own words, what was tried and abandoned, and what was and was not run. The Intent Reviewer never sees the session; it reads the diff cold, and its questions come from three places: the baseline set in its role prompt, the diff itself, and the repository's own .reviewer/ house rules, served by get_reviewer_instructions. Every question and answer passes through the Review Assist MCP Server, which registers a different tool surface per role: the Author has transcript and diff tools but cannot submit or set consent, the Reviewer has diff, house-rule, interview, submission and consent tools but no transcript tools, and get_role_definitions, import_session and manage_consent belong to neither role because the coding agent calls them itself. The interview is server-attested through q_ids. submit_document gates the write behind repository consent, interview attestation and five local checks, and writes .intent/&lt;branch&gt;.json. The Reviewer's closing report carries what the document could not settle back to the session that can still fix the code. The server makes no model calls and the transcript never leaves the machine.</desc>
